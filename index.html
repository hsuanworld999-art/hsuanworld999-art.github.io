<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>ASD 蝸小宣｜HSUAN WORLD</title>

<style>

/* =========================
   基本設定
========================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111;
}

body {
  font-family:
    "Songti TC",
    "Noto Serif TC",
    "PMingLiU",
    serif;
}


/* =========================
   整個大門場景
========================= */

.gate-scene {
  position: relative;

  width: 100vw;
  height: 100vh;

  overflow: hidden;

  background: #111;

  perspective: 1800px;

  -webkit-tap-highlight-color: transparent;
}


/* =========================
   開門後的庭院
========================= */

.open-world {
  position: absolute;
  inset: 0;

  background-image:
    url("hsuan-gate-open.png");

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  z-index: 1;

  transform: scale(1.01);
}


/* =========================
   原始完整關門圖

   作用：
   網站剛進來時保持最漂亮、
   最準確的原始大門。
========================= */

.original-closed {
  position: absolute;
  inset: 0;

  background-image:
    url("hsuan-gate.png");

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  z-index: 6;

  opacity: 1;

  pointer-events: none;

  transition:
    opacity 0.18s ease;
}


/*
   開門開始時，
   原始完整門面退場，
   交給左右獨立門扇。
*/

.gate-scene.animating-open
.original-closed,

.gate-scene.open
.original-closed {

  opacity: 0;
}


/* =========================
   左右門動畫舞台

   這個區域大致對準
   原圖中央的雙門位置。
========================= */

.door-stage {
  position: absolute;

  left: 31.2%;
  top: 24.3%;

  width: 37.7%;
  height: 52.8%;

  z-index: 7;

  perspective: 1400px;

  pointer-events: none;
}


/* =========================
   門扇共同設定
========================= */

.door {
  position: absolute;

  top: 0;

  width: 50%;
  height: 100%;

  background-repeat: no-repeat;
  background-size: contain;

  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;

  filter:
    drop-shadow(
      0 8px 8px rgba(0,0,0,0.22)
    );

  /*
    cubic-bezier（貝茲曲線）
    做出厚木門的重量感：

    開始慢
    中間加速
    最後慢慢停住
  */

  transition:
    transform 2.35s
    cubic-bezier(
      0.22,
      0.72,
      0.20,
      1
    ),
    filter 2.35s ease;
}


/* =========================
   左門
========================= */

.left-door {

  left: 0;

  background-image:
    url("hsuan-gate-left.png");

  background-position:
    center right;

  transform-origin:
    left center;

  transform:
    rotateY(0deg);
}


/* =========================
   右門
========================= */

.right-door {

  right: 0;

  background-image:
    url("hsuan-gate-right.png");

  background-position:
    center left;

  transform-origin:
    right center;

  transform:
    rotateY(0deg);
}


/* =========================
   真正推開
========================= */

.gate-scene.animating-open
.left-door,

.gate-scene.open
.left-door {

  transform:
    rotateY(82deg);

  filter:
    drop-shadow(
      14px 12px 12px
      rgba(0,0,0,0.30)
    );
}


.gate-scene.animating-open
.right-door,

.gate-scene.open
.right-door {

  transform:
    rotateY(-82deg);

  filter:
    drop-shadow(
      -14px 12px 12px
      rgba(0,0,0,0.30)
    );
}


/* =========================
   敲門區
========================= */

.knock-zone {
  position: absolute;

  left: 34%;
  top: 27%;

  width: 32%;
  height: 47%;

  z-index: 30;

  cursor: pointer;

  user-select: none;
  touch-action: manipulation;

  -webkit-tap-highlight-color:
    transparent;
}


/* =========================
   「點三下打開大門」
========================= */

.knock-hint {

  position: absolute;

  left: 50%;
  top: 47%;

  transform:
    translate(-50%, -50%);

  width: 88%;

  text-align: center;
  white-space: nowrap;

  color:
    rgba(255,248,228,0.97);

  font-family:
    "Songti TC",
    "Noto Serif TC",
    "PMingLiU",
    serif;

  font-size:
    clamp(
      17px,
      1.55vw,
      25px
    );

  font-weight: 600;

  letter-spacing: 0.18em;

  text-shadow:
    0 2px 6px
      rgba(0,0,0,0.95),

    0 0 18px
      rgba(255,205,120,0.25);

  opacity: 0;

  transition:
    opacity 0.35s ease;

  pointer-events: none;
}


/* 電腦滑鼠 */

@media
(hover: hover)
and
(pointer: fine) {

  .gate-scene.closed
  .knock-zone:hover
  .knock-hint {

    opacity: 1;
  }
}


/* 手機第一次碰門 */

.knock-hint.touch-show {

  opacity: 1;
}


/* =========================
   開門後關門感應區

   不再只做左右兩小塊。

   整個入口畫面都可以點，
   之後進入房間時，
   JS（JavaScript 程式語言）
   再把它停用。
========================= */

.close-zone {

  position: absolute;
  inset: 0;

  z-index: 20;

  display: none;

  cursor: pointer;

  -webkit-tap-highlight-color:
    transparent;
}


/* 門完全開啟才允許關門 */

.gate-scene.open
.close-zone {

  display: block;
}


/* =========================
   關門提示
========================= */

.close-hint {

  position: absolute;

  left: 50%;
  top: 78%;

  transform:
    translate(-50%, -50%);

  padding:
    8px 18px;

  border-radius:
    30px;

  background:
    rgba(25,18,12,0.38);

  color:
    rgba(255,248,232,0.88);

  font-family:
    "Songti TC",
    "Noto Serif TC",
    serif;

  font-size:
    clamp(
      13px,
      1vw,
      17px
    );

  letter-spacing:
    0.12em;

  opacity: 0;

  transition:
    opacity 0.35s ease;

  pointer-events: none;

  backdrop-filter:
    blur(3px);
}


/* 滑鼠移入入口才顯示 */

@media
(hover: hover)
and
(pointer: fine) {

  .close-zone:hover
  .close-hint {

    opacity: 0.78;
  }
}


/* =========================
   歡迎詞
========================= */

.welcome {

  position: absolute;

  left: 50%;
  top: 45%;

  width:
    min(
      36vw,
      570px
    );

  text-align: center;

  color:
    rgba(255,250,235,0.98);

  z-index: 25;

  opacity: 0;

  pointer-events: none;

  text-shadow:

    0 3px 8px
      rgba(0,0,0,0.85),

    0 0 20px
      rgba(255,205,125,0.32);

}


/* 中文 */

.welcome-cn {

  font-family:
    "Songti TC",
    "Noto Serif TC",
    "PMingLiU",
    serif;

  font-size:
    clamp(
      21px,
      2vw,
      34px
    );

  font-weight: 600;

  letter-spacing:
    0.12em;
}


/* 英文 */

.welcome-en {

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(
      20px,
      2.05vw,
      35px
    );

  font-style: italic;

  letter-spacing:
    0.10em;
}


/* =========================
   歡迎詞跳躍動畫

   小跳一下，
   不是卡通式亂彈。
========================= */

.welcome.bounce-in {

  animation:
    elegantBounce
    0.78s
    cubic-bezier(
      0.20,
      0.85,
      0.30,
      1.18
    )
    forwards;
}


@keyframes elegantBounce {

  0% {

    opacity: 0;

    transform:
      translate(-50%, -38%)
      scale(0.82);
  }

  55% {

    opacity: 1;

    transform:
      translate(-50%, -53%)
      scale(1.07);
  }

  75% {

    transform:
      translate(-50%, -48%)
      scale(0.985);
  }

  100% {

    opacity: 1;

    transform:
      translate(-50%, -50%)
      scale(1);
  }
}


/* 淡出 */

.welcome.fade-out {

  animation:
    welcomeFadeOut
    0.85s
    ease
    forwards;
}


@keyframes welcomeFadeOut {

  from {

    opacity: 1;

    transform:
      translate(-50%, -50%)
      scale(1);
  }

  to {

    opacity: 0;

    transform:
      translate(-50%, -54%)
      scale(1.02);
  }
}


/* =========================
   手機 / iPad
========================= */

@media
(max-width: 900px) {

  .door-stage {

    /*
      手機圖片裁切比例不同，
      因此稍微放寬門區。
    */

    left: 24%;
    width: 52%;

    top: 25%;
    height: 49%;
  }


  .knock-zone {

    left: 27%;
    width: 46%;

    top: 26%;
    height: 50%;
  }


  .knock-hint {

    width: 94%;

    font-size:
      clamp(
        15px,
        4vw,
        21px
      );

    letter-spacing:
      0.10em;
  }


  .welcome {

    width: 72vw;
  }


  .welcome-cn {

    font-size:
      clamp(
        19px,
        4.5vw,
        28px
      );
  }


  .welcome-en {

    font-size:
      clamp(
        18px,
        4.3vw,
        27px
      );
  }


  .close-hint {

    top: 82%;
  }
}


/* =========================
   尊重減少動畫設定
========================= */

@media
(prefers-reduced-motion: reduce) {

  .door {

    transition-duration:
      0.5s;
  }

  .welcome.bounce-in {

    animation:
      simpleAppear
      0.4s
      ease
      forwards;
  }


  @keyframes simpleAppear {

    from {
      opacity: 0;
      transform:
        translate(-50%, -50%);
    }

    to {
      opacity: 1;
      transform:
        translate(-50%, -50%);
    }
  }
}

</style>
</head>


<body>

<div
  id="gateScene"
  class="gate-scene closed"
>

  <!-- 門後庭院 -->

  <div
    class="open-world"
  ></div>


  <!-- 左右獨立門 -->

  <div
    class="door-stage"
  >

    <div
      class="door left-door"
    ></div>

    <div
      class="door right-door"
    ></div>

  </div>


  <!-- 原本完整關門圖 -->

  <div
    class="original-closed"
  ></div>


  <!-- 敲門區 -->

  <div
    id="knockZone"
    class="knock-zone"
    role="button"
    tabindex="0"
    aria-label="點三下打開大門"
  >

    <div
      id="knockHint"
      class="knock-hint"
    >
      點三下打開大門
    </div>

  </div>


  <!--
       開門後：
       整個入口都是關門感應區
  -->

  <div
    id="closeZone"
    class="close-zone"
    role="button"
    tabindex="0"
    aria-label="關閉大門"
  >

    <div
      class="close-hint"
    >
      點一下關閉大門
    </div>

  </div>


  <!-- 歡迎文字 -->

  <div
    id="welcomeCN"
    class="welcome welcome-cn"
  >
    歡迎來到 ASD 蝸小宣的家
  </div>


  <div
    id="welcomeEN"
    class="welcome welcome-en"
  >
    WELCOME TO HSUAN WORLD
  </div>


  <!--
       之後上傳音效即可直接使用

       knock.mp3
       door-open.mp3
       door-close.mp3
  -->

  <audio
    id="knockSound"
    preload="auto"
    src="knock.mp3"
  ></audio>

  <audio
    id="doorOpenSound"
    preload="auto"
    src="door-open.mp3"
  ></audio>

  <audio
    id="doorCloseSound"
    preload="auto"
    src="door-close.mp3"
  ></audio>

</div>


<script>

/* =========================
   元件
========================= */

const scene =
  document.getElementById(
    "gateScene"
  );

const knockZone =
  document.getElementById(
    "knockZone"
  );

const knockHint =
  document.getElementById(
    "knockHint"
  );

const closeZone =
  document.getElementById(
    "closeZone"
  );

const welcomeCN =
  document.getElementById(
    "welcomeCN"
  );

const welcomeEN =
  document.getElementById(
    "welcomeEN"
  );

const knockSound =
  document.getElementById(
    "knockSound"
  );

const doorOpenSound =
  document.getElementById(
    "doorOpenSound"
  );

const doorCloseSound =
  document.getElementById(
    "doorCloseSound"
  );


/* =========================
   狀態

   closed
   waiting
   opening
   open
   closing
========================= */

let gateState =
  "closed";

let knockCount =
  0;

let knockResetTimer =
  null;

let touchHintTimer =
  null;

let welcomeTimers =
  [];


/* =========================
   音效工具
========================= */

function playAudio(
  audio,
  volume
) {

  try {

    const sound =
      audio.cloneNode();

    sound.volume =
      volume;

    sound.play()
      .catch(() => {});

  }

  catch (error) {

    /*
      沒有音效檔時
      網站仍正常工作。
    */

  }

}


/* =========================
   敲門聲

   每點一次立即播放，
   所以節奏完全跟著讀者。
========================= */

function playKnock() {

  playAudio(
    knockSound,
    0.72
  );
}


/* =========================
   開門聲
========================= */

function playDoorOpen() {

  playAudio(
    doorOpenSound,
    0.52
  );
}


/* =========================
   關門聲
========================= */

function playDoorClose() {

  playAudio(
    doorCloseSound,
    0.52
  );
}


/* =========================
   清除歡迎詞
========================= */

function clearWelcome() {

  welcomeTimers.forEach(
    timer =>
      clearTimeout(timer)
  );

  welcomeTimers = [];

  welcomeCN.classList.remove(
    "bounce-in",
    "fade-out"
  );

  welcomeEN.classList.remove(
    "bounce-in",
    "fade-out"
  );
}


/* =========================
   播放單句歡迎詞
========================= */

function showWelcome(
  element,
  startTime
) {

  /*
    跳出
  */

  welcomeTimers.push(

    setTimeout(() => {

      element.classList.remove(
        "fade-out"
      );

      element.classList.add(
        "bounce-in"
      );

    }, startTime)

  );


  /*
    開始淡出
  */

  welcomeTimers.push(

    setTimeout(() => {

      element.classList.remove(
        "bounce-in"
      );

      element.classList.add(
        "fade-out"
      );

    }, startTime + 2450)

  );


  /*
    清乾淨
  */

  welcomeTimers.push(

    setTimeout(() => {

      element.classList.remove(
        "fade-out"
      );

    }, startTime + 3400)

  );
}


/* =========================
   歡迎詞完整流程
========================= */

function runWelcome() {

  clearWelcome();

  /*
    中文先來
  */

  showWelcome(
    welcomeCN,
    350
  );


  /*
    中文消失後
    英文再出現
  */

  showWelcome(
    welcomeEN,
    3900
  );
}


/* =========================
   開門
========================= */

function openGate() {

  if (
    gateState !== "waiting"
  ) return;


  gateState =
    "opening";


  knockHint.classList.remove(
    "touch-show"
  );


  /*
    開門聲與門同時開始
  */

  playDoorOpen();


  /*
    切換 CSS 狀態
  */

  scene.classList.remove(
    "closed"
  );

  scene.classList.add(
    "animating-open"
  );


  /*
    門動畫 2.35 秒
  */

  setTimeout(() => {

    scene.classList.remove(
      "animating-open"
    );

    scene.classList.add(
      "open"
    );

    gateState =
      "open";

    knockCount =
      0;


    /*
      門完全打開後，
      才開始歡迎。
    */

    runWelcome();

  }, 2350);

}


/* =========================
   關門
========================= */

function closeGate() {

  if (
    gateState !== "open"
  ) return;


  gateState =
    "closing";


  clearWelcome();

  playDoorClose();


  /*
    移除 open 後，
    左右門自動由 82°
    轉回 0°。
  */

  scene.classList.remove(
    "open"
  );


  /*
    保持原始完整門圖
    暫時隱藏，
    讓使用者看見
    兩扇門真正合起來。
  */

  scene.classList.add(
    "animating-open"
  );


  /*
    關鍵：
    立刻移除動畫開門狀態，
    讓門回到 rotateY(0)。
  */

  requestAnimationFrame(() => {

    scene.classList.remove(
      "animating-open"
    );

  });


  setTimeout(() => {

    /*
      門完全合上後，
      才恢復原始完整門面。
    */

    scene.classList.add(
      "closed"
    );

    gateState =
      "closed";

    knockCount =
      0;

  }, 2350);

}


/* =========================
   敲一下門
========================= */

function knock() {

  if (
    gateState !== "closed"
  ) return;


  /*
    畫面完全不動。
    只播放聲音。
  */

  playKnock();


  knockCount += 1;


  /*
    每敲一下重新計時。

    超過 3 秒沒完成，
    就重新從第一下開始。
  */

  clearTimeout(
    knockResetTimer
  );


  knockResetTimer =
    setTimeout(() => {

      knockCount = 0;

    }, 3000);


  /*
    第三下
  */

  if (
    knockCount >= 3
  ) {

    clearTimeout(
      knockResetTimer
    );

    knockCount =
      0;


    /*
      進入等待狀態，
      避免第四下、第五下
      繼續被計算。
    */

    gateState =
      "waiting";


    /*
      第三聲後停 0.4 秒，
      再推門。
    */

    setTimeout(
      openGate,
      400
    );
  }
}


/* =========================
   手機提示
========================= */

function showTouchHint() {

  const isTouch =
    window.matchMedia(
      "(hover: none)"
    ).matches;


  if (!isTouch) return;


  knockHint.classList.add(
    "touch-show"
  );


  clearTimeout(
    touchHintTimer
  );


  touchHintTimer =
    setTimeout(() => {

      knockHint.classList.remove(
        "touch-show"
      );

    }, 1800);
}


/* =========================
   點擊敲門
========================= */

knockZone.addEventListener(
  "click",
  () => {

    if (
      gateState !== "closed"
    ) return;

    showTouchHint();

    knock();
  }
);


/* =========================
   鍵盤敲門
========================= */

knockZone.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" ||
      event.key === " "
    ) {

      event.preventDefault();

      knock();
    }
  }
);


/* =========================
   點入口關門
========================= */

closeZone.addEventListener(
  "click",
  event => {

    event.stopPropagation();

    closeGate();
  }
);


/* =========================
   鍵盤關門
========================= */

closeZone.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" ||
      event.key === " "
    ) {

      event.preventDefault();

      closeGate();
    }
  }
);


/* =========================
   預載圖片
========================= */

window.addEventListener(
  "load",
  () => {

    const images = [

      "hsuan-gate-open.png",

      "hsuan-gate-left.png",

      "hsuan-gate-right.png"

    ];


    images.forEach(
      source => {

        const image =
          new Image();

        image.src =
          source;
      }
    );

  }
);

</script>

</body>
</html>
