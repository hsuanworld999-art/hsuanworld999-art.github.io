<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#24170e">
  <title>ASD 蝸小宣的家｜HSUAN WORLD</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: #24170e;
      font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
    }
    button { font: inherit; }

    .scene {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #24170e;
    }

    /* 所有元素共用原圖片的座標，畫面裁切時不會各自錯位。 */
    .artboard {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1536px;
      height: 947px;
      transform: translate(-50%, -50%) scale(var(--scene-scale, 1));
      transform-origin: center;
      overflow: hidden;
    }

    .picture {
      position: absolute;
      inset: 0;
      background: center / 100% 100% no-repeat;
      transition: opacity 1.25s ease;
    }
    .closed {
      background-image: url("hsuan-gate.png");
      opacity: 1;
    }
    .opened {
      background-image: url("hsuan-gate-open.png");
      opacity: 0;
    }
    .scene.is-open .closed { opacity: 0; }
    .scene.is-open .opened { opacity: 1; }

    /* 樹與屋頂保持靜止；只有獨立花瓣移動。 */
    .petal {
      position: absolute;
      z-index: 4;
      top: 35px;
      left: var(--x);
      width: 10px;
      height: 14px;
      border-radius: 85% 15% 75% 25%;
      background: radial-gradient(
        circle at 30% 25%,
        #fffafa,
        #ffd6e3 55%,
        #e99db6
      );
      opacity: 0;
      pointer-events: none;
      animation: fall var(--time) linear var(--delay) infinite;
    }
    @keyframes fall {
      0%, 8% {
        opacity: 0;
        transform: translate(0, -15px) rotate(0deg);
      }
      14% { opacity: .8; }
      43% { opacity: .7; }
      63% {
        opacity: 0;
        transform: translate(var(--drift), 640px) rotate(245deg);
      }
      100% {
        opacity: 0;
        transform: translate(var(--drift), 640px) rotate(245deg);
      }
    }

    /* 沿用原本的一體式流水素材。 */
    .water-basin {
      position: absolute;
      z-index: 7;
      left: 1200px;
      top: 620px;
      width: 336px;
      height: 260px;
      object-fit: fill;
      pointer-events: none;
      mask-image: radial-gradient(
        ellipse 76% 76% at 63% 53%,
        #000 52%,
        transparent 100%
      );
      -webkit-mask-image: radial-gradient(
        ellipse 76% 76% at 63% 53%,
        #000 52%,
        transparent 100%
      );
    }
    .scene.is-open .water-basin { opacity: 0; }

    .lamp {
      position: absolute;
      z-index: 3;
      top: 275px;
      left: 335px;
      width: 95px;
      height: 150px;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(
        ellipse,
        rgba(255,189,92,.12),
        transparent 75%
      );
      animation: breathe 8s ease-in-out infinite alternate;
    }
    .lamp.right {
      left: 1090px;
      animation-delay: -4s;
    }
    @keyframes breathe {
      from { opacity: .25; }
      to { opacity: .42; }
    }

    .gate-button {
      position: absolute;
      z-index: 30;
      left: 31%;
      top: 18%;
      width: 38%;
      height: 64%;
      padding: 0;
      border: 0;
      background: transparent;
      color: #fff5dc;
      cursor: pointer;
      touch-action: manipulation;
    }
    .gate-button:focus-visible { outline: 2px solid #fff2d0; }
    .scene.is-open .gate-button {
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .hint {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      padding: 10px 16px;
      border-radius: 30px;
      background: rgba(28,16,8,.34);
      text-shadow: 0 2px 8px #120805;
      font-size: 25px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
    }
    @media (hover:hover) and (pointer:fine) {
      .scene:not(.is-open) .gate-button:hover .hint {
        opacity: 1;
      }
    }
    .scene:not(.is-open) .gate-button.touch-hint .hint {
      opacity: 1;
    }

    /* 歡迎詞固定在兩扇門的中間，不跟著蝸小宣移動。 */
    .welcome-stage {
      position: absolute;
      z-index: 20;
      left: 31%;
      top: 27%;
      width: 38%;
      height: 42%;
      overflow: hidden;
      pointer-events: none;
    }
    .message {
      position: absolute;
      left: 50%;
      top: 34%;
      width: 100%;
      margin: 0;
      transform: translate(-50%, 8px);
      color: #fff1ca;
      text-align: center;
      font-size: 30px;
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: .025em;
      white-space: nowrap;
      opacity: 0;
      filter: blur(12px);
      text-shadow:
        0 2px 5px #1b0a03,
        0 4px 15px #1b0a03,
        0 0 20px #b87939;
    }
    .message.en {
      font-family: Georgia, serif;
      font-size: 27px;
      letter-spacing: .02em;
    }
    .scene.is-open .message.zh {
      animation: appear 5.3s ease-in-out 5.3s both;
    }
    .scene.is-open .message.en {
      animation: appear 5.3s ease-in-out 11.1s both;
    }

    /* 中文和英文各自顯現、停留、淡出，不會疊在一起。 */
    @keyframes appear {
      0% {
        opacity: 0;
        filter: blur(12px);
        transform: translate(-50%, 8px);
      }
      18% {
        opacity: 1;
        filter: blur(0);
        transform: translate(-50%, 0);
      }
      78% {
        opacity: 1;
        filter: blur(0);
        transform: translate(-50%, 0);
      }
      100% {
        opacity: 0;
        filter: blur(12px);
        transform: translate(-50%, -5px);
      }
    }

    .snail {
      position: absolute;
      left: 120%;
      bottom: 11%;
      width: 80px;
      height: auto;
      transform: translateX(-50%);
      opacity: 0;
      filter: drop-shadow(0 3px 6px #241309);
    }
    .scene.is-open .snail {
      animation: snailVisit 19s linear 1.5s both;
    }
    @keyframes snailVisit {
      0%   { left: 120%; opacity: 1; }
      20%  { left: 50%; opacity: 1; }
      85%  { left: 50%; opacity: 1; }
      100% { left: -20%; opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .petal, .lamp { animation: none; }
      .petal { display: none; }
    }
  </style>
</head>
<body>
  <main class="scene" id="scene" aria-label="ASD 蝸小宣的家入口">
    <div class="artboard" id="artboard">
      <div class="picture opened" aria-hidden="true"></div>
      <div class="picture closed" aria-hidden="true"></div>

      <div class="lamp" aria-hidden="true"></div>
      <div class="lamp right" aria-hidden="true"></div>

      <span
        class="petal"
        style="--x:12%;--time:23s;--delay:-7s;--drift:210px"
        aria-hidden="true"
      ></span>
      <span
        class="petal"
        style="--x:25%;--time:29s;--delay:-20s;--drift:155px"
        aria-hidden="true"
      ></span>

      <img
        class="water-basin"
        src="hsuan-water-basin.webp"
        alt=""
        aria-hidden="true"
        onerror="this.style.display='none'"
      >

      <div class="welcome-stage" aria-hidden="true">
        <p class="message zh">歡迎來到 ASD 蝸小宣的家</p>
        <p class="message en">WELCOME TO HSUAN WORLD</p>
        <img
          class="snail"
          src="hsuan-snail.png"
          alt=""
          onerror="this.style.display='none'"
        >
      </div>

      <button
        class="gate-button"
        id="gateButton"
        type="button"
        aria-label="點三下打開大門"
      >
        <span class="hint">點三下打開大門</span>
      </button>
    </div>
  </main>

  <script>
    const scene = document.getElementById('scene');
    const artboard = document.getElementById('artboard');
    const gateButton = document.getElementById('gateButton');
    let opened = false;
    let knocks = 0;
    let knockTimer;
    let hintTimer;

    function fitScene() {
      const scale = Math.max(
        scene.clientWidth / 1536,
        scene.clientHeight / 947
      );
      artboard.style.setProperty('--scene-scale', scale);
    }
    fitScene();
    window.addEventListener('resize', fitScene);

    function closeGate() {
      opened = false;
      knocks = 0;
      clearTimeout(knockTimer);
      scene.classList.remove('is-open');
      gateButton.setAttribute('aria-label', '點三下打開大門');
      void scene.offsetWidth;
    }

    function openGate() {
      opened = true;
      knocks = 0;
      clearTimeout(knockTimer);
      clearTimeout(hintTimer);
      gateButton.classList.remove('touch-hint');
      gateButton.setAttribute('aria-label', '點一下關上大門');
      scene.classList.add('is-open');
    }

    gateButton.addEventListener('click', () => {
      if (opened) {
        closeGate();
        return;
      }

      if (matchMedia('(hover: none)').matches) {
        gateButton.classList.add('touch-hint');
        clearTimeout(hintTimer);
        hintTimer = setTimeout(() => {
          gateButton.classList.remove('touch-hint');
        }, 1600);
      }

      knocks++;
      clearTimeout(knockTimer);
      knockTimer = setTimeout(() => {
        knocks = 0;
      }, 3000);

      if (knocks >= 3) openGate();
    });

    window.addEventListener('load', () => {
      [
        'hsuan-gate-open.png',
        'hsuan-snail.png',
        'hsuan-water-basin.webp'
      ].forEach(src => {
        const img = new Image();
        img.src = src;
      });
    });
  </script>
</body>
</html>
