<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#24170e"
>

<title>ASD 蝸小宣的家｜HSUAN WORLD</title>

<style>

/* ==================================================
   基本
================================================== */

:root {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: #24170e;

  font-family:
    "Noto Serif TC",
    "Songti TC",
    "PMingLiU",
    serif;
}


/* ==================================================
   主場景
================================================== */

.scene {

  position: relative;

  width: 100%;
  height: 100vh;
  height: 100dvh;

  overflow: hidden;

  isolation: isolate;
}


/* ==================================================
   大門背景
================================================== */

.picture {

  position: absolute;
  inset: 0;

  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;

  z-index: 0;
}


.closed {

  background-image:
    url("hsuan-gate.png");

  opacity: 1;

  transition:
    opacity 1.35s ease;
}


.opened {

  background-image:
    url("hsuan-gate-open.png");

  opacity: 0;

  transform:
    scale(1.018);

  transition:
    opacity 1.55s ease,
    transform 2.7s ease;
}


.scene.is-open
.closed {

  opacity: 0;
}


.scene.is-open
.opened {

  opacity: 1;

  transform:
    scale(1);
}


/* ==================================================
   底部陰影
================================================== */

.shade {

  position: absolute;
  inset: 0;

  z-index: 1;

  pointer-events: none;

  background:

    linear-gradient(
      to bottom,

      transparent 75%,

      rgba(12,7,4,.13)
    );
}


/* ==================================================
   櫻花枝輕微晃動
================================================== */

.branch {

  position: absolute;
  inset: 0;

  z-index: 2;

  pointer-events: none;

  opacity: .52;

  background:
    url("hsuan-gate.png")
    center / cover
    no-repeat;

  will-change:
    transform;
}


.scene.is-open
.branch {

  background-image:
    url("hsuan-gate-open.png");
}


.branch-left {

  transform-origin:
    8% 4%;

  -webkit-mask-image:

    radial-gradient(
      ellipse 40% 28%
      at 8% 3%,

      #000 0%,

      transparent 95%
    );

  mask-image:

    radial-gradient(
      ellipse 40% 28%
      at 8% 3%,

      #000 0%,

      transparent 95%
    );

  animation:
    branchLeft
    8s
    ease-in-out
    infinite alternate;
}


.branch-right {

  transform-origin:
    92% 4%;

  -webkit-mask-image:

    radial-gradient(
      ellipse 38% 26%
      at 92% 3%,

      #000 0%,

      transparent 95%
    );

  mask-image:

    radial-gradient(
      ellipse 38% 26%
      at 92% 3%,

      #000 0%,

      transparent 95%
    );

  animation:
    branchRight
    9s
    ease-in-out
    infinite alternate;
}


@keyframes branchLeft {

  from {

    transform:
      rotate(-.35deg)
      translateX(-2px);
  }

  to {

    transform:
      rotate(.55deg)
      translateX(3px);
  }

}


@keyframes branchRight {

  from {

    transform:
      rotate(.35deg)
      translateX(2px);
  }

  to {

    transform:
      rotate(-.5deg)
      translateX(-3px);
  }

}


/* ==================================================
   花瓣
================================================== */

.petals {

  position: absolute;
  inset: 0;

  z-index: 3;

  overflow: hidden;

  pointer-events: none;
}


.petal {

  position: absolute;

  top: -12vh;

  width:
    var(--size);

  height:
    calc(var(--size) * 1.35);

  border-radius:
    80% 15% 75% 20%;

  background:

    radial-gradient(
      circle at 30% 25%,

      #fffaf7 0%,

      #ffdce7 50%,

      #e99aaf 100%
    );

  opacity: .78;

  box-shadow:

    0 0 4px
    rgba(255,222,231,.45);

  animation:
    petalFall
    var(--duration)
    linear
    var(--delay)
    infinite;
}


@keyframes petalFall {

  0% {

    transform:
      translate(0,-8vh)
      rotate(0deg);

    opacity: 0;
  }


  8% {

    opacity: .8;
  }


  50% {

    transform:

      translate(
        var(--half-drift),
        50vh
      )

      rotate(130deg);
  }


  100% {

    transform:

      translate(
        var(--drift),
        115vh
      )

      rotate(285deg);

    opacity: 0;
  }

}


/* ==================================================
   一體式動態水盆

   ★ 這次不畫 CSS 水柱
   ★ 直接播放 hsuan-water-basin.webp
   ★ 門開門關都一直動
================================================== */

.water-basin {

  position: absolute;

  left: 0;
  top: 0;

  width: 1px;
  height: 1px;

  z-index: 40;

  pointer-events: none;

  object-fit: fill;

  /*
    淡化裁切邊緣，
    讓它融入原背景。
  */

  -webkit-mask-image:

    radial-gradient(
      ellipse 72% 72%
      at 62% 53%,

      #000 55%,

      rgba(0,0,0,.96) 70%,

      rgba(0,0,0,.55) 87%,

      transparent 100%
    );


  mask-image:

    radial-gradient(
      ellipse 72% 72%
      at 62% 53%,

      #000 55%,

      rgba(0,0,0,.96) 70%,

      rgba(0,0,0,.55) 87%,

      transparent 100%
    );

}


/* ==================================================
   大門按鈕
================================================== */

.gate-button {

  position: absolute;

  z-index: 60;

  left: 32%;
  top: 18%;

  width: 36%;
  height: 65%;

  border: 0;

  padding: 0;

  background:
    transparent;

  color:
    #fff8e7;

  cursor:
    pointer;

  touch-action:
    manipulation;

  -webkit-tap-highlight-color:
    transparent;
}


.scene.is-open
.gate-button {

  left: 0;
  top: 0;

  width: 100%;
  height: 100%;
}


/* ==================================================
   點三下提示
================================================== */

.hint {

  position: absolute;

  left: 50%;
  top: 48%;

  transform:
    translate(-50%,-42%);

  opacity: 0;

  pointer-events: none;

  white-space: nowrap;

  font-size:

    clamp(
      16px,
      1.7vw,
      26px
    );

  letter-spacing:
    .12em;

  text-shadow:

    0 2px 9px
    rgba(19,11,6,.95),

    0 3px 22px
    rgba(19,11,6,.9);

  transition:

    opacity .35s ease,

    transform .35s ease;
}


@media
(hover:hover)
and
(pointer:fine) {

  .scene:not(.is-open)
  .gate-button:hover
  .hint {

    opacity: 1;

    transform:
      translate(-50%,-50%);
  }

}


.scene:not(.is-open)
.gate-button.touch-hint
.hint {

  opacity: 1;

  transform:
    translate(-50%,-50%);
}


/* ==================================================
   蝸小宣歡迎區
================================================== */

.welcome-stage {

  position: absolute;

  z-index: 50;

  left: 27%;
  top: 27%;

  width: 46%;
  height: 30%;

  overflow: hidden;

  pointer-events: none;
}


.welcome-track {

  position: absolute;

  left: 0;
  top: 50%;

  width: 100%;

  display: flex;

  align-items: center;
  justify-content: center;

  gap:

    clamp(
      8px,
      1vw,
      15px
    );

  opacity: 0;

  visibility: hidden;

  transform:
    translate(100%,-50%);
}


.welcome-track.running {

  opacity: 1;

  visibility: visible;

  animation:
    crawl
    16s
    linear
    both;
}


@keyframes crawl {

  0% {

    transform:
      translate(100%,-50%);
  }


  30% {

    transform:
      translate(5%,-50%);
  }


  72% {

    transform:
      translate(-4%,-50%);
  }


  100% {

    transform:
      translate(-100%,-50%);
  }

}


.snail {

  width:

    clamp(
      55px,
      5.5vw,
      90px
    );

  height: auto;

  flex: none;

  filter:

    drop-shadow(
      0 3px 6px
      rgba(31,14,4,.45)
    );
}


.message-box {

  display: flex;

  flex-direction: column;

  align-items: flex-start;

  justify-content: center;
}


.message {

  margin: 0;

  opacity: 0;

  filter:
    blur(14px);

  color:
    #fff0c4;

  white-space: nowrap;

  text-shadow:

    0 2px 4px
    #2d1608,

    0 4px 15px
    #1a0b04,

    0 0 20px
    rgba(217,157,77,.95);
}


.message.zh {

  font-size:

    clamp(
      16px,
      1.7vw,
      28px
    );
}


.message.en {

  margin-top: 3px;

  font-family:
    Baskerville,
    Georgia,
    serif;

  font-style:
    italic;

  font-size:

    clamp(
      13px,
      1.2vw,
      20px
    );
}


.message.reveal {

  animation:
    mistText
    5.3s
    ease-in-out
    both;
}


@keyframes mistText {

  0% {

    opacity: 0;

    filter:
      blur(14px);
  }


  18% {

    opacity: 1;

    filter:
      blur(0);
  }


  66% {

    opacity: 1;

    filter:
      blur(0);
  }


  100% {

    opacity: 0;

    filter:
      blur(9px);
  }

}


/* ==================================================
   手機
================================================== */

@media
(max-width:768px) {

  .gate-button {

    left: 18%;
    top: 15%;

    width: 64%;
    height: 70%;
  }


  .welcome-stage {

    left: 15%;
    top: 27%;

    width: 70%;
    height: 32%;
  }


  .snail {

    width:

      clamp(
        42px,
        11vw,
        62px
      );
  }


  .message.zh {

    font-size:

      clamp(
        12px,
        3vw,
        19px
      );

    white-space:
      normal;
  }


  .message.en {

    font-size:

      clamp(
        10px,
        2.4vw,
        15px
      );

    white-space:
      normal;
  }

}

</style>

</head>


<body>


<main
  class="scene"
  id="scene"
  aria-label="ASD 蝸小宣的家入口"
>


  <!-- 背景 -->

  <div
    class="picture closed"
    aria-hidden="true"
  ></div>


  <div
    class="picture opened"
    aria-hidden="true"
  ></div>


  <div
    class="shade"
    aria-hidden="true"
  ></div>


  <!-- 櫻花 -->

  <div
    class="branch branch-left"
    aria-hidden="true"
  ></div>


  <div
    class="branch branch-right"
    aria-hidden="true"
  ></div>


  <!-- 花瓣 -->

  <div
    class="petals"
    id="petals"
    aria-hidden="true"
  ></div>


  <!-- ==================================================
       一體式動態水盆
  ================================================== -->

  <img
    id="waterBasin"
    class="water-basin"
    src="hsuan-water-basin.webp"
    alt=""
    aria-hidden="true"
    decoding="async"
  >


  <!-- ==================================================
       大門
  ================================================== -->

  <button
    class="gate-button"
    id="gateButton"
    type="button"
    aria-label="點三下打開大門"
  >

    <span
      class="hint"
    >
      點三下打開大門
    </span>

  </button>


  <!-- ==================================================
       歡迎動畫
  ================================================== -->

  <div
    class="welcome-stage"
    aria-hidden="true"
  >

    <div
      class="welcome-track"
      id="welcomeTrack"
    >

      <img
        class="snail"
        src="hsuan-snail.png"
        alt=""
        decoding="async"
        onerror="this.style.display='none'"
      >


      <div
        class="message-box"
      >

        <p
          class="message zh"
          id="zh"
        >
          歡迎來到 ASD 蝸小宣的家
        </p>


        <p
          class="message en"
          id="en"
        >
          WELCOME TO HSUAN WORLD
        </p>

      </div>

    </div>

  </div>

</main>


<script>


const scene =
  document.getElementById(
    "scene"
  );


const gateButton =
  document.getElementById(
    "gateButton"
  );


const welcomeTrack =
  document.getElementById(
    "welcomeTrack"
  );


const zh =
  document.getElementById(
    "zh"
  );


const en =
  document.getElementById(
    "en"
  );


const petalsLayer =
  document.getElementById(
    "petals"
  );


const waterBasin =
  document.getElementById(
    "waterBasin"
  );


let opened =
  false;


let knocks =
  0;


let resetTimer =
  null;


let hintTimer =
  null;


let timers =
  [];


/* ==================================================
   原始大門圖尺寸
================================================== */

const SOURCE_W =
  1536;


const SOURCE_H =
  947;


/* ==================================================
   動態水盆素材是從這裡裁出來：

   x 1200
   y 620
   寬 336
   高 260

   所以它可以直接對回原圖。
================================================== */

const WATER_CROP = {

  x: 1200,

  y: 620,

  width: 336,

  height: 260

};


/* ==================================================
   讓動態水盆永遠貼回原本的位置

   background-size: cover
   background-position: center
================================================== */

function positionWaterBasin() {


  const viewW =
    scene.clientWidth;


  const viewH =
    scene.clientHeight;


  const scale =
    Math.max(

      viewW / SOURCE_W,

      viewH / SOURCE_H

    );


  const renderedW =
    SOURCE_W
    *
    scale;


  const renderedH =
    SOURCE_H
    *
    scale;


  const offsetX =
    (
      viewW
      -
      renderedW
    )
    /
    2;


  const offsetY =
    (
      viewH
      -
      renderedH
    )
    /
    2;


  waterBasin.style.left =
    (
      offsetX
      +
      WATER_CROP.x
      *
      scale
    )
    +
    "px";


  waterBasin.style.top =
    (
      offsetY
      +
      WATER_CROP.y
      *
      scale
    )
    +
    "px";


  waterBasin.style.width =
    (
      WATER_CROP.width
      *
      scale
    )
    +
    "px";


  waterBasin.style.height =
    (
      WATER_CROP.height
      *
      scale
    )
    +
    "px";

}


/* ==================================================
   花瓣
================================================== */

function makePetals() {


  if (
    petalsLayer.dataset.ready
  ) {

    return;

  }


  petalsLayer.dataset.ready =
    "yes";


  /*
    不要滿天花瓣，
    保持少量。
  */

  for (
    let i = 0;
    i < 16;
    i++
  ) {


    const petal =
      document.createElement(
        "span"
      );


    const drift =
      Math.round(

        (
          Math.random()
          -
          .5
        )
        *
        160

      );


    petal.className =
      "petal";


    petal.style.left =
      (
        i % 2

        ? 3 + Math.random() * 24

        : 74 + Math.random() * 22
      )
      +
      "%";


    petal.style.setProperty(

      "--size",

      (
        5
        +
        Math.random()
        *
        5
      )
      .toFixed(1)
      +
      "px"

    );


    petal.style.setProperty(

      "--duration",

      (
        11
        +
        Math.random()
        *
        10
      )
      .toFixed(1)
      +
      "s"

    );


    petal.style.setProperty(

      "--delay",

      (
        -Math.random()
        *
        20
      )
      .toFixed(1)
      +
      "s"

    );


    petal.style.setProperty(

      "--half-drift",

      drift / 2
      +
      "px"

    );


    petal.style.setProperty(

      "--drift",

      drift
      +
      "px"

    );


    petalsLayer.appendChild(
      petal
    );

  }

}


/* ==================================================
   歡迎動畫
================================================== */

function later(
  fn,
  delay
) {

  timers.push(

    window.setTimeout(
      fn,
      delay
    )

  );

}


function clearWelcome() {


  timers.forEach(
    window.clearTimeout
  );


  timers =
    [];


  welcomeTrack.classList.remove(
    "running"
  );


  zh.classList.remove(
    "reveal"
  );


  en.classList.remove(
    "reveal"
  );


  void welcomeTrack.offsetWidth;

}


/* ==================================================
   開門
================================================== */

function openGate() {


  opened =
    true;


  knocks =
    0;


  clearTimeout(
    resetTimer
  );


  clearTimeout(
    hintTimer
  );


  gateButton.classList.remove(
    "touch-hint"
  );


  gateButton.setAttribute(
    "aria-label",
    "點一下關上大門"
  );


  scene.classList.add(
    "is-open"
  );


  clearWelcome();


  /*
    開門後，
    蝸小宣才開始慢慢爬。
  */

  later(
    () => {

      welcomeTrack.classList.add(
        "running"
      );

    },
    1500
  );


  /*
    中文先出
  */

  later(
    () => {

      zh.classList.add(
        "reveal"
      );

    },
    3900
  );


  /*
    英文後出
  */

  later(
    () => {

      en.classList.add(
        "reveal"
      );

    },
    7500
  );

}


/* ==================================================
   關門
================================================== */

function closeGate() {


  opened =
    false;


  knocks =
    0;


  clearWelcome();


  scene.classList.remove(
    "is-open"
  );


  gateButton.setAttribute(
    "aria-label",
    "點三下打開大門"
  );

}


/* ==================================================
   點門
================================================== */

function activateGate() {


  if (
    opened
  ) {

    closeGate();

    return;

  }


  if (
    window.matchMedia(
      "(hover:none)"
    )
    .matches
  ) {


    gateButton.classList.add(
      "touch-hint"
    );


    clearTimeout(
      hintTimer
    );


    hintTimer =
      window.setTimeout(
        () => {

          gateButton.classList.remove(
            "touch-hint"
          );

        },
        1800
      );

  }


  knocks++;


  clearTimeout(
    resetTimer
  );


  resetTimer =
    window.setTimeout(
      () => {

        knocks =
          0;

      },
      3000
    );


  if (
    knocks >= 3
  ) {

    openGate();

  }

}


/* ==================================================
   滑鼠 / 手指
================================================== */

gateButton.addEventListener(
  "click",
  activateGate
);


/* ==================================================
   預載
================================================== */

function preload() {


  [
    "hsuan-gate-open.png",
    "hsuan-snail.png",
    "hsuan-water-basin.webp"
  ]
  .forEach(
    src => {


      const image =
        new Image();


      image.src =
        src;

    }
  );

}


/* ==================================================
   啟動
================================================== */

window.addEventListener(
  "load",
  () => {


    makePetals();


    positionWaterBasin();


    preload();

  }
);


/* ==================================================
   視窗改變
================================================== */

window.addEventListener(
  "resize",
  positionWaterBasin
);


window.addEventListener(
  "orientationchange",
  () => {


    window.setTimeout(
      positionWaterBasin,
      180
    );

  }
);


if (
  "ResizeObserver"
  in
  window
) {


  const observer =
    new ResizeObserver(
      positionWaterBasin
    );


  observer.observe(
    scene
  );

}

</script>

</body>

</html>
