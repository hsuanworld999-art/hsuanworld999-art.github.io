<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#24170e">
  <title>ASD 蝸小宣的家｜HSUAN WORLD</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #24170e; font-family: "Songti TC", "Noto Serif TC", "PMingLiU", serif; }
    button { font: inherit; }
    .scene {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      isolation: isolate;
    }

    /* 兩張 1536 × 1024 圖與所有效果共用同一個座標平面。 */
    .artboard {
      position: absolute;
      left: 50%;
      top: 50%;
      width: max(100vw, 150vh);
      width: max(100vw, 150dvh);
      height: max(100vh, 66.666667vw);
      height: max(100dvh, 66.666667vw);
      transform: translate(-50%, -50%);
      overflow: hidden;
      perspective: 1400px;
    }
    .picture {
      position: absolute;
      inset: 0;
      background-position: center;
      background-size: 100% 100%;
      background-repeat: no-repeat;
    }
    .closed {
      background-image: url("hsuan-gate.png");
      z-index: 0;
      transition: opacity 1.1s ease .18s;
    }
    .opened {
      background-image: url("hsuan-gate-open.png");
      z-index: 0;
      opacity: 0;
      transition: opacity 1.1s ease .18s;
    }
    .scene.is-open .closed { opacity: 0; }
    .scene.is-open .opened { opacity: 1; }

    /* 門板先停一瞬，再有重量地向兩側轉開。 */
    .door-leaf {
      position: absolute;
      z-index: 2;
      top: 22.5%;
      height: 49.5%;
      backface-visibility: hidden;
      transform-style: preserve-3d;
      background-image: url("hsuan-gate.png");
      background-repeat: no-repeat;
      box-shadow: 0 0 8px rgba(26, 10, 3, .25);
      opacity: 0;
      pointer-events: none;
    }
    .door-left {
      left: 30.6%;
      width: 17.5%;
      transform-origin: left center;
      background-size: 571.43% 202.02%;
      background-position: 37.09% 44.55%;
    }
    .door-right {
      left: 48.1%;
      width: 17.2%;
      transform-origin: right center;
      background-size: 581.4% 202.02%;
      background-position: 58.16% 44.55%;
    }
    .scene.is-open .door-left {
      animation: openLeft 2.7s cubic-bezier(.46,.04,.16,1) both;
    }
    .scene.is-open .door-right {
      animation: openRight 2.7s cubic-bezier(.46,.04,.16,1) both;
    }
    @keyframes openLeft {
      0%, 8% { opacity: 1; transform: rotateY(0deg); }
      82% { opacity: 1; transform: rotateY(-73deg); }
      100% { opacity: 0; transform: rotateY(-77deg); }
    }
    @keyframes openRight {
      0%, 8% { opacity: 1; transform: rotateY(0deg); }
      82% { opacity: 1; transform: rotateY(73deg); }
      100% { opacity: 0; transform: rotateY(77deg); }
    }

    /* 左上角櫻花枝只擺動一點點。 */
    .branch {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: url("hsuan-gate.png") center / 100% 100% no-repeat;
      opacity: .5;
      transform-origin: 5% 4%;
      -webkit-mask-image: radial-gradient(ellipse 37% 32% at 3% 2%, #000 8%, transparent 95%);
      mask-image: radial-gradient(ellipse 37% 32% at 3% 2%, #000 8%, transparent 95%);
      animation: branchSway 9s ease-in-out infinite alternate;
      transition: opacity .8s;
    }
    .scene.is-open .branch {
      background-image: url("hsuan-gate-open.png");
    }
    @keyframes branchSway {
      from { transform: rotate(-.18deg) translateX(-1px); }
      to { transform: rotate(.24deg) translateX(2px); }
    }

    /* 畫面只有兩片偶爾出現的花瓣。 */
    .petal {
      position: absolute;
      z-index: 3;
      top: 8%;
      left: var(--left);
      width: .55%;
      min-width: 5px;
      aspect-ratio: .85;
      border-radius: 80% 15% 75% 20%;
      pointer-events: none;
      background: radial-gradient(circle at 30% 25%, #fff7f5, #ffd4e1 55%, #e893ae);
      opacity: 0;
      animation: petalDrift var(--duration) linear var(--delay) infinite;
    }
    @keyframes petalDrift {
      0%, 17% {
        opacity: 0;
        transform: translate(0, -10px) rotate(0deg);
      }
      22% { opacity: .8; }
      41% { opacity: .65; }
      49% {
        opacity: 0;
        transform: translate(210px, 420px) rotate(220deg);
      }
      100% {
        opacity: 0;
        transform: translate(210px, 420px) rotate(220deg);
      }
    }

    /* 高光沿右側竹管原有水線滑落，漣漪留在右下石盆。 */
    .water-effect {
      position: absolute;
      inset: 0;
      z-index: 3;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
      transition: opacity .65s ease;
    }
    .scene.is-open .water-effect { opacity: 0; }
    .stream-base {
      fill: none;
      stroke: rgba(255,245,220,.22);
      stroke-width: 4;
      stroke-linecap: round;
    }
    .stream-glint {
      fill: none;
      stroke: rgba(255,255,239,.85);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-dasharray: 6 23;
      animation: waterFlow 1.15s linear infinite;
      filter: drop-shadow(0 0 2px rgba(255,244,185,.6));
    }
    .stream-glint.secondary {
      stroke-width: 1.2;
      opacity: .55;
      animation-duration: 1.65s;
    }
    @keyframes waterFlow {
      to { stroke-dashoffset: -29; }
    }
    .basin-glow {
      fill: rgba(255,244,189,.055);
      animation: waterShine 5s ease-in-out infinite;
    }
    @keyframes waterShine {
      50% { opacity: .34; transform: translateX(4px); }
    }
    .basin-ripple {
      fill: none;
      stroke: rgba(255,247,218,.55);
      stroke-width: 1.6;
      transform-box: fill-box;
      transform-origin: center;
      animation: smallRipple 3.4s ease-out infinite;
    }
    .basin-ripple.second { animation-delay: -1.7s; }
    @keyframes smallRipple {
      0% { opacity: 0; transform: scale(.28); }
      22% { opacity: .52; }
      100% { opacity: 0; transform: scale(1.6); }
    }

    /* 燈光只有很微弱的呼吸感。 */
    .lamp-breath {
      position: absolute;
      z-index: 1;
      left: 23%;
      top: 30%;
      width: 7%;
      height: 16%;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(ellipse, rgba(255,190,91,.16), transparent 72%);
      mix-blend-mode: screen;
      animation: lampBreath 8s ease-in-out infinite alternate;
    }
    .lamp-breath.right {
      left: 65%;
      animation-delay: -4s;
    }
    @keyframes lampBreath {
      from { opacity: .25; }
      to { opacity: .42; }
    }

    .gate-button {
      position: absolute;
      z-index: 6;
      left: 30%;
      top: 22%;
      width: 36%;
      height: 51%;
      border: 0;
      padding: 0;
      background: transparent;
      color: #fff6de;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .scene.is-open .gate-button {
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
    }
    .gate-button:focus-visible {
      outline: 2px solid #fff3ce;
      outline-offset: -4px;
    }
    .hint {
      position: absolute;
      left: 50%;
      top: 48%;
      transform: translate(-50%, -40%);
      white-space: nowrap;
      font-size: clamp(19px, 1.7vw, 26px);
      letter-spacing: .1em;
      opacity: 0;
      pointer-events: none;
      text-shadow: 0 2px 9px #160b06, 0 3px 20px #160b06;
      transition: opacity .35s, transform .35s;
    }
    @media (hover: hover) and (pointer: fine) {
      .scene:not(.is-open) .gate-button:hover .hint {
        opacity: 1;
        transform: translate(-50%, -50%);
      }
    }
    .scene:not(.is-open) .gate-button.touch-hint .hint {
      opacity: 1;
      transform: translate(-50%, -50%);
    }

    /* 蝸小宣從右往左，文字跟在牠後面，範圍限於兩片門之間。 */
    .welcome-stage {
      position: absolute;
      z-index: 4;
      left: 34%;
      top: 32%;
      width: 32%;
      height: 28%;
      overflow: hidden;
      pointer-events: none;
    }
    .welcome-track {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      opacity: 0;
      transform: translate(110%, -50%);
    }
    .scene.is-open .welcome-track {
      animation: crawl 16s linear 2.8s both;
    }
    @keyframes crawl {
      0% { opacity: 1; transform: translate(110%, -50%); }
      27% { opacity: 1; transform: translate(0, -50%); }
      74% { opacity: 1; transform: translate(-3%, -50%); }
      100% { opacity: 0; transform: translate(-110%, -50%); }
    }
    .snail {
      display: block;
      width: clamp(48px, 4.2vw, 68px);
      height: auto;
      flex: none;
      filter: drop-shadow(0 3px 5px #241309);
    }
    .message-box {
      min-width: 0;
      text-align: center;
    }
    .message {
      margin: 0;
      color: #fff1c9;
      font-size: clamp(16px, 1.23vw, 21px);
      line-height: 1.5;
      letter-spacing: .02em;
      white-space: nowrap;
      text-shadow: 0 2px 5px #1a0a03, 0 3px 13px #1a0a03, 0 0 18px #c9873a;
      opacity: 0;
      filter: blur(14px);
      transform: translateY(6px);
    }
    .message.en {
      font-size: clamp(12px, .97vw, 17px);
      letter-spacing: .04em;
    }
    .scene.is-open .message {
      animation: mist 8s ease-in-out 6.9s both;
    }
    @keyframes mist {
      0% {
        opacity: 0;
        filter: blur(14px);
        transform: translateY(6px);
      }
      15% {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }
      78% {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }
      100% {
        opacity: 0;
        filter: blur(12px);
        transform: translateY(-4px);
      }
    }

    @media (max-width: 768px) {
      .gate-button {
        left: 30%;
        top: 21%;
        width: 37%;
        height: 54%;
      }
      .welcome-stage {
        left: 34%;
        top: 34%;
        width: 32%;
        height: 25%;
      }
      .snail { width: 42px; }
      .message {
        font-size: 14px;
        white-space: normal;
      }
      .message.en { font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .branch,
      .petal,
      .stream-glint,
      .basin-glow,
      .basin-ripple,
      .lamp-breath {
        animation: none;
      }
      .petal,
      .stream-glint,
      .basin-ripple {
        display: none;
      }
      .scene.is-open .door-left,
      .scene.is-open .door-right {
        animation-duration: .4s;
      }
      .scene.is-open .welcome-track {
        animation: crawl 16s linear 2.8s both;
      }
    }
  </style>
</head>
<body>
  <main class="scene" id="scene" aria-label="ASD 蝸小宣的家入口">
    <div class="artboard">
      <div class="picture opened" aria-hidden="true"></div>
      <div class="picture closed" aria-hidden="true"></div>
      <div class="branch" aria-hidden="true"></div>
      <div class="lamp-breath" aria-hidden="true"></div>
      <div class="lamp-breath right" aria-hidden="true"></div>

      <span class="petal"
            style="--left:5%;--duration:22s;--delay:-4s"
            aria-hidden="true"></span>
      <span class="petal"
            style="--left:21%;--duration:27s;--delay:-17s"
            aria-hidden="true"></span>

      <svg class="water-effect"
           viewBox="0 0 1536 1024"
           preserveAspectRatio="none"
           aria-hidden="true">
        <defs>
          <clipPath id="basinClip">
            <ellipse cx="1393" cy="785" rx="91" ry="18"/>
          </clipPath>
        </defs>

        <path class="stream-base"
              d="M1423 696 C1418 715 1409 736 1405 765"/>
        <path class="stream-glint"
              d="M1423 696 C1418 715 1409 736 1405 765"/>
        <path class="stream-glint secondary"
              d="M1428 697 C1421 714 1415 743 1410 764"/>

        <g clip-path="url(#basinClip)">
          <ellipse class="basin-glow"
                   cx="1392" cy="783" rx="82" ry="13"/>
          <ellipse class="basin-ripple"
                   cx="1405" cy="776" rx="31" ry="5"/>
          <ellipse class="basin-ripple second"
                   cx="1405" cy="776" rx="31" ry="5"/>
        </g>
      </svg>

      <div class="door-leaf door-left" aria-hidden="true"></div>
      <div class="door-leaf door-right" aria-hidden="true"></div>

      <button class="gate-button"
              id="gateButton"
              type="button"
              aria-label="點三下打開大門">
        <span class="hint">點三下打開大門</span>
      </button>

      <div class="welcome-stage" aria-hidden="true">
        <div class="welcome-track">
          <img class="snail"
               src="hsuan-snail.png"
               alt=""
               decoding="async">
          <div class="message-box">
            <p class="message">歡迎來到 ASD 蝸小宣的家</p>
            <p class="message en">WELCOME TO HSUAN WORLD</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const scene = document.getElementById('scene');
    const gateButton = document.getElementById('gateButton');

    let opened = false;
    let knocks = 0;
    let knockTimer;
    let hintTimer;

    function closeGate() {
      opened = false;
      knocks = 0;
      clearTimeout(knockTimer);
      scene.classList.remove('is-open');
      gateButton.setAttribute('aria-label', '點三下打開大門');

      /* 下次開門時，動畫從頭播放。 */
      void scene.offsetWidth;
    }

    function openGate() {
      opened = true;
      knocks = 0;
      clearTimeout(knockTimer);
      clearTimeout(hintTimer);
      gateButton.classList.remove('touch-hint');
      gateButton.setAttribute('aria-label', '點一下關上大門');
      scene.classList.add('is-open');
    }

    gateButton.addEventListener('click', () => {
      if (opened) {
        closeGate();
        return;
      }

      if (window.matchMedia('(hover: none)').matches) {
        gateButton.classList.add('touch-hint');
        clearTimeout(hintTimer);
        hintTimer = setTimeout(() => {
          gateButton.classList.remove('touch-hint');
        }, 1600);
      }

      knocks++;
      clearTimeout(knockTimer);
      knockTimer = setTimeout(() => {
        knocks = 0;
      }, 3000);

      if (knocks >= 3) openGate();
    });

    window.addEventListener('load', () => {
      ['hsuan-gate-open.png', 'hsuan-snail.png'].forEach(src => {
        const image = new Image();
        image.src = src;
      });
    });
  </script>
</body>
</html>
