<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>宣的世界｜大門動畫</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Noto Sans TC", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #241626;
    }
    button { font: inherit; }

    #stage {
      position: absolute;
      width: 1672px;
      height: 941px;
      left: 50%;
      top: 50%;
      transform-origin: center;
      overflow: hidden;
    }
    .scene, .cherry {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .scene { z-index: 0; }
    .cherry { z-index: 6; }

    .address {
      position: absolute;
      left: 116px;
      top: 402px;
      width: 136px;
      height: 87px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      color: #f6cf97;
      background: linear-gradient(
        135deg, #302017, #1b120f 60%, #392318
      );
      font-family:
        "Songti TC", "Noto Serif TC", "PMingLiU", serif;
      font-size: 19px;
      font-weight: 700;
      line-height: 1.32;
      letter-spacing: .02em;
      text-align: center;
      text-shadow: 0 1px 3px #000;
      pointer-events: none;
    }
    .address span { white-space: nowrap; }

    .doorway {
      position: absolute;
      left: 398px;
      top: 203px;
      width: 736px;
      height: 578px;
      perspective: 1150px;
      z-index: 3;
      pointer-events: none;
    }
    .leaf {
      position: absolute;
      top: 12px;
      width: 368px;
      height: 554px;
      background-image: url("gate-closed.png");
      background-size: 1672px 941px;
      background-repeat: no-repeat;
      backface-visibility: hidden;
      transform-style: preserve-3d;
      transition:
        transform 1.65s cubic-bezier(.23,.67,.19,1),
        filter 1.65s ease;
    }
    .leaf::after {
      content: "";
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 18px #200d07a6;
      pointer-events: none;
    }
    .leaf.left {
      left: 0;
      transform-origin: 0 50%;
      background-position: -398px -215px;
    }
    .leaf.right {
      right: 0;
      transform-origin: 100% 50%;
      background-position: -766px -215px;
    }
    #stage.open .leaf.left {
      transform: rotateY(-83deg);
      filter: brightness(.72);
    }
    #stage.open .leaf.right {
      transform: rotateY(83deg);
      filter: brightness(.72);
    }

    .gate-hit {
      position: absolute;
      left: 398px;
      top: 203px;
      width: 736px;
      height: 578px;
      z-index: 7;
      border: 0;
      background: transparent;
      cursor: pointer;
      color: transparent;
    }
    .gate-hit:focus-visible,
    .about:focus-visible {
      outline: 4px solid #fff;
      outline-offset: -5px;
    }

    /* 動態水柱：淡化裁切邊緣，避免水盆中央出現直條。 */
    .water {
      position: absolute;
      left: 1360px;
      top: 594px;
      width: 291px;
      height: 281px;
      object-fit: contain;
      clip-path: polygon(
        60% 25%, 66% 25%,
        66% 70%, 60% 70%
      );
      mask-image: linear-gradient(
        to right,
        transparent,
        black 35% 65%,
        transparent
      );
      mix-blend-mode: screen;
      z-index: 4;
      pointer-events: none;
    }
    .water[hidden], .snail[hidden] {
      display: none;
    }

    /* 水面反光會橫向流動，漣漪只作輕微輔助。 */
    .pool {
      position: absolute;
      left: 1438px;
      top: 763px;
      width: 190px;
      height: 48px;
      z-index: 5;
      overflow: hidden;
      border-radius: 50%;
      pointer-events: none;
      mix-blend-mode: screen;
      mask-image: radial-gradient(
        ellipse,
        black 45%,
        transparent 72%
      );
      background: repeating-linear-gradient(
        103deg,
        transparent 0 17px,
        #ffe9ae1e 20px 22px,
        transparent 25px 39px
      );
      background-size: 240% 100%;
      animation: waterSurface 4.2s linear infinite;
    }
    .pool::before, .pool::after {
      content: "";
      position: absolute;
      left: 51%;
      top: 46%;
      width: 35px;
      height: 7px;
      border: 1px solid #ffe8bb73;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(.3);
      opacity: 0;
      animation: ripple 3.4s ease-out infinite;
    }
    .pool::after {
      animation-delay: 1.7s;
    }
    @keyframes ripple {
      0% {
        transform: translate(-50%, -50%) scale(.3);
        opacity: .52;
      }
      100% {
        transform: translate(-50%, -50%) scale(3);
        opacity: 0;
      }
    }
    @keyframes waterSurface {
      from { background-position: 0% center; }
      to { background-position: 100% center; }
    }

    .petal {
      position: absolute;
      width: 13px;
      height: 9px;
      z-index: 8;
      background: #ffb7d0;
      border-radius: 85% 10% 85% 15%;
      box-shadow: 0 1px 5px #77284a80;
      pointer-events: none;
      opacity: 0;
      animation: fall 7s linear infinite;
    }
    .petal:nth-of-type(1) {
      left: 240px;
      top: 175px;
      animation-delay: 0s;
    }
    .petal:nth-of-type(2) {
      left: 526px;
      top: 110px;
      animation-delay: 2.5s;
    }
    .petal:nth-of-type(3) {
      left: 681px;
      top: 80px;
      animation-delay: 4.6s;
    }
    @keyframes fall {
      0% {
        opacity: 0;
        transform: translate(0,0) rotate(0);
      }
      12% { opacity: .95; }
      87% { opacity: .8; }
      100% {
        opacity: 0;
        transform: translate(170px,580px) rotate(660deg);
      }
    }

    .welcome {
      position: absolute;
      left: 488px;
      top: 337px;
      width: 657px;
      z-index: 2;
      text-align: center;
      color: #fff4df;
      opacity: 0;
      transform: translateY(15px);
      transition:
        opacity .7s .55s,
        transform .7s .55s;
      pointer-events: none;
      text-shadow:
        0 3px 12px #25100d,
        0 2px 3px #25100d;
    }
    #stage.open .welcome {
      opacity: 1;
      transform: translateY(0);
    }
    .welcome strong {
      display: block;
      font-family:
        "Songti TC", "Noto Serif TC", "PMingLiU", serif;
      font-weight: 700;
      font-size: 51px;
      letter-spacing: .16em;
    }
    .welcome .en {
      display: block;
      margin-top: 5px;
      font-size: 29px;
      letter-spacing: .08em;
      opacity: 0;
    }
    #stage.open .welcome .zh {
      animation: zhWelcome 7s 1.3s both;
    }
    #stage.open .welcome .en {
      animation: enWelcome 5s 8.3s both;
    }
    @keyframes zhWelcome {
      0% {
        opacity: 0;
        filter: blur(9px);
      }
      16%, 77% {
        opacity: 1;
        filter: blur(0);
      }
      100% {
        opacity: 0;
        filter: blur(8px);
      }
    }
    @keyframes enWelcome {
      0% {
        opacity: 0;
        filter: blur(9px);
      }
      20%, 82% {
        opacity: 1;
        filter: blur(0);
      }
      100% {
        opacity: 0;
        filter: blur(8px);
      }
    }

    .snail {
      position: absolute;
      left: 957px;
      top: 668px;
      width: 166px;
      height: 166px;
      object-fit: contain;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
    }
    #stage.open .snail {
      animation: crawl 9s 1.1s both linear;
    }
    @keyframes crawl {
      0% {
        opacity: 0;
        transform: translateX(0);
      }
      7%, 91% { opacity: 1; }
      100% {
        opacity: 0;
        transform: translateX(-415px);
      }
    }

    .about {
      position: absolute;
      left: 1257px;
      top: 361px;
      width: 278px;
      height: 133px;
      z-index: 9;
      border: 0;
      background: transparent;
      cursor: pointer;
      color: #fff;
    }
    .about span {
      display: inline-block;
      padding: 9px 18px;
      border-radius: 18px;
      background: #33201ddc;
      opacity: 0;
      transform: translateY(7px);
      transition: .2s;
      font-size: 23px;
    }
    .about:hover span,
    .about:focus-visible span {
      opacity: 1;
      transform: translateY(0);
    }

    /* 提示只在滑鼠進入門的範圍時顯示。 */
    .hint {
      position: absolute;
      bottom: 27px;
      left: 50%;
      z-index: 9;
      transform: translateX(-50%);
      opacity: 0;
      color: #fff8ec;
      background: #211818bd;
      border-radius: 999px;
      padding: 9px 20px;
      font-size: 18px;
      letter-spacing: .08em;
      white-space: nowrap;
      pointer-events: none;
      transition: opacity .25s;
    }
    #stage.show-hint:not(.open) .hint {
      opacity: 1;
    }
    #stage.open .hint {
      opacity: 0;
    }

    dialog {
      border: 1px solid #f5d6ac;
      border-radius: 16px;
      background: #281b1c;
      color: #fff6e9;
      padding: 30px;
      max-width: min(90vw,480px);
      box-shadow: 0 20px 90px #0008;
    }
    dialog::backdrop {
      background: #130d12a8;
    }
    dialog button {
      padding: 8px 18px;
      border: 1px solid #d5b08b;
      border-radius: 9px;
      background: #503431;
      color: white;
      cursor: pointer;
    }

    @media (prefers-reduced-motion: reduce) {
      .leaf, .welcome {
        transition-duration: .01ms;
      }
      .petal, .pool,
      .pool::before, .pool::after {
        animation: none;
      }
      #stage.open .snail {
        animation: none;
        opacity: 1;
      }
      #stage.open .welcome .zh {
        animation: none;
        opacity: 1;
        filter: none;
      }
      #stage.open .welcome .en {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main id="stage">
    <img
      class="scene"
      src="gate-open.png"
      alt="黃昏中的日式庭院與固定的木造門框"
    >

    <div
      class="address"
      aria-label="軟體動物市腹足區蝸牛路1號"
    >
      <span>軟體動物市</span>
      <span>腹足區</span>
      <span>蝸牛路1號</span>
    </div>

    <div class="welcome" aria-live="polite">
      <strong class="zh">歡迎來到宣的世界</strong>
      <span class="en">Welcome to Hsuan World</span>
    </div>

    <div class="doorway" aria-hidden="true">
      <div class="leaf left"></div>
      <div class="leaf right"></div>
    </div>

    <img
      class="water"
      src="hsuan-water-basin.webp"
      alt=""
      hidden
    >
    <div class="pool" aria-hidden="true"></div>

    <img
      class="snail"
      src="hsuan-snail.png"
      alt=""
      hidden
    >
    <img
      class="cherry"
      src="cherry-foreground.png"
      alt=""
      aria-hidden="true"
    >

    <i class="petal"></i>
    <i class="petal"></i>
    <i class="petal"></i>

    <button
      class="gate-hit"
      type="button"
      aria-label="敲門三下，開啟大門"
      aria-expanded="false"
    ></button>

    <button
      class="about"
      type="button"
      aria-label="關於宣的世界"
    >
      <span>關於我</span>
    </button>

    <div class="hint" aria-hidden="true">
      敲門三下，進來看看
    </div>
  </main>

  <dialog id="about-dialog">
    <h2>宣的世界</h2>
    <p>這裡可以放入原網站的「關於我」內容或連結。</p>
    <form method="dialog">
      <button>關閉</button>
    </form>
  </dialog>

  <script>
    const stage = document.querySelector("#stage");
    const gate = document.querySelector(".gate-hit");
    const about = document.querySelector(".about");
    const dialog = document.querySelector("#about-dialog");

    let knocks = 0;
    let lastKnock = 0;

    function fit() {
      const scale = Math.max(
        innerWidth / 1672,
        innerHeight / 941
      );
      stage.style.transform =
        `translate(-50%, -50%) scale(${scale})`;
    }
    addEventListener("resize", fit);
    fit();

    gate.addEventListener(
      "pointerenter",
      () => stage.classList.add("show-hint")
    );
    gate.addEventListener(
      "pointerleave",
      () => stage.classList.remove("show-hint")
    );
    gate.addEventListener(
      "focus",
      () => stage.classList.add("show-hint")
    );
    gate.addEventListener(
      "blur",
      () => stage.classList.remove("show-hint")
    );
    addEventListener(
      "blur",
      () => stage.classList.remove("show-hint")
    );

    gate.addEventListener("click", () => {
      if (stage.classList.contains("open")) {
        stage.classList.remove("open");
        gate.setAttribute("aria-expanded", "false");
        gate.setAttribute(
          "aria-label",
          "敲門三下，開啟大門"
        );
        knocks = 0;
        return;
      }

      const now = performance.now();
      knocks = now - lastKnock > 2300
        ? 1
        : knocks + 1;
      lastKnock = now;

      if (knocks >= 3) {
        stage.classList.add("open");
        stage.classList.remove("show-hint");
        gate.setAttribute("aria-expanded", "true");
        gate.setAttribute("aria-label", "關上大門");
        knocks = 0;
      }
    });

    about.addEventListener(
      "click",
      () => dialog.showModal()
    );

    for (const img of document.querySelectorAll(
      ".water, .snail"
    )) {
      img.addEventListener("load", () => {
        img.hidden = false;
      }, { once: true });

      if (img.complete && img.naturalWidth) {
        img.hidden = false;
      }
    }
  </script>
</body>
</html>
