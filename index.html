<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>宣的世界｜大門動畫預覽</title>
  <style>
    :root { color-scheme: dark; font-family: "Noto Sans TC", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #241626; }
    button { font: inherit; }
    #stage { position: absolute; width: 1672px; height: 941px; left: 50%; top: 50%; transform-origin: center; overflow: hidden; }
    .scene, .cherry { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .scene { z-index: 0; }
    .cherry { z-index: 6; }

    .address {
      position: absolute;
      left: 116px;
      top: 402px;
      width: 136px;
      height: 87px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      color: #f6cf97;
      background: linear-gradient(135deg, #302017, #1b120f 60%, #392318);
      font-family: "Songti TC", "Noto Serif TC", "PMingLiU", serif;
      font-size: 19px;
      font-weight: 700;
      line-height: 1.32;
      letter-spacing: .02em;
      text-align: center;
      text-shadow: 0 1px 3px #000;
      pointer-events: none;
    }
    .address span { white-space: nowrap; }

    .doorway { position: absolute; left: 398px; top: 203px; width: 736px; height: 578px; perspective: 1150px; z-index: 3; pointer-events: none; }
    .leaf { position: absolute; top: 12px; height: 554px; width: 368px; background-image: url('gate-closed.png'); background-size: 1672px 941px; background-repeat: no-repeat; backface-visibility: hidden; transform-style: preserve-3d; transition: transform 1.65s cubic-bezier(.23,.67,.19,1), filter 1.65s ease; }
    .leaf::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 18px #200d07a6; pointer-events: none; }
    .leaf.left { left: 0; transform-origin: 0 50%; background-position: -398px -215px; }
    .leaf.right { right: 0; transform-origin: 100% 50%; background-position: -766px -215px; }
    #stage.open .leaf.left { transform: rotateY(-83deg); filter: brightness(.72); }
    #stage.open .leaf.right { transform: rotateY(83deg); filter: brightness(.72); }
    .gate-hit { position: absolute; left: 398px; top: 203px; width: 736px; height: 578px; z-index: 7; border: 0; background: transparent; cursor: pointer; color: transparent; }
    .gate-hit:focus-visible, .about:focus-visible { outline: 4px solid #fff; outline-offset: -5px; }

    .water-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
    .snail[hidden] { display: none; }

    .petal { position: absolute; width: 13px; height: 9px; z-index: 8; background: #ffb7d0; border-radius: 85% 10% 85% 15%; box-shadow: 0 1px 5px #77284a80; pointer-events: none; opacity: 0; animation: fall 7s linear infinite; }
    .petal:nth-of-type(1) { left: 240px; top: 175px; animation-delay: 0s; }
    .petal:nth-of-type(2) { left: 526px; top: 110px; animation-delay: 2.5s; }
    .petal:nth-of-type(3) { left: 681px; top: 80px; animation-delay: 4.6s; }
    @keyframes fall { 0% { opacity: 0; transform: translate(0,0) rotate(0); } 12% { opacity: .95; } 87% { opacity: .8; } 100% { opacity: 0; transform: translate(170px,580px) rotate(660deg); } }

    .welcome { position: absolute; left: 488px; top: 337px; width: 657px; z-index: 2; text-align: center; color: #fff4df; opacity: 0; transform: translateY(15px); transition: opacity .7s .55s, transform .7s .55s; pointer-events: none; text-shadow: 0 3px 12px #25100d, 0 2px 3px #25100d; }
    #stage.open .welcome { opacity: 1; transform: translateY(0); }
    .welcome strong { display: block; font-family: "Songti TC", "Noto Serif TC", "PMingLiU", serif; font-weight: 700; font-size: 51px; letter-spacing: .16em; }
    .welcome .en { display: block; margin-top: 5px; font-size: 29px; letter-spacing: .08em; opacity: 0; }
    #stage.open .welcome .zh { animation: zhWelcome 7s 1.3s both; }
    #stage.open .welcome .en { animation: enWelcome 5s 8.3s both; }
    @keyframes zhWelcome { 0% { opacity: 0; filter: blur(9px); } 16%, 77% { opacity: 1; filter: blur(0); } 100% { opacity: 0; filter: blur(8px); } }
    @keyframes enWelcome { 0% { opacity: 0; filter: blur(9px); } 20%, 82% { opacity: 1; filter: blur(0); } 100% { opacity: 0; filter: blur(8px); } }

    .snail { position: absolute; left: 957px; top: 668px; width: 166px; height: 166px; object-fit: contain; z-index: 5; pointer-events: none; opacity: 0; }
    #stage.open .snail { animation: crawl 9s 1.1s both linear; }
    @keyframes crawl { 0% { opacity: 0; transform: translateX(0); } 7%, 91% { opacity: 1; } 100% { opacity: 0; transform: translateX(-415px); } }

    .about { position: absolute; left: 1257px; top: 361px; width: 278px; height: 133px; z-index: 9; border: 0; background: transparent; cursor: pointer; color: #fff; }
    .about span { display: inline-block; padding: 9px 18px; border-radius: 18px; background: #33201ddc; opacity: 0; transform: translateY(7px); transition: .2s; font-size: 23px; }
    .about:hover span, .about:focus-visible span { opacity: 1; transform: translateY(0); }

    .hint { position: absolute; bottom: 27px; left: 50%; z-index: 9; transform: translateX(-50%); opacity: 0; color: #fff8ec; background: #211818bd; border-radius: 999px; padding: 9px 20px; font-size: 18px; letter-spacing: .08em; white-space: nowrap; pointer-events: none; transition: opacity .4s; }
    #stage.show-hint:not(.open) .hint { opacity: 1; }
    #stage.open .hint { opacity: 0; }

    dialog { border: 1px solid #f5d6ac; border-radius: 16px; background: #281b1c; color: #fff6e9; padding: 30px; max-width: min(90vw,480px); box-shadow: 0 20px 90px #0008; }
    dialog::backdrop { background: #130d12a8; }
    dialog button { padding: 8px 18px; border: 1px solid #d5b08b; border-radius: 9px; background: #503431; color: white; cursor: pointer; }

    @media (prefers-reduced-motion: reduce) {
      .leaf, .welcome { transition-duration: .01ms; }
      .petal { animation: none; }
      #stage.open .snail { animation: none; opacity: 1; }
      #stage.open .welcome .zh { animation: none; opacity: 1; filter: none; }
      #stage.open .welcome .en { animation: none; }
    }
  </style>
</head>
<body>
  <main id="stage">
    <img class="scene" src="gate-open.png" alt="黃昏中的日式庭院與固定的木造門框">
    <div class="address" aria-label="軟體動物市腹足區蝸牛路1號">
      <span>軟體動物市</span><span>腹足區</span><span>蝸牛路1號</span>
    </div>
    <div class="welcome" aria-live="polite">
      <strong class="zh">歡迎來到宣的世界</strong>
      <span class="en">Welcome to Hsuan World</span>
    </div>
    <div class="doorway" aria-hidden="true">
      <div class="leaf left"></div>
      <div class="leaf right"></div>
    </div>
    <canvas class="water-canvas" id="water-canvas" width="1672" height="941" aria-hidden="true"></canvas>
    <img class="snail" src="hsuan-snail.png" alt="" hidden>
    <img class="cherry" src="cherry-foreground.png" alt="" aria-hidden="true">
    <i class="petal"></i><i class="petal"></i><i class="petal"></i>
    <button class="gate-hit" type="button" aria-label="敲門三下，開啟大門" aria-expanded="false"></button>
    <button class="about" type="button" aria-label="關於宣的世界"><span>關於我</span></button>
    <div class="hint" aria-hidden="true">敲門三下，進來看看</div>
  </main>

  <dialog id="about-dialog">
    <h2>宣的世界</h2>
    <p>這裡可以放入原網站的「關於我」內容或連結。</p>
    <form method="dialog"><button>關閉</button></form>
  </dialog>

  <script>
    const stage = document.querySelector('#stage');
    const gate = document.querySelector('.gate-hit');
    const about = document.querySelector('.about');
    const dialog = document.querySelector('#about-dialog');
    let knocks = 0, lastKnock = 0;

    function fit() {
      const scale = Math.max(innerWidth / 1672, innerHeight / 941);
      stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }
    addEventListener('resize', fit);
    fit();

    gate.addEventListener('pointerenter', () => stage.classList.add('show-hint'));
    gate.addEventListener('pointerleave', () => stage.classList.remove('show-hint'));
    gate.addEventListener('focus', () => stage.classList.add('show-hint'));
    gate.addEventListener('blur', () => stage.classList.remove('show-hint'));
    addEventListener('blur', () => stage.classList.remove('show-hint'));

    gate.addEventListener('click', () => {
      if (stage.classList.contains('open')) {
        stage.classList.remove('open');
        gate.setAttribute('aria-expanded', 'false');
        gate.setAttribute('aria-label', '敲門三下，開啟大門');
        knocks = 0;
        return;
      }
      const now = performance.now();
      knocks = now - lastKnock > 2300 ? 1 : knocks + 1;
      lastKnock = now;
      if (knocks >= 3) {
        stage.classList.add('open');
        stage.classList.remove('show-hint');
        gate.setAttribute('aria-expanded', 'true');
        gate.setAttribute('aria-label', '關上大門');
        knocks = 0;
      }
    });

    about.addEventListener('click', () => dialog.showModal());

    const snail = document.querySelector('.snail');
    snail.addEventListener('load', () => { snail.hidden = false; }, {once: true});
    if (snail.complete && snail.naturalWidth) snail.hidden = false;

    // 只動石盆內側的水面；不重畫竹管、石盆或整塊背景。
    const scene = document.querySelector('.scene');
    const canvas = document.querySelector('#water-canvas');
    const ctx = canvas.getContext('2d');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    let waterStarted = false, previousFrame = 0;

    function drawWater(time) {
      if (reducedMotion.matches) {
        ctx.clearRect(0, 0, 1672, 941);
        waterStarted = false;
        return;
      }
      requestAnimationFrame(drawWater);
      if (time - previousFrame < 33) return;
      previousFrame = time;
      const seconds = time / 1000;
      ctx.clearRect(1420, 672, 230, 145);

      // 遮罩比石盆內緣小，水的動態不會碰到石盆邊框。
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(1534, 772, 77, 14, -0.035, 0, Math.PI * 2);
      ctx.clip();
      ctx.globalAlpha = 0.86;

      for (let y = 755; y < 790; y += 2) {
        const horizontal =
          Math.sin(y * .29 + seconds * 3.1) * 2.3 +
          Math.sin(y * .13 - seconds * 1.7) * 1.2;
        const vertical = Math.sin(y * .37 + seconds * 2.2) * .8;
        ctx.drawImage(
          scene, 1448 + horizontal, y + vertical, 174, 2.4,
          1448, y, 174, 2.4
        );
      }

      ctx.globalAlpha = 1;
      for (let i = 0; i < 5; i++) {
        const x = 1470 + i * 29 + Math.sin(seconds * 1.7 + i * 2) * 8;
        const y = 769 + Math.sin(seconds * 2.5 + i * 2.3) * 5;
        const glow = ctx.createLinearGradient(x - 15, y, x + 18, y);
        glow.addColorStop(0, 'rgba(255,229,171,0)');
        glow.addColorStop(
          .5,
          `rgba(255,232,186,${.11 + .10 * Math.sin(seconds * 2 + i) ** 2})`
        );
        glow.addColorStop(1, 'rgba(255,229,171,0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.ellipse(x, y, 19, 1.3, -.08, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // 原圖已有水柱，只沿著它加小亮點，不增加第二根出水口。
      for (let i = 0; i < 10; i++) {
        const progress = (i / 10 + seconds * .53) % 1;
        const inverse = 1 - progress;
        const x =
          inverse * inverse * 1565 +
          2 * inverse * progress * 1544 +
          progress * progress * 1544;
        const y =
          inverse * inverse * 690 +
          2 * inverse * progress * 716 +
          progress * progress * 765;
        ctx.fillStyle =
          `rgba(255,243,209,${.11 + .17 * Math.sin(Math.PI * progress)})`;
        ctx.beginPath();
        ctx.ellipse(x, y, 1.1, 2.3, -.15, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function startWater() {
      if (!ctx || waterStarted || !scene.naturalWidth || reducedMotion.matches) return;
      waterStarted = true;
      requestAnimationFrame(drawWater);
    }
    scene.addEventListener('load', startWater);
    if (scene.complete) startWater();
    reducedMotion.addEventListener('change', startWater);
  </script>
</body>
</html>
