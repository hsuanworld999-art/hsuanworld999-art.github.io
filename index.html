<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#24170e"
>

<title>ASD 蝸小宣的家｜HSUAN WORLD</title>

<style>

/* =========================================================
   基本
========================================================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: #21150e;

  font-family:
    "Noto Serif TC",
    "Songti TC",
    "PingFang TC",
    serif;
}


/* =========================================================
   主場景

   hsuan-gate.png 原始座標：
   1536 × 864
========================================================= */

.scene {
  position: relative;

  width: 100vw;
  height: 100vh;
  height: 100dvh;

  overflow: hidden;

  background: #21150e;

  isolation: isolate;

  perspective: 1900px;
}


/* =========================================================
   固定首頁背景

   ★ 開門時這張不消失
   ★ 屋頂、牆、牌子、水盆全部固定
========================================================= */

.scene-base {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;
  object-position: center;

  z-index: 0;

  pointer-events: none;

  user-select: none;
}


/* =========================================================
   門洞

   只有這個區域會露出 hsuan-gate-open.png
========================================================= */

.portal {
  position: absolute;

  left: 0;
  top: 0;

  width: 1px;
  height: 1px;

  overflow: hidden;

  z-index: 2;

  background: #1c120c;

  opacity: 0;

  transition:
    opacity .38s ease;

  pointer-events: none;

  box-shadow:
    inset 0 0 18px rgba(0,0,0,.32),
    inset 0 0 50px rgba(0,0,0,.18);
}


.scene.is-opening .portal,
.scene.is-open .portal {
  opacity: 1;
}


/* 門後庭院 */

.portal-image {
  position: absolute;

  inset: -4%;

  width: 108%;
  height: 108%;

  object-fit: cover;
  object-position: center;

  transform:
    scale(1.035);

  transition:
    transform 2.4s ease;

  filter:
    brightness(.97)
    saturate(1.02);

  pointer-events: none;
}


.scene.is-opening
.portal-image,

.scene.is-open
.portal-image {

  transform:
    scale(1);
}


/* =========================================================
   3D 雙門舞台
========================================================= */

.door-stage {
  position: absolute;

  left: 0;
  top: 0;

  width: 1px;
  height: 1px;

  z-index: 10;

  transform-style: preserve-3d;

  perspective: 1650px;

  pointer-events: none;
}


/* =========================================================
   每一扇門
========================================================= */

.door-leaf {
  position: absolute;

  top: 0;

  width: 50%;
  height: 100%;

  transform-style:
    preserve-3d;

  will-change:
    transform;

  transition:
    transform 1.75s
    cubic-bezier(.18,.68,.18,1);

  backface-visibility:
    hidden;

  -webkit-backface-visibility:
    hidden;
}


/* 左門 */

.door-leaf.left {
  left: 0;

  transform-origin:
    left center;

  transform:
    rotateY(0deg);
}


/* 右門 */

.door-leaf.right {
  right: 0;

  transform-origin:
    right center;

  transform:
    rotateY(0deg);
}


/* =========================================================
   門片圖片

   新素材：
   hsuan-door-left.png
   hsuan-door-right.png
========================================================= */

.door-image {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: fill;

  display: block;

  backface-visibility:
    hidden;

  -webkit-backface-visibility:
    hidden;

  filter:
    drop-shadow(
      0 5px 7px
      rgba(0,0,0,.16)
    );
}


/* =========================================================
   門的厚度

   開門時會看到一點木門側邊
========================================================= */

.door-edge {
  position: absolute;

  top: 1%;

  width: 12px;
  height: 98%;

  background:
    linear-gradient(
      to right,
      #3c1d0d,
      #8e481d,
      #3a1b0c
    );

  opacity: .82;

  backface-visibility:
    hidden;

  pointer-events: none;
}


.left .door-edge {
  right: -6px;

  transform:
    rotateY(90deg);
}


.right .door-edge {
  left: -6px;

  transform:
    rotateY(-90deg);
}


/* =========================================================
   開門

   外側鉸鏈固定，
   中間門縫往內展開
========================================================= */

.scene.is-opening
.door-leaf.left,

.scene.is-open
.door-leaf.left {

  transform:
    rotateY(-104deg);
}


.scene.is-opening
.door-leaf.right,

.scene.is-open
.door-leaf.right {

  transform:
    rotateY(104deg);
}


/* =========================================================
   開門時陰影
========================================================= */

.door-shadow {
  position: absolute;

  inset: 0;

  pointer-events: none;

  opacity: 0;

  transition:
    opacity 1.2s ease;

  background:
    radial-gradient(
      ellipse at center,
      rgba(0,0,0,.02),
      rgba(0,0,0,.26)
    );
}


.scene.is-opening
.door-shadow,

.scene.is-open
.door-shadow {

  opacity: .62;
}


/* =========================================================
   櫻花枝

   只做非常微小的晃動。
   不讓屋頂一起變形。
========================================================= */

.branch {
  position: absolute;

  inset: 0;

  z-index: 3;

  pointer-events: none;

  background:
    url("hsuan-gate.png")
    center / cover
    no-repeat;

  will-change:
    transform;
}


/* 左上 */

.branch-left {

  transform-origin:
    5% 3%;

  clip-path:
    polygon(
      0 0,
      48% 0,
      35% 30%,
      16% 39%,
      0 45%
    );

  animation:
    leftBranch
    12s
    ease-in-out
    infinite;
}


/* 右上 */

.branch-right {

  transform-origin:
    95% 3%;

  clip-path:
    polygon(
      54% 0,
      100% 0,
      100% 43%,
      78% 36%,
      68% 28%
    );

  animation:
    rightBranch
    14s
    ease-in-out
    infinite;
}


@keyframes leftBranch {

  0%,
  15%,
  30% {

    transform:
      rotate(0deg)
      translate(0,0);
  }


  40% {

    transform:
      rotate(.48deg)
      translate(2px,1px);
  }


  50% {

    transform:
      rotate(-.25deg)
      translate(-1px,0);
  }


  60%,
  75% {

    transform:
      rotate(0deg)
      translate(0,0);
  }


  85% {

    transform:
      rotate(.62deg)
      translate(3px,1px);
  }


  100% {

    transform:
      rotate(0deg)
      translate(0,0);
  }

}


@keyframes rightBranch {

  0%,
  18%,
  34% {

    transform:
      rotate(0deg)
      translate(0,0);
  }


  44% {

    transform:
      rotate(-.48deg)
      translate(-2px,1px);
  }


  54% {

    transform:
      rotate(.22deg)
      translate(1px,0);
  }


  64%,
  78% {

    transform:
      rotate(0deg)
      translate(0,0);
  }


  88% {

    transform:
      rotate(-.62deg)
      translate(-3px,1px);
  }


  100% {

    transform:
      rotate(0deg)
      translate(0,0);
  }

}


/* =========================================================
   飄落花瓣
========================================================= */

.petals {
  position: absolute;

  inset: 0;

  z-index: 20;

  overflow: hidden;

  pointer-events: none;
}


.petal {
  position: absolute;

  top: -10vh;

  width:
    var(--size);

  height:
    calc(var(--size) * 1.4);

  border-radius:
    80% 18% 75% 22%;

  opacity:
    var(--opacity);

  background:
    radial-gradient(
      ellipse at 30% 25%,
      rgba(255,255,255,.98),
      rgba(255,224,235,.96) 40%,
      rgba(246,171,194,.90) 100%
    );

  box-shadow:
    0 0 4px
    rgba(255,220,232,.28);

  animation:
    petalFall
    var(--duration)
    linear
    var(--delay)
    infinite;
}


@keyframes petalFall {

  0% {

    opacity: 0;

    transform:
      translate3d(
        0,
        -10vh,
        0
      )
      rotate(0deg);
  }


  10% {

    opacity:
      var(--opacity);
  }


  45% {

    transform:
      translate3d(
        var(--middle),
        50vh,
        0
      )
      rotate(145deg);
  }


  100% {

    opacity: 0;

    transform:
      translate3d(
        var(--end),
        112vh,
        0
      )
      rotate(330deg);
  }

}


/* =========================================================
   動態水盆

   永遠運作
========================================================= */

.water-basin {
  position: absolute;

  left: 0;
  top: 0;

  width: 1px;
  height: 1px;

  z-index: 25;

  pointer-events: none;

  object-fit: fill;

  -webkit-mask-image:
    radial-gradient(
      ellipse 76% 76%
      at 63% 53%,

      #000 52%,
      rgba(0,0,0,.98) 68%,
      rgba(0,0,0,.72) 82%,
      rgba(0,0,0,.28) 92%,
      transparent 100%
    );

  mask-image:
    radial-gradient(
      ellipse 76% 76%
      at 63% 53%,

      #000 52%,
      rgba(0,0,0,.98) 68%,
      rgba(0,0,0,.72) 82%,
      rgba(0,0,0,.28) 92%,
      transparent 100%
    );
}


/* =========================================================
   大門點擊區
========================================================= */

.gate-button {
  position: absolute;

  left: 29%;
  top: 20%;

  width: 42%;
  height: 63%;

  z-index: 60;

  border: 0;

  padding: 0;

  background:
    transparent;

  cursor:
    pointer;

  touch-action:
    manipulation;

  -webkit-tap-highlight-color:
    transparent;
}


/* 門開後，點入口即可關門 */

.scene.is-open
.gate-button {

  left: 0;
  top: 0;

  width: 100%;
  height: 100%;
}


/* =========================================================
   提示
========================================================= */

.hint {
  position: absolute;

  left: 50%;
  top: 49%;

  transform:
    translate(-50%,-50%);

  opacity: 0;

  white-space:
    nowrap;

  pointer-events:
    none;

  color:
    #fff3d5;

  font-size:
    clamp(
      16px,
      1.6vw,
      27px
    );

  letter-spacing:
    .12em;

  text-shadow:
    0 2px 8px #251208,
    0 3px 18px rgba(18,8,3,.9);

  transition:
    opacity .3s ease;
}


@media
(hover:hover)
and
(pointer:fine) {

  .scene:not(.is-open)
  .gate-button:hover
  .hint {

    opacity: 1;
  }

}


.gate-button.touch-hint
.hint {

  opacity: 1;
}


/* =========================================================
   歡迎動畫
========================================================= */

.welcome-stage {
  position: absolute;

  z-index: 50;

  left: 22%;
  top: 28%;

  width: 56%;
  height: 31%;

  overflow:
    hidden;

  pointer-events:
    none;
}


.welcome-track {
  position: absolute;

  left: 0;
  top: 50%;

  width: 100%;

  display: flex;

  align-items:
    center;

  justify-content:
    center;

  gap:
    13px;

  visibility:
    hidden;

  opacity: 0;

  transform:
    translate(105%,-50%);
}


.welcome-track.running {

  visibility:
    visible;

  opacity: 1;

  animation:
    snailMove
    18s
    linear
    both;
}


@keyframes snailMove {

  0% {

    transform:
      translate(105%,-50%);
  }


  28% {

    transform:
      translate(8%,-50%);
  }


  70% {

    transform:
      translate(-4%,-50%);
  }


  100% {

    transform:
      translate(-108%,-50%);
  }

}


.snail {
  width:
    clamp(
      52px,
      5.7vw,
      90px
    );

  height:
    auto;

  flex:
    none;

  filter:
    drop-shadow(
      0 3px 8px
      rgba(32,14,5,.45)
    );
}


.message-box {

  display:
    flex;

  flex-direction:
    column;

  align-items:
    flex-start;
}


.message {
  margin: 0;

  opacity: 0;

  white-space:
    nowrap;

  color:
    #fff0c5;

  filter:
    blur(15px);

  text-shadow:
    0 2px 4px #2d1608,
    0 4px 16px #1a0b04,
    0 0 20px rgba(220,161,79,.94);
}


.message.zh {

  font-size:
    clamp(
      16px,
      1.8vw,
      29px
    );
}


.message.en {

  margin-top:
    4px;

  font-family:
    Baskerville,
    Georgia,
    serif;

  font-style:
    italic;

  font-size:
    clamp(
      13px,
      1.2vw,
      20px
    );
}


.message.reveal {

  animation:
    mist
    5.3s
    ease-in-out
    both;
}


@keyframes mist {

  0% {

    opacity: 0;

    filter:
      blur(15px);
  }


  18% {

    opacity: 1;

    filter:
      blur(0);
  }


  66% {

    opacity: 1;

    filter:
      blur(0);
  }


  100% {

    opacity: 0;

    filter:
      blur(10px);
  }

}


/* =========================================================
   手機
========================================================= */

@media
(max-width:768px) {

  .gate-button {

    left: 18%;
    top: 18%;

    width: 64%;
    height: 65%;
  }


  .welcome-stage {

    left: 10%;

    width: 80%;
  }


  .snail {

    width:
      clamp(
        40px,
        11vw,
        62px
      );
  }


  .message.zh {

    font-size:
      clamp(
        12px,
        3vw,
        19px
      );

    white-space:
      normal;
  }


  .message.en {

    font-size:
      clamp(
        10px,
        2.4vw,
        15px
      );

    white-space:
      normal;
  }

}

</style>

</head>


<body>


<main
  class="scene"
  id="scene"
>


  <!-- =====================================================
       固定首頁背景
  ====================================================== -->

  <img
    class="scene-base"
    src="hsuan-gate.png"
    alt="ASD 蝸小宣的家"
    draggable="false"
  >


  <!-- =====================================================
       門後庭院
  ====================================================== -->

  <div
    class="portal"
    id="portal"
    aria-hidden="true"
  >

    <img
      class="portal-image"
      src="hsuan-gate-open.png"
      alt=""
      draggable="false"
    >

  </div>


  <!-- =====================================================
       櫻花枝
  ====================================================== -->

  <div
    class="branch branch-left"
    aria-hidden="true"
  ></div>


  <div
    class="branch branch-right"
    aria-hidden="true"
  ></div>


  <!-- =====================================================
       花瓣
  ====================================================== -->

  <div
    class="petals"
    id="petals"
    aria-hidden="true"
  ></div>


  <!-- =====================================================
       3D 雙門
  ====================================================== -->

  <div
    class="door-stage"
    id="doorStage"
    aria-hidden="true"
  >


    <div
      class="door-shadow"
    ></div>


    <!-- 左門 -->

    <div
      class="door-leaf left"
    >

      <img
        class="door-image"
        src="hsuan-door-left.png"
        alt=""
        draggable="false"
      >

      <div
        class="door-edge"
      ></div>

    </div>


    <!-- 右門 -->

    <div
      class="door-leaf right"
    >

      <img
        class="door-image"
        src="hsuan-door-right.png"
        alt=""
        draggable="false"
      >

      <div
        class="door-edge"
      ></div>

    </div>


  </div>


  <!-- =====================================================
       流水水盆
  ====================================================== -->

  <img
    class="water-basin"
    id="waterBasin"
    src="hsuan-water-basin.webp"
    alt=""
    aria-hidden="true"
  >


  <!-- =====================================================
       大門操作
  ====================================================== -->

  <button
    class="gate-button"
    id="gateButton"
    type="button"
    aria-label="點三下打開大門"
  >

    <span
      class="hint"
    >
      點三下打開大門
    </span>

  </button>


  <!-- =====================================================
       歡迎
  ====================================================== -->

  <div
    class="welcome-stage"
    aria-hidden="true"
  >

    <div
      class="welcome-track"
      id="welcomeTrack"
    >

      <img
        class="snail"
        src="hsuan-snail.png"
        alt=""
        onerror="this.style.display='none'"
      >


      <div
        class="message-box"
      >

        <p
          class="message zh"
          id="zh"
        >
          歡迎來到 ASD 蝸小宣的家
        </p>


        <p
          class="message en"
          id="en"
        >
          WELCOME TO HSUAN WORLD
        </p>

      </div>

    </div>

  </div>


</main>


<script>

/* =========================================================
   元件
========================================================= */

const scene =
  document.getElementById(
    "scene"
  );


const portal =
  document.getElementById(
    "portal"
  );


const doorStage =
  document.getElementById(
    "doorStage"
  );


const waterBasin =
  document.getElementById(
    "waterBasin"
  );


const gateButton =
  document.getElementById(
    "gateButton"
  );


const petals =
  document.getElementById(
    "petals"
  );


const welcomeTrack =
  document.getElementById(
    "welcomeTrack"
  );


const zh =
  document.getElementById(
    "zh"
  );


const en =
  document.getElementById(
    "en"
  );


/* =========================================================
   狀態
========================================================= */

let opened =
  false;


let opening =
  false;


let knocks =
  0;


let knockResetTimer =
  null;


let hintTimer =
  null;


let welcomeTimers =
  [];


/* =========================================================
   關門背景原始尺寸

   新關門圖：
   1536 × 864
========================================================= */

const SOURCE_W =
  1536;


const SOURCE_H =
  864;


/* =========================================================
   ★ 大門門洞座標

   之後如果真的只差幾個像素，
   只需要改這四個數字。

   不用再重寫整份程式。
========================================================= */

const DOOR_AREA = {

  x: 466,

  y: 220,

  width: 607,

  height: 493

};


/* =========================================================
   水盆動畫原素材座標

   之前成功的水盆仍沿用。
========================================================= */

const WATER_AREA = {

  x: 1200,

  y: 565,

  width: 336,

  height: 260

};


/* =========================================================
   計算 background-size: cover
========================================================= */

function getCoverInfo() {

  const viewW =
    scene.clientWidth;


  const viewH =
    scene.clientHeight;


  const scale =
    Math.max(

      viewW / SOURCE_W,

      viewH / SOURCE_H

    );


  const imageW =
    SOURCE_W *
    scale;


  const imageH =
    SOURCE_H *
    scale;


  return {

    scale,

    imageW,

    imageH,

    offsetX:
      (
        viewW -
        imageW
      ) / 2,

    offsetY:
      (
        viewH -
        imageH
      ) / 2

  };

}


/* =========================================================
   對齊門洞與 3D 門
========================================================= */

function positionDoor() {

  const c =
    getCoverInfo();


  const x =
    c.offsetX +
    DOOR_AREA.x *
    c.scale;


  const y =
    c.offsetY +
    DOOR_AREA.y *
    c.scale;


  const width =
    DOOR_AREA.width *
    c.scale;


  const height =
    DOOR_AREA.height *
    c.scale;


  portal.style.left =
    x + "px";


  portal.style.top =
    y + "px";


  portal.style.width =
    width + "px";


  portal.style.height =
    height + "px";


  doorStage.style.left =
    x + "px";


  doorStage.style.top =
    y + "px";


  doorStage.style.width =
    width + "px";


  doorStage.style.height =
    height + "px";

}


/* =========================================================
   對齊水盆
========================================================= */

function positionWater() {

  const c =
    getCoverInfo();


  waterBasin.style.left =
    (
      c.offsetX +
      WATER_AREA.x *
      c.scale
    )
    + "px";


  waterBasin.style.top =
    (
      c.offsetY +
      WATER_AREA.y *
      c.scale
    )
    + "px";


  waterBasin.style.width =
    (
      WATER_AREA.width *
      c.scale
    )
    + "px";


  waterBasin.style.height =
    (
      WATER_AREA.height *
      c.scale
    )
    + "px";

}


/* =========================================================
   花瓣
========================================================= */

function createPetals() {

  if (
    petals.dataset.ready
  ) {

    return;
  }


  petals.dataset.ready =
    "true";


  for (
    let i = 0;
    i < 14;
    i++
  ) {

    const p =
      document.createElement(
        "span"
      );


    p.className =
      "petal";


    const leftSide =
      Math.random() <
      .65;


    p.style.left =
      (
        leftSide

        ? Math.random() * 30

        : 70 +
          Math.random() * 27
      )
      +
      "%";


    p.style.setProperty(

      "--size",

      (
        5 +
        Math.random() *
        6
      )
      .toFixed(1)
      +
      "px"

    );


    p.style.setProperty(

      "--opacity",

      (
        .45 +
        Math.random() *
        .36
      )
      .toFixed(2)

    );


    p.style.setProperty(

      "--duration",

      (
        12 +
        Math.random() *
        10
      )
      .toFixed(1)
      +
      "s"

    );


    p.style.setProperty(

      "--delay",

      (
        -Math.random() *
        22
      )
      .toFixed(1)
      +
      "s"

    );


    p.style.setProperty(

      "--middle",

      (
        -30 +
        Math.random() *
        70
      )
      .toFixed(0)
      +
      "px"

    );


    p.style.setProperty(

      "--end",

      (
        -80 +
        Math.random() *
        170
      )
      .toFixed(0)
      +
      "px"

    );


    petals.appendChild(
      p
    );

  }

}


/* =========================================================
   敲門聲

   不需要另外音效檔。
   每一下完全依照使用者自己的點擊節奏。
========================================================= */

let audioContext =
  null;


function getAudioContext() {

  const AudioContextClass =
    window.AudioContext ||
    window.webkitAudioContext;


  if (
    !AudioContextClass
  ) {

    return null;
  }


  if (
    !audioContext
  ) {

    audioContext =
      new AudioContextClass();
  }


  if (
    audioContext.state ===
    "suspended"
  ) {

    audioContext.resume();
  }


  return audioContext;

}


function knockSound() {

  const ctx =
    getAudioContext();


  if (
    !ctx
  ) {

    return;
  }


  const now =
    ctx.currentTime;


  const oscillator =
    ctx.createOscillator();


  const gain =
    ctx.createGain();


  oscillator.type =
    "triangle";


  oscillator.frequency.setValueAtTime(
    115,
    now
  );


  oscillator.frequency.exponentialRampToValueAtTime(
    66,
    now + .08
  );


  gain.gain.setValueAtTime(
    .0001,
    now
  );


  gain.gain.exponentialRampToValueAtTime(
    .08,
    now + .008
  );


  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now + .11
  );


  oscillator.connect(
    gain
  );


  gain.connect(
    ctx.destination
  );


  oscillator.start(
    now
  );


  oscillator.stop(
    now + .12
  );

}


/* =========================================================
   歡迎動畫
========================================================= */

function clearWelcome() {

  welcomeTimers.forEach(
    timer =>
      clearTimeout(
        timer
      )
  );


  welcomeTimers =
    [];


  welcomeTrack.classList.remove(
    "running"
  );


  zh.classList.remove(
    "reveal"
  );


  en.classList.remove(
    "reveal"
  );


  void welcomeTrack.offsetWidth;

}


function later(
  fn,
  delay
) {

  welcomeTimers.push(

    setTimeout(
      fn,
      delay
    )

  );

}


/* =========================================================
   開門
========================================================= */

function openGate() {

  if (
    opening ||
    opened
  ) {

    return;
  }


  opening =
    true;


  opened =
    true;


  knocks =
    0;


  clearTimeout(
    knockResetTimer
  );


  clearTimeout(
    hintTimer
  );


  gateButton.classList.remove(
    "touch-hint"
  );


  /*
    第三下敲完，
    停 0.4 秒。
  */

  setTimeout(
    () => {

      scene.classList.add(
        "is-opening"
      );


      /*
        下一幀才真的旋轉，
        動畫比較穩。
      */

      requestAnimationFrame(
        () => {

          requestAnimationFrame(
            () => {

              scene.classList.add(
                "is-open"
              );

            }
          );

        }
      );


  }, 400);


  /*
    門開完。
  */

  setTimeout(
    () => {

      scene.classList.remove(
        "is-opening"
      );


      opening =
        false;

  }, 2250);


  gateButton.setAttribute(
    "aria-label",
    "點一下關上大門"
  );


  clearWelcome();


  /*
    蝸小宣慢慢出來
  */

  later(
    () => {

      welcomeTrack.classList.add(
        "running"
      );

    },
    2500
  );


  /*
    中文
  */

  later(
    () => {

      zh.classList.add(
        "reveal"
      );

    },
    4600
  );


  /*
    英文
  */

  later(
    () => {

      en.classList.add(
        "reveal"
      );

    },
    10000
  );

}


/* =========================================================
   關門
========================================================= */

function closeGate() {

  if (
    opening ||
    !opened
  ) {

    return;
  }


  opening =
    true;


  clearWelcome();


  scene.classList.add(
    "is-opening"
  );


  /*
    移除 is-open，
    兩扇門自然轉回 0 度。
  */

  requestAnimationFrame(
    () => {

      requestAnimationFrame(
        () => {

          scene.classList.remove(
            "is-open"
          );

        }
      );

    }
  );


  setTimeout(
    () => {

      scene.classList.remove(
        "is-opening"
      );


      opened =
        false;


      opening =
        false;


      gateButton.setAttribute(
        "aria-label",
        "點三下打開大門"
      );

  }, 1850);

}


/* =========================================================
   點擊
========================================================= */

function activateGate() {

  if (
    opened
  ) {

    closeGate();

    return;
  }


  if (
    opening
  ) {

    return;
  }


  /*
    手機提示
  */

  const touchDevice =
    window.matchMedia(
      "(hover:none)"
    ).matches;


  if (
    touchDevice
  ) {

    gateButton.classList.add(
      "touch-hint"
    );


    clearTimeout(
      hintTimer
    );


    hintTimer =
      setTimeout(
        () => {

          gateButton.classList.remove(
            "touch-hint"
          );

        },
        1500
      );

  }


  /*
    每一下都立即發出敲門聲。
  */

  knockSound();


  knocks++;


  clearTimeout(
    knockResetTimer
  );


  knockResetTimer =
    setTimeout(
      () => {

        knocks =
          0;

      },
      3000
    );


  if (
    knocks >= 3
  ) {

    openGate();

  }

}


/* =========================================================
   啟動
========================================================= */

gateButton.addEventListener(
  "click",
  activateGate
);


function updateLayout() {

  positionDoor();

  positionWater();

}


window.addEventListener(
  "load",
  () => {

    createPetals();

    updateLayout();

  }
);


window.addEventListener(
  "resize",
  updateLayout
);


window.addEventListener(
  "orientationchange",
  () => {

    setTimeout(
      updateLayout,
      180
    );

  }
);
