<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#24170e"
>

<title>ASD 蝸小宣的家｜HSUAN WORLD</title>


<style>

/* =========================================================
   基本
========================================================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: #21150e;

  font-family:
    "Noto Serif TC",
    "Songti TC",
    "PingFang TC",
    serif;
}


/* =========================================================
   主場景
========================================================= */

.scene {
  position: relative;

  width: 100vw;
  height: 100vh;
  height: 100dvh;

  overflow: hidden;

  background: #21150e;

  isolation: isolate;

  perspective: 2000px;
}


/* =========================================================
   固定首頁背景

   ★ 永遠不切換
   ★ 屋頂 / 牆 / 牌子 / 石燈 / 花園全部固定
========================================================= */

.scene-base {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;
  object-position: center;

  z-index: 0;

  pointer-events: none;
  user-select: none;
}


/* =========================================================
   永久門洞

   這一塊會直接蓋住 hsuan-gate.png 原本的舊門。
   所以舊門從視覺上完全不存在。
========================================================= */

.portal {
  position: absolute;

  left: 0;
  top: 0;

  width: 1px;
  height: 1px;

  z-index: 4;

  overflow: hidden;

  background:
    #26160c;

  pointer-events: none;

  box-shadow:
    inset 0 0 14px rgba(0,0,0,.38),
    inset 0 0 45px rgba(0,0,0,.18);
}


/* =========================================================
   門後庭院

   不要求與整張開門圖完全對齊。
   只取庭院內容填滿門洞。
========================================================= */

.portal-view {
  position: absolute;
  inset: -3%;

  width: 106%;
  height: 106%;

  object-fit: cover;

  /*
    稍微往中間庭院方向取景。
    之後如果你想看更多左邊或右邊，
    只改這一行。
  */

  object-position:
    50% 53%;

  transform:
    scale(1.025);

  transition:
    transform 2.4s ease;

  filter:
    brightness(.96)
    saturate(1.03);

  pointer-events: none;
}


.scene.is-open
.portal-view {

  transform:
    scale(1);
}


/* =========================================================
   門洞內部暗角

   讓它看起來是真的門框深度，
   而不是一張圖片貼在後面。
========================================================= */

.portal::after {
  content: "";

  position: absolute;
  inset: 0;

  pointer-events: none;

  z-index: 2;

  background:

    linear-gradient(
      to right,
      rgba(0,0,0,.18),
      transparent 8%,
      transparent 92%,
      rgba(0,0,0,.18)
    ),

    linear-gradient(
      to bottom,
      rgba(0,0,0,.20),
      transparent 12%,
      transparent 91%,
      rgba(0,0,0,.12)
    );
}


/* =========================================================
   3D 雙門舞台

   portal 和 doorStage 使用完全一樣的位置與尺寸。
========================================================= */

.door-stage {
  position: absolute;

  left: 0;
  top: 0;

  width: 1px;
  height: 1px;

  z-index: 12;

  perspective: 1750px;

  transform-style: preserve-3d;

  pointer-events: none;
}


/* =========================================================
   左右門
========================================================= */

.door-leaf {
  position: absolute;

  top: 0;

  width: 50%;
  height: 100%;

  transform-style: preserve-3d;

  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;

  will-change: transform;

  transition:
    transform 1.82s
    cubic-bezier(.20,.72,.15,1);
}


/* 左門 */

.door-left {
  left: 0;

  transform-origin:
    left center;

  transform:
    rotateY(0deg);
}


/* 右門 */

.door-right {
  right: 0;

  transform-origin:
    right center;

  transform:
    rotateY(0deg);
}


/* =========================================================
   新門圖片

   ★ 只使用新素材
========================================================= */

.door-image {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: fill;

  display: block;

  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;

  pointer-events: none;

  filter:
    drop-shadow(
      0 3px 5px
      rgba(0,0,0,.12)
    );
}


/* =========================================================
   木門厚度
========================================================= */

.door-edge {
  position: absolute;

  top: 1%;

  width: 11px;
  height: 98%;

  opacity: .9;

  background:
    linear-gradient(
      to right,
      #34180a 0%,
      #8b451b 48%,
      #3d1d0c 100%
    );

  pointer-events: none;
}


/* 左門的內側厚度 */

.door-left
.door-edge {

  right: -5px;

  transform:
    rotateY(90deg);

  transform-origin:
    left center;
}


/* 右門的內側厚度 */

.door-right
.door-edge {

  left: -5px;

  transform:
    rotateY(-90deg);

  transform-origin:
    right center;
}


/* =========================================================
   門開啟

   外側鉸鏈保持固定。

   不打到完全 90°，
   保留門片側面，會比較有厚重感。
========================================================= */

.scene.is-open
.door-left {

  transform:
    rotateY(-103deg);
}


.scene.is-open
.door-right {

  transform:
    rotateY(103deg);
}


/* =========================================================
   開門過程的陰影
========================================================= */

.door-left::after,
.door-right::after {

  content: "";

  position: absolute;
  inset: 0;

  opacity: 0;

  pointer-events: none;

  transition:
    opacity 1.3s ease;
}


.door-left::after {

  background:
    linear-gradient(
      to right,
      rgba(0,0,0,.02),
      rgba(0,0,0,.32)
    );
}


.door-right::after {

  background:
    linear-gradient(
      to left,
      rgba(0,0,0,.02),
      rgba(0,0,0,.32)
    );
}


.scene.is-open
.door-leaf::after {

  opacity: .72;
}


/* =========================================================
   中央門縫

   關門時遮住左右圖片可能產生的 1px 小縫。
========================================================= */

.center-seam {
  position: absolute;

  z-index: 13;

  left: calc(50% - 1px);
  top: 0;

  width: 2px;
  height: 100%;

  background:
    rgba(40,18,8,.72);

  pointer-events: none;

  transition:
    opacity .18s ease;
}


.scene.is-open
.center-seam {

  opacity: 0;
}


/* =========================================================
   飄落櫻花瓣
========================================================= */

.petals {
  position: absolute;
  inset: 0;

  z-index: 28;

  overflow: hidden;

  pointer-events: none;
}


.petal {
  position: absolute;

  top: -12vh;

  width:
    var(--size);

  height:
    calc(var(--size) * 1.4);

  border-radius:
    80% 18% 76% 22%;

  opacity:
    var(--opacity);

  background:
    radial-gradient(
      ellipse at 30% 25%,
      rgba(255,255,255,.98),
      rgba(255,228,237,.96) 42%,
      rgba(244,170,194,.9) 100%
    );

  box-shadow:
    0 0 4px
    rgba(255,220,230,.30);

  animation:
    petalFall
    var(--duration)
    linear
    var(--delay)
    infinite;

  will-change:
    transform,
    opacity;
}


@keyframes petalFall {

  0% {

    opacity: 0;

    transform:
      translate3d(
        0,
        -10vh,
        0
      )
      rotate(0deg);
  }


  10% {

    opacity:
      var(--opacity);
  }


  45% {

    transform:
      translate3d(
        var(--middle),
        50vh,
        0
      )
      rotate(140deg);
  }


  100% {

    opacity: 0;

    transform:
      translate3d(
        var(--end),
        113vh,
        0
      )
      rotate(330deg);
  }

}


/* =========================================================
   動態水盆
========================================================= */

.water-basin {
  position: absolute;

  left: 0;
  top: 0;

  width: 1px;
  height: 1px;

  z-index: 30;

  pointer-events: none;

  object-fit: fill;

  -webkit-mask-image:
    radial-gradient(
      ellipse 76% 76%
      at 63% 53%,

      #000 52%,
      rgba(0,0,0,.98) 68%,
      rgba(0,0,0,.72) 82%,
      rgba(0,0,0,.28) 92%,
      transparent 100%
    );

  mask-image:
    radial-gradient(
      ellipse 76% 76%
      at 63% 53%,

      #000 52%,
      rgba(0,0,0,.98) 68%,
      rgba(0,0,0,.72) 82%,
      rgba(0,0,0,.28) 92%,
      transparent 100%
    );
}


/* =========================================================
   點門區
========================================================= */

.gate-button {
  position: absolute;

  z-index: 60;

  left: 29%;
  top: 20%;

  width: 42%;
  height: 63%;

  padding: 0;

  border: 0;

  background: transparent;

  cursor: pointer;

  touch-action:
    manipulation;

  -webkit-tap-highlight-color:
    transparent;
}


/* 開門後整個入口點一下即可關 */

.scene.is-open
.gate-button {

  left: 0;
  top: 0;

  width: 100%;
  height: 100%;
}


/* =========================================================
   點三下提示
========================================================= */

.hint {
  position: absolute;

  left: 50%;
  top: 49%;

  transform:
    translate(-50%,-50%);

  opacity: 0;

  white-space: nowrap;

  pointer-events: none;

  color:
    #fff4d8;

  font-size:
    clamp(
      16px,
      1.65vw,
      27px
    );

  letter-spacing:
    .12em;

  text-shadow:
    0 2px 7px #261208,
    0 4px 17px rgba(20,8,3,.88);

  transition:
    opacity .28s ease;
}


@media
(hover:hover)
and
(pointer:fine) {

  .scene:not(.is-open)
  .gate-button:hover
  .hint {

    opacity: 1;
  }

}


.gate-button.touch-hint
.hint {

  opacity: 1;
}


/* =========================================================
   歡迎區
========================================================= */

.welcome-stage {
  position: absolute;

  z-index: 48;

  left: 22%;
  top: 28%;

  width: 56%;
  height: 31%;

  overflow: hidden;

  pointer-events: none;
}


.welcome-track {
  position: absolute;

  left: 0;
  top: 50%;

  width: 100%;

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 13px;

  visibility: hidden;

  opacity: 0;

  transform:
    translate(105%,-50%);
}


.welcome-track.running {

  visibility: visible;

  opacity: 1;

  animation:
    snailMove
    18s
    linear
    both;
}


@keyframes snailMove {

  0% {

    transform:
      translate(105%,-50%);
  }


  28% {

    transform:
      translate(8%,-50%);
  }


  70% {

    transform:
      translate(-4%,-50%);
  }


  100% {

    transform:
      translate(-108%,-50%);
  }

}


/* =========================================================
   蝸小宣
========================================================= */

.snail {
  width:
    clamp(
      52px,
      5.7vw,
      90px
    );

  height: auto;

  flex: none;

  filter:
    drop-shadow(
      0 3px 8px
      rgba(32,14,5,.45)
    );
}


/* =========================================================
   歡迎文字
========================================================= */

.message-box {
  display: flex;

  flex-direction: column;

  align-items: flex-start;
}


.message {
  margin: 0;

  opacity: 0;

  white-space: nowrap;

  color:
    #fff0c5;

  filter:
    blur(15px);

  text-shadow:
    0 2px 4px #2d1608,
    0 4px 16px #1a0b04,
    0 0 20px rgba(220,161,79,.94);
}


.message.zh {

  font-size:
    clamp(
      16px,
      1.8vw,
      29px
    );
}


.message.en {

  margin-top: 4px;

  font-family:
    Baskerville,
    Georgia,
    serif;

  font-style:
    italic;

  font-size:
    clamp(
      13px,
      1.2vw,
      20px
    );
}


.message.reveal {

  animation:
    mist
    5.3s
    ease-in-out
    both;
}


@keyframes mist {

  0% {

    opacity: 0;

    filter:
      blur(15px);
  }


  18% {

    opacity: 1;

    filter:
      blur(0);
  }


  66% {

    opacity: 1;

    filter:
      blur(0);
  }


  100% {

    opacity: 0;

    filter:
      blur(10px);
  }

}


/* =========================================================
   手機
========================================================= */

@media
(max-width:768px) {

  .gate-button {

    left: 18%;
    top: 18%;

    width: 64%;
    height: 65%;
  }


  .welcome-stage {

    left: 10%;

    width: 80%;
  }


  .snail {

    width:
      clamp(
        40px,
        11vw,
        62px
      );
  }


  .message.zh {

    font-size:
      clamp(
        12px,
        3vw,
        19px
      );

    white-space: normal;
  }


  .message.en {

    font-size:
      clamp(
        10px,
        2.4vw,
        15px
      );

    white-space: normal;
  }

}

</style>

</head>


<body>


<main
  class="scene"
  id="scene"
  aria-label="ASD 蝸小宣的家入口"
>


  <!-- =====================================================
       固定首頁背景
  ====================================================== -->

  <img
    class="scene-base"
    src="hsuan-gate.png"
    alt="ASD 蝸小宣的家"
    draggable="false"
  >


  <!-- =====================================================
       永久門洞

       這個會直接蓋住背景裡舊的門。
  ====================================================== -->

  <div
    class="portal"
    id="portal"
    aria-hidden="true"
  >

    <img
      class="portal-view"
      src="hsuan-gate-open.png"
      alt=""
      draggable="false"
    >

  </div>


  <!-- =====================================================
       新 3D 左右門
  ====================================================== -->

  <div
    class="door-stage"
    id="doorStage"
    aria-hidden="true"
  >


    <!-- 左門 -->

    <div
      class="door-leaf door-left"
    >

      <img
        class="door-image"
        src="hsuan-door-left.png"
        alt=""
        draggable="false"
      >

      <div
        class="door-edge"
      ></div>

    </div>


    <!-- 右門 -->

    <div
      class="door-leaf door-right"
    >

      <img
        class="door-image"
        src="hsuan-door-right.png"
        alt=""
        draggable="false"
      >

      <div
        class="door-edge"
      ></div>

    </div>


    <!-- 中央小縫 -->

    <div
      class="center-seam"
    ></div>


  </div>


  <!-- =====================================================
       飄落櫻花瓣
  ====================================================== -->

  <div
    class="petals"
    id="petals"
    aria-hidden="true"
  ></div>


  <!-- =====================================================
       流水
  ====================================================== -->

  <img
    class="water-basin"
    id="waterBasin"
    src="hsuan-water-basin.webp"
    alt=""
    aria-hidden="true"
  >


  <!-- =====================================================
       點門
  ====================================================== -->

  <button
    class="gate-button"
    id="gateButton"
    type="button"
    aria-label="點三下打開大門"
  >

    <span
      class="hint"
    >
      點三下打開大門
    </span>

  </button>


  <!-- =====================================================
       歡迎動畫
  ====================================================== -->

  <div
    class="welcome-stage"
    aria-hidden="true"
  >

    <div
      class="welcome-track"
      id="welcomeTrack"
    >

      <img
        class="snail"
        src="hsuan-snail.png"
        alt=""
        draggable="false"
        onerror="this.style.display='none'"
      >


      <div
        class="message-box"
      >

        <p
          class="message zh"
          id="zh"
        >
          歡迎來到 ASD 蝸小宣的家
        </p>


        <p
          class="message en"
          id="en"
        >
          WELCOME TO HSUAN WORLD
        </p>

      </div>

    </div>

  </div>


</main>


<script>

/* =========================================================
   元件
========================================================= */

const scene =
  document.getElementById(
    "scene"
  );


const portal =
  document.getElementById(
    "portal"
  );


const doorStage =
  document.getElementById(
    "doorStage"
  );


const waterBasin =
  document.getElementById(
    "waterBasin"
  );


const gateButton =
  document.getElementById(
    "gateButton"
  );


const petals =
  document.getElementById(
    "petals"
  );


const welcomeTrack =
  document.getElementById(
    "welcomeTrack"
  );


const zh =
  document.getElementById(
    "zh"
  );


const en =
  document.getElementById(
    "en"
  );


/* =========================================================
   狀態
========================================================= */

let opened =
  false;


let moving =
  false;


let knocks =
  0;


let resetTimer =
  null;


let hintTimer =
  null;


let welcomeTimers =
  [];


/* =========================================================
   固定關門背景尺寸

   hsuan-gate.png
   1536 × 864
========================================================= */

const SOURCE_W =
  1536;


const SOURCE_H =
  864;


/* =========================================================
   ★ 整個門洞只有這一組座標

   portal + 左門 + 右門全部共用。

   以後真的還差一點，
   只調這四個數字。
========================================================= */

const DOOR_AREA = {

  x: 467,

  y: 218,

  width: 604,

  height: 496

};


/* =========================================================
   水盆
========================================================= */

const WATER_AREA = {

  x: 1200,

  y: 565,

  width: 336,

  height: 260

};


/* =========================================================
   cover 座標換算

   因為首頁背景使用 object-fit: cover。
========================================================= */

function getCoverInfo() {

  const viewW =
    scene.clientWidth;


  const viewH =
    scene.clientHeight;


  const scale =
    Math.max(

      viewW / SOURCE_W,

      viewH / SOURCE_H

    );


  const imageW =
    SOURCE_W *
    scale;


  const imageH =
    SOURCE_H *
    scale;


  return {

    scale,

    imageW,

    imageH,

    offsetX:
      (
        viewW -
        imageW
      ) / 2,

    offsetY:
      (
        viewH -
        imageH
      ) / 2

  };

}


/* =========================================================
   門洞 + 3D 門

   永遠完全共用同一矩形。
========================================================= */

function positionDoorSystem() {

  const c =
    getCoverInfo();


  const left =
    c.offsetX +
    DOOR_AREA.x *
    c.scale;


  const top =
    c.offsetY +
    DOOR_AREA.y *
    c.scale;


  const width =
    DOOR_AREA.width *
    c.scale;


  const height =
    DOOR_AREA.height *
    c.scale;


  /*
    門洞
  */

  portal.style.left =
    left + "px";


  portal.style.top =
    top + "px";


  portal.style.width =
    width + "px";


  portal.style.height =
    height + "px";


  /*
    3D 門
  */

  doorStage.style.left =
    left + "px";


  doorStage.style.top =
    top + "px";


  doorStage.style.width =
    width + "px";


  doorStage.style.height =
    height + "px";

}


/* =========================================================
   水盆定位
========================================================= */

function positionWater() {

  const c =
    getCoverInfo();


  waterBasin.style.left =
    (
      c.offsetX +
      WATER_AREA.x *
      c.scale
    )
    + "px";


  waterBasin.style.top =
    (
      c.offsetY +
      WATER_AREA.y *
      c.scale
    )
    + "px";


  waterBasin.style.width =
    (
      WATER_AREA.width *
      c.scale
    )
    + "px";


  waterBasin.style.height =
    (
      WATER_AREA.height *
      c.scale
    )
    + "px";

}


/* =========================================================
   花瓣
========================================================= */

function createPetals() {

  if (
    petals.dataset.ready
  ) {

    return;
  }


  petals.dataset.ready =
    "true";


  for (
    let i = 0;
    i < 14;
    i++
  ) {

    const petal =
      document.createElement(
        "span"
      );


    petal.className =
      "petal";


    const leftSide =
      Math.random() <
      .65;


    petal.style.left =
      (
        leftSide

        ? Math.random() * 30

        : 70 +
          Math.random() * 27
      )
      +
      "%";


    petal.style.setProperty(

      "--size",

      (
        5 +
        Math.random() *
        6
      )
      .toFixed(1)
      +
      "px"

    );


    petal.style.setProperty(

      "--opacity",

      (
        .46 +
        Math.random() *
        .32
      )
      .toFixed(2)

    );


    petal.style.setProperty(

      "--duration",

      (
        12 +
        Math.random() *
        10
      )
      .toFixed(1)
      +
      "s"

    );


    petal.style.setProperty(

      "--delay",

      (
        -Math.random() *
        22
      )
      .toFixed(1)
      +
      "s"

    );


    petal.style.setProperty(

      "--middle",

      (
        -30 +
        Math.random() *
        70
      )
      .toFixed(0)
      +
      "px"

    );


    petal.style.setProperty(

      "--end",

      (
        -80 +
        Math.random() *
        170
      )
      .toFixed(0)
      +
      "px"

    );


    petals.appendChild(
      petal
    );

  }

}


/* =========================================================
   敲門聲
========================================================= */

let audioContext =
  null;


function getAudioContext() {

  const AudioContextClass =
    window.AudioContext ||
    window.webkitAudioContext;


  if (
    !AudioContextClass
  ) {

    return null;
  }


  if (
    !audioContext
  ) {

    audioContext =
      new AudioContextClass();
  }


  if (
    audioContext.state ===
    "suspended"
  ) {

    audioContext.resume();
  }


  return audioContext;

}


function knockSound() {

  const ctx =
    getAudioContext();


  if (
    !ctx
  ) {

    return;
  }


  const now =
    ctx.currentTime;


  const osc =
    ctx.createOscillator();


  const gain =
    ctx.createGain();


  osc.type =
    "triangle";


  osc.frequency.setValueAtTime(
    118,
    now
  );


  osc.frequency.exponentialRampToValueAtTime(
    65,
    now + .085
  );


  gain.gain.setValueAtTime(
    .0001,
    now
  );


  gain.gain.exponentialRampToValueAtTime(
    .065,
    now + .008
  );


  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now + .12
  );


  osc.connect(
    gain
  );


  gain.connect(
    ctx.destination
  );


  osc.start(
    now
  );


  osc.stop(
    now + .13
  );

}


/* =========================================================
   歡迎動畫
========================================================= */

function clearWelcome() {

  welcomeTimers.forEach(
    timer =>
      clearTimeout(
        timer
      )
  );


  welcomeTimers =
    [];


  welcomeTrack.classList.remove(
    "running"
  );


  zh.classList.remove(
    "reveal"
  );


  en.classList.remove(
    "reveal"
  );


  void welcomeTrack.offsetWidth;

}


function later(
  fn,
  delay
) {

  welcomeTimers.push(

    setTimeout(
      fn,
      delay
    )

  );

}


/* =========================================================
   開門
========================================================= */

function openGate() {

  if (
    moving ||
    opened
  ) {

    return;
  }


  moving =
    true;


  knocks =
    0;


  clearTimeout(
    resetTimer
  );


  clearTimeout(
    hintTimer
  );


  gateButton.classList.remove(
    "touch-hint"
  );


  /*
    第三下敲門後停 0.4 秒。
  */

  setTimeout(
    () => {

      scene.classList.add(
        "is-open"
      );

    },
    400
  );


  /*
    1.82 秒門片動畫完成。
  */

  setTimeout(
    () => {

      moving =
        false;


      opened =
        true;


      gateButton.setAttribute(
        "aria-label",
        "點一下關上大門"
      );

    },
    2300
  );


  clearWelcome();


  later(
    () => {

      welcomeTrack.classList.add(
        "running"
      );

    },
    2500
  );


  /*
    中文先出現
  */

  later(
    () => {

      zh.classList.add(
        "reveal"
      );

    },
    4700
  );


  /*
    中文完成後英文
  */

  later(
    () => {

      en.classList.add(
        "reveal"
      );

    },
    10100
  );

}


/* =========================================================
   關門
========================================================= */

function closeGate() {

  if (
    moving ||
    !opened
  ) {

    return;
  }


  moving =
    true;


  clearWelcome();


  scene.classList.remove(
    "is-open"
  );


  setTimeout(
    () => {

      opened =
        false;


      moving =
        false;


      gateButton.setAttribute(
        "aria-label",
        "點三下打開大門"
      );

    },
    1900
  );

}


/* =========================================================
   點擊
========================================================= */

function activateGate() {

  if (
    opened
  ) {

    closeGate();

    return;
  }


  if (
    moving
  ) {

    return;
  }


  /*
    觸控裝置
  */

  if (
    window.matchMedia(
      "(hover:none)"
    )
    .matches
  ) {

    gateButton.classList.add(
      "touch-hint"
    );


    clearTimeout(
      hintTimer
    );


    hintTimer =
      setTimeout(
        () => {

          gateButton.classList.remove(
            "touch-hint"
          );

        },
        1500
      );

  }


  /*
    聲音完全按照使用者點擊節奏。
  */

  knockSound();


  knocks++;


  clearTimeout(
    resetTimer
  );


  resetTimer =
    setTimeout(
      () => {

        knocks =
          0;

      },
      3000
    );


  if (
    knocks >= 3
  ) {

    openGate();

  }

}


/* =========================================================
   啟動
========================================================= */

gateButton.addEventListener(
  "click",
  activateGate
);


function updateLayout() {

  positionDoorSystem();

  positionWater();

}


window.addEventListener(
  "load",
  () => {

    createPetals();

    updateLayout();

  }
);


window.addEventListener(
  "resize",
  updateLayout
);


window.addEventListener(
  "orientationchange",
  () => {

    setTimeout(
      updateLayout,
      180
    );

  }
);
