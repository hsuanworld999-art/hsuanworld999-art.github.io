<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASD 蝸小宣｜HSUAN WORLD</title>

<style>
/* =========================================
   HSUAN WORLD — 大門 3D 版
========================================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111;
}

body {
  font-family:
    "Songti TC",
    "Noto Serif TC",
    "PMingLiU",
    serif;
}

/* =========================================
   整個場景
========================================= */

.gate-scene {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;

  background-image: url("hsuan-gate-open.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  perspective: 1800px;

  -webkit-tap-highlight-color: transparent;
}

/* =========================================
   開門庭院
========================================= */

.open-world {
  position: absolute;
  inset: 0;

  background-image: url("hsuan-gate-open.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  z-index: 1;

  transform: scale(1.002);
}

/* =========================================
   關門完整圖
   只在初始化時顯示

   動畫開始前會消失，
   不再遮住左右門。
========================================= */

.closed-reference {
  position: absolute;
  inset: 0;

  background-image: url("hsuan-gate.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  z-index: 5;

  opacity: 1;
  pointer-events: none;

  transition: opacity 0.12s linear;
}

.gate-scene.door-ready .closed-reference {
  opacity: 0;
}

/* =========================================
   左右門所在區域
========================================= */

.door-stage {
  position: absolute;

  /*
    這四個數字是門的位置校正區。
    如果門沒有完全對準，
    之後只需要調這四個。
  */

  left: 31.1%;
  top: 23.6%;

  width: 37.8%;
  height: 53.8%;

  z-index: 10;

  perspective: 1200px;

  transform-style: preserve-3d;

  pointer-events: none;
}

/* =========================================
   門扇共同設定
========================================= */

.door {
  position: absolute;
  top: 0;

  width: 50%;
  height: 100%;

  background-repeat: no-repeat;
  background-size: 100% 100%;

  transform-style: preserve-3d;

  backface-visibility: visible;
  -webkit-backface-visibility: visible;

  will-change: transform, filter;

  transition:
    transform 2.8s cubic-bezier(
      0.20,
      0.72,
      0.18,
      1
    ),
    filter 2.8s ease;
}

/* =========================================
   左門
========================================= */

.left-door {
  left: 0;

  background-image:
    url("hsuan-gate-left.png");

  transform-origin:
    left center;

  transform:
    perspective(1200px)
    rotateY(0deg);

  filter:
    drop-shadow(
      0 5px 5px rgba(0,0,0,0.12)
    );
}

/* =========================================
   右門
========================================= */

.right-door {
  right: 0;

  background-image:
    url("hsuan-gate-right.png");

  transform-origin:
    right center;

  transform:
    perspective(1200px)
    rotateY(0deg);

  filter:
    drop-shadow(
      0 5px 5px rgba(0,0,0,0.12)
    );
}

/* =========================================
   開門！

   左門向內轉
   右門向內轉
========================================= */

.gate-scene.opening .left-door,
.gate-scene.open .left-door {
  transform:
    perspective(1200px)
    rotateY(84deg);

  filter:
    drop-shadow(
      18px 10px 12px
      rgba(0,0,0,0.38)
    );
}

.gate-scene.opening .right-door,
.gate-scene.open .right-door {
  transform:
    perspective(1200px)
    rotateY(-84deg);

  filter:
    drop-shadow(
      -18px 10px 12px
      rgba(0,0,0,0.38)
    );
}

/* =========================================
   門中央陰影

   門剛開始打開時，
   中央先出現較深的縫。
========================================= */

.center-shadow {
  position: absolute;

  left: 49.5%;
  top: 0;

  width: 1%;
  height: 100%;

  z-index: 9;

  background:
    linear-gradient(
      to right,
      rgba(0,0,0,0),
      rgba(0,0,0,0.62),
      rgba(0,0,0,0)
    );

  opacity: 0;

  pointer-events: none;

  transition:
    opacity 0.5s ease,
    width 1.4s ease,
    left 1.4s ease;
}

.gate-scene.opening .center-shadow {
  opacity: 0.75;
  width: 5%;
  left: 47.5%;
}

.gate-scene.open .center-shadow {
  opacity: 0;
}

/* =========================================
   敲門區
========================================= */

.knock-zone {
  position: absolute;

  left: 32%;
  top: 24%;

  width: 36%;
  height: 54%;

  z-index: 30;

  cursor: pointer;

  user-select: none;
  touch-action: manipulation;

  -webkit-tap-highlight-color: transparent;
}

/* 開門後不准繼續敲 */

.gate-scene.opening .knock-zone,
.gate-scene.open .knock-zone,
.gate-scene.closing .knock-zone {
  pointer-events: none;
}

/* =========================================
   點三下提示
========================================= */

.knock-hint {
  position: absolute;

  left: 50%;
  top: 46%;

  transform:
    translate(-50%, -50%);

  width: 90%;

  text-align: center;
  white-space: nowrap;

  color:
    rgba(255,248,226,0.98);

  font-family:
    "Songti TC",
    "Noto Serif TC",
    "PMingLiU",
    serif;

  font-size:
    clamp(17px, 1.5vw, 25px);

  font-weight: 600;

  letter-spacing: 0.18em;

  text-shadow:
    0 2px 5px rgba(0,0,0,0.95),
    0 0 14px rgba(255,204,118,0.45);

  opacity: 0;

  pointer-events: none;

  transition:
    opacity 0.3s ease;
}

@media (hover:hover) and (pointer:fine) {
  .gate-scene.closed
  .knock-zone:hover
  .knock-hint {
    opacity: 1;
  }
}

.knock-hint.touch-show {
  opacity: 1;
}

/* =========================================
   關門區

   門完全打開後，
   整個入口畫面都能按一下關門。
========================================= */

.close-zone {
  position: absolute;
  inset: 0;

  z-index: 20;

  display: none;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}

.gate-scene.open .close-zone {
  display: block;
}

/* =========================================
   關門提示
========================================= */

.close-hint {
  position: absolute;

  left: 50%;
  top: 82%;

  transform:
    translate(-50%, -50%);

  padding:
    8px 17px;

  border-radius: 30px;

  background:
    rgba(20,14,10,0.34);

  color:
    rgba(255,248,230,0.90);

  font-family:
    "Songti TC",
    "Noto Serif TC",
    serif;

  font-size:
    clamp(13px, 1vw, 17px);

  letter-spacing: 0.12em;

  opacity: 0;

  pointer-events: none;

  transition:
    opacity 0.3s ease;

  backdrop-filter: blur(3px);
}

@media (hover:hover) and (pointer:fine) {
  .close-zone:hover .close-hint {
    opacity: 0.82;
  }
}

/* =========================================
   歡迎詞
========================================= */

.welcome {
  position: absolute;

  left: 50%;
  top: 46%;

  /*
    不讓字跑出雙門範圍
  */

  width:
    min(
      35vw,
      560px
    );

  text-align: center;

  color:
    #fff7df;

  z-index: 40;

  opacity: 0;

  pointer-events: none;

  text-shadow:
    0 3px 8px rgba(0,0,0,0.85),
    0 0 20px rgba(255,200,110,0.38);
}

/* 中文藝術感 */

.welcome-cn {
  font-family:
    "Songti TC",
    "Noto Serif TC",
    "PMingLiU",
    serif;

  font-size:
    clamp(21px, 2vw, 34px);

  font-weight: 600;

  letter-spacing: 0.13em;
}

/* 英文藝術感 */

.welcome-en {
  font-family:
    "Baskerville",
    "Times New Roman",
    Georgia,
    serif;

  font-size:
    clamp(21px, 2.1vw, 36px);

  font-style: italic;

  letter-spacing: 0.09em;
}

/* =========================================
   歡迎詞：
   從下方跳起來
========================================= */

.welcome.jump-in {
  animation:
    welcomeJump
    0.82s
    cubic-bezier(
      0.18,
      0.88,
      0.32,
      1.22
    )
    forwards;
}

@keyframes welcomeJump {

  0% {
    opacity: 0;

    transform:
      translate(-50%, 22px)
      scale(0.76);
  }

  48% {
    opacity: 1;

    transform:
      translate(-50%, -58%)
      scale(1.10);
  }

  68% {
    transform:
      translate(-50%, -46%)
      scale(0.97);
  }

  84% {
    transform:
      translate(-50%, -52%)
      scale(1.025);
  }

  100% {
    opacity: 1;

    transform:
      translate(-50%, -50%)
      scale(1);
  }
}

/* =========================================
   歡迎詞淡出
========================================= */

.welcome.fade-out {
  animation:
    welcomeOut
    0.9s
    ease
    forwards;
}

@keyframes welcomeOut {

  from {
    opacity: 1;

    transform:
      translate(-50%, -50%)
      scale(1);
  }

  to {
    opacity: 0;

    transform:
      translate(-50%, -62%)
      scale(1.035);
  }
}

/* =========================================
   手機 / iPad
========================================= */

@media (max-width:900px) {

  .door-stage {
    left: 24%;
    top: 24%;

    width: 52%;
    height: 52%;
  }

  .knock-zone {
    left: 25%;
    top: 24%;

    width: 50%;
    height: 53%;
  }

  .welcome {
    width: 72vw;
  }

  .welcome-cn {
    font-size:
      clamp(19px,4.4vw,28px);
  }

  .welcome-en {
    font-size:
      clamp(18px,4.2vw,27px);
  }

  .knock-hint {
    font-size:
      clamp(15px,4vw,21px);

    letter-spacing: 0.1em;
  }
}

/* =========================================
   減少動畫偏好
========================================= */

@media (prefers-reduced-motion: reduce) {

  .door {
    transition-duration: 0.7s;
  }

  .welcome.jump-in {
    animation:
      simpleWelcome
      0.4s ease forwards;
  }

  @keyframes simpleWelcome {

    from {
      opacity: 0;
      transform:
        translate(-50%,-50%);
    }

    to {
      opacity: 1;
      transform:
        translate(-50%,-50%);
    }
  }
}

</style>
</head>

<body>

<div
  id="gateScene"
  class="gate-scene closed"
>

  <!-- 門後真正的庭院 -->

  <div class="open-world"></div>


  <!-- 左右門 -->

  <div class="door-stage">

    <div
      class="center-shadow"
    ></div>

    <div
      class="door left-door"
    ></div>

    <div
      class="door right-door"
    ></div>

  </div>


  <!--
    初始完整關門圖
    開門前才存在
  -->

  <div
    class="closed-reference"
  ></div>


  <!-- 敲門 -->

  <div
    id="knockZone"
    class="knock-zone"
    role="button"
    tabindex="0"
    aria-label="點三下打開大門"
  >

    <div
      id="knockHint"
      class="knock-hint"
    >
      點三下打開大門
    </div>

  </div>


  <!-- 關門 -->

  <div
    id="closeZone"
    class="close-zone"
    role="button"
    tabindex="0"
    aria-label="關閉大門"
  >

    <div class="close-hint">
      點一下關閉大門
    </div>

  </div>


  <!-- 歡迎詞 -->

  <div
    id="welcomeCN"
    class="welcome welcome-cn"
  >
    歡迎來到 ASD 蝸小宣的家
  </div>

  <div
    id="welcomeEN"
    class="welcome welcome-en"
  >
    WELCOME TO HSUAN WORLD
  </div>


  <!--
    音效檔日後直接上傳即可：
    knock.mp3
    door-open.mp3
    door-close.mp3
  -->

  <audio
    id="knockSound"
    src="knock.mp3"
    preload="auto"
  ></audio>

  <audio
    id="doorOpenSound"
    src="door-open.mp3"
    preload="auto"
  ></audio>

  <audio
    id="doorCloseSound"
    src="door-close.mp3"
    preload="auto"
  ></audio>

</div>


<script>

/* =========================================
   元件
========================================= */

const scene =
  document.getElementById("gateScene");

const knockZone =
  document.getElementById("knockZone");

const knockHint =
  document.getElementById("knockHint");

const closeZone =
  document.getElementById("closeZone");

const welcomeCN =
  document.getElementById("welcomeCN");

const welcomeEN =
  document.getElementById("welcomeEN");

const knockSound =
  document.getElementById("knockSound");

const doorOpenSound =
  document.getElementById("doorOpenSound");

const doorCloseSound =
  document.getElementById("doorCloseSound");


/* =========================================
   狀態
========================================= */

let gateState = "closed";

let knockCount = 0;

let knockTimer = null;

let touchTimer = null;

let welcomeTimers = [];


/* =========================================
   播放音效
========================================= */

function playSound(audio, volume = 0.7) {

  try {

    const sound =
      audio.cloneNode(true);

    sound.volume = volume;

    sound.play()
      .catch(() => {});

  }

  catch (e) {}
}


/* =========================================
   清除歡迎詞
========================================= */

function clearWelcome() {

  welcomeTimers.forEach(
    timer => clearTimeout(timer)
  );

  welcomeTimers = [];

  welcomeCN.classList.remove(
    "jump-in",
    "fade-out"
  );

  welcomeEN.classList.remove(
    "jump-in",
    "fade-out"
  );
}


/* =========================================
   單句歡迎動畫
========================================= */

function animateWelcome(
  element,
  delay
) {

  welcomeTimers.push(

    setTimeout(() => {

      element.classList.remove(
        "fade-out"
      );

      /*
        強迫瀏覽器重新開始動畫
      */

      void element.offsetWidth;

      element.classList.add(
        "jump-in"
      );

    }, delay)

  );


  welcomeTimers.push(

    setTimeout(() => {

      element.classList.remove(
        "jump-in"
      );

      void element.offsetWidth;

      element.classList.add(
        "fade-out"
      );

    }, delay + 2350)

  );


  welcomeTimers.push(

    setTimeout(() => {

      element.classList.remove(
        "fade-out"
      );

    }, delay + 3300)

  );
}


/* =========================================
   完整歡迎流程
========================================= */

function runWelcome() {

  clearWelcome();

  animateWelcome(
    welcomeCN,
    350
  );

  animateWelcome(
    welcomeEN,
    3850
  );
}


/* =========================================
   正式開門
========================================= */

function openGate() {

  if (gateState !== "waiting") {
    return;
  }

  gateState = "opening";

  knockHint.classList.remove(
    "touch-show"
  );


  /*
    重要：
    先讓獨立左右門接管畫面。
  */

  scene.classList.add(
    "door-ready"
  );


  /*
    等兩個畫面更新週期，
    確保瀏覽器真的先畫出
    關閉狀態的左右門。
  */

  requestAnimationFrame(() => {

    requestAnimationFrame(() => {

      playSound(
        doorOpenSound,
        0.55
      );

      scene.classList.remove(
        "closed"
      );

      scene.classList.add(
        "opening"
      );

    });

  });


  /*
    2.8 秒後門完全打開
  */

  setTimeout(() => {

    scene.classList.remove(
      "opening"
    );

    scene.classList.add(
      "open"
    );

    gateState = "open";

    runWelcome();

  }, 2900);
}


/* =========================================
   關門
========================================= */

function closeGate() {

  if (gateState !== "open") {
    return;
  }

  gateState = "closing";

  clearWelcome();

  playSound(
    doorCloseSound,
    0.55
  );


  /*
    先把 open 換成 closing。
    門會從 84° 回到 0°。
  */

  scene.classList.remove(
    "open"
  );

  scene.classList.add(
    "closing"
  );


  /*
    closing 沒有 rotateY 規則，
    所以門會自動回到 0°。
  */

  setTimeout(() => {

    scene.classList.remove(
      "closing"
    );

    /*
      左右門已經完全合起來，
      再讓完整原始門圖回來。
    */

    scene.classList.remove(
      "door-ready"
    );

    scene.classList.add(
      "closed"
    );

    gateState = "closed";

    knockCount = 0;

  }, 2900);
}


/* =========================================
   敲門
========================================= */

function knock() {

  if (gateState !== "closed") {
    return;
  }


  /*
    一下就是一個聲音。
    不做任何畫面震動。
  */

  playSound(
    knockSound,
    0.75
  );


  knockCount++;


  /*
    三秒沒完成三下，
    重新計算。
  */

  clearTimeout(
    knockTimer
  );

  knockTimer =
    setTimeout(() => {

      knockCount = 0;

    }, 3000);


  /*
    第三下
  */

  if (knockCount >= 3) {

    clearTimeout(
      knockTimer
    );

    knockCount = 0;

    gateState = "waiting";


    /*
      第三聲之後
      停 0.4 秒再開。
    */

    setTimeout(
      openGate,
      400
    );
  }
}


/* =========================================
   手機第一次觸碰提示
========================================= */

function showTouchHint() {

  const touchDevice =
    window.matchMedia(
      "(hover: none)"
    ).matches;

  if (!touchDevice) {
    return;
  }

  knockHint.classList.add(
    "touch-show"
  );

  clearTimeout(
    touchTimer
  );

  touchTimer =
    setTimeout(() => {

      knockHint.classList.remove(
        "touch-show"
      );

    }, 1800);
}


/* =========================================
   滑鼠 / 觸控敲門
========================================= */

knockZone.addEventListener(
  "click",
  () => {

    if (gateState !== "closed") {
      return;
    }

    showTouchHint();

    knock();
  }
);


/* =========================================
   鍵盤敲門
========================================= */

knockZone.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" ||
      event.key === " "
    ) {

      event.preventDefault();

      knock();
    }
  }
);


/* =========================================
   點一下關門
========================================= */

closeZone.addEventListener(
  "click",
  event => {

    event.stopPropagation();

    closeGate();
  }
);


/* =========================================
   鍵盤關門
========================================= */

closeZone.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" ||
      event.key === " "
    ) {

      event.preventDefault();

      closeGate();
    }
  }
);


/* =========================================
   預載動畫素材
========================================= */

window.addEventListener(
  "load",
  () => {

    [
      "hsuan-gate-open.png",
      "hsuan-gate-left.png",
      "hsuan-gate-right.png"
    ]
    .forEach(source => {

      const image = new Image();

      image.src = source;
    });

  }
);

</script>

</body>
</html>
