<!DOCTYPE html>
<html lang="zh-Hant">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>ASD 蝸小宣的家｜HSUAN WORLD</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: #24170e;

  font-family:
    "Noto Serif TC",
    "Songti TC",
    "PMingLiU",
    serif;
}


/* =========================================================
   主場景
========================================================= */

.scene {
  position: relative;

  width: 100%;
  height: 100vh;
  height: 100dvh;

  overflow: hidden;

  isolation: isolate;

  background: #24170e;

  perspective: 1800px;
}


/* =========================================================
   背景
========================================================= */

.background {
  position: absolute;
  inset: 0;

  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;

  pointer-events: none;
}


.closed-background {
  z-index: 0;

  background-image:
    url("hsuan-gate.png");

  opacity: 1;

  transition:
    opacity .35s ease;
}


.open-background {
  z-index: 1;

  background-image:
    url("hsuan-gate-open.png");

  opacity: 0;

  transform:
    scale(1.018);

  transition:
    opacity 1.05s ease,
    transform 2.2s ease;
}


.scene.opening
.open-background,

.scene.is-open
.open-background {
  opacity: 1;

  transform:
    scale(1);
}


/*
  打開過程中，
  原本整張關門圖不立刻消失。
*/

.scene.is-open
.closed-background {
  opacity: 0;
}


/* =========================================================
   3D 大門區
========================================================= */

.door-stage {
  position: absolute;

  z-index: 20;

  pointer-events: none;

  transform-style:
    preserve-3d;

  perspective: 1600px;

  opacity: 0;
}


/*
  開始敲門後才把 3D 門片放上來。
*/

.scene.prepare-door
.door-stage {
  opacity: 1;
}


/* 左右門片共同設定 */

.door-panel {
  position: absolute;

  top: 0;

  height: 100%;
  width: 50%;

  overflow: hidden;

  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;

  transform-style:
    preserve-3d;

  will-change:
    transform;

  transition:
    transform 1.75s
    cubic-bezier(.20,.72,.18,1);
}


/*
  門片不是另一張圖片，
  而是直接顯示 hsuan-gate.png
*/

.door-picture {
  position: absolute;

  pointer-events: none;

  background-image:
    url("hsuan-gate.png");

  background-repeat:
    no-repeat;

  will-change:
    transform;
}


/* 左門 */

.door-left {
  left: 0;

  transform-origin:
    left center;

  transform:
    rotateY(0deg);
}


/* 右門 */

.door-right {
  right: 0;

  transform-origin:
    right center;

  transform:
    rotateY(0deg);
}


/*
  開門角度不要 90 度，
  留一點門板厚度會比較真。
*/

.scene.opening
.door-left,

.scene.is-open
.door-left {
  transform:
    rotateY(76deg);
}


.scene.opening
.door-right,

.scene.is-open
.door-right {
  transform:
    rotateY(-76deg);
}


/* 門板打開時的陰影 */

.door-panel::after {
  content: "";

  position: absolute;
  inset: 0;

  pointer-events: none;

  opacity: 0;

  transition:
    opacity 1.2s ease;

  background:
    linear-gradient(
      to right,
      rgba(0,0,0,.28),
      transparent 35%,
      transparent 70%,
      rgba(0,0,0,.20)
    );
}


.scene.opening
.door-panel::after {
  opacity: .7;
}


/* =========================================================
   花瓣
========================================================= */

.petals {
  position: absolute;
  inset: 0;

  z-index: 35;

  overflow: hidden;

  pointer-events: none;
}


.petal {
  position: absolute;

  top: -12vh;

  width:
    var(--size);

  height:
    calc(var(--size) * 1.4);

  border-radius:
    80% 18% 76% 22%;

  background:
    radial-gradient(
      ellipse at 30% 26%,
      rgba(255,255,255,.98) 0%,
      rgba(255,233,240,.94) 35%,
      rgba(255,190,211,.88) 72%,
      rgba(224,128,158,.82) 100%
    );

  opacity:
    var(--opacity);

  animation:
    petalFall
    var(--duration)
    linear
    var(--delay)
    infinite;

  will-change:
    transform,
    opacity;
}


@keyframes petalFall {

  0% {
    transform:
      translate3d(0,-10vh,0)
      rotate(0deg);

    opacity: 0;
  }

  9% {
    opacity:
      var(--opacity);
  }

  35% {
    transform:
      translate3d(
        var(--d1),
        37vh,
        0
      )
      rotate(95deg);
  }

  68% {
    transform:
      translate3d(
        var(--d2),
        72vh,
        0
      )
      rotate(210deg);
  }

  100% {
    transform:
      translate3d(
        var(--d3),
        114vh,
        0
      )
      rotate(345deg);

    opacity: 0;
  }
}


/* =========================================================
   水盆
========================================================= */

.water-basin {
  position: absolute;

  left: 0;
  top: 0;

  width: 1px;
  height: 1px;

  z-index: 38;

  pointer-events: none;

  object-fit: fill;

  -webkit-mask-image:
    radial-gradient(
      ellipse 76% 76% at 63% 53%,
      #000 52%,
      rgba(0,0,0,.98) 68%,
      rgba(0,0,0,.72) 82%,
      rgba(0,0,0,.28) 92%,
      transparent 100%
    );

  mask-image:
    radial-gradient(
      ellipse 76% 76% at 63% 53%,
      #000 52%,
      rgba(0,0,0,.98) 68%,
      rgba(0,0,0,.72) 82%,
      rgba(0,0,0,.28) 92%,
      transparent 100%
    );
}


/* =========================================================
   點擊區
========================================================= */

.gate-button {
  position: absolute;

  z-index: 60;

  left: 30%;
  top: 20%;

  width: 40%;
  height: 58%;

  border: 0;
  padding: 0;

  background: transparent;

  cursor: pointer;

  touch-action:
    manipulation;

  -webkit-tap-highlight-color:
    transparent;
}


.scene.is-open
.gate-button {
  left: 0;
  top: 0;

  width: 100%;
  height: 100%;
}


/* =========================================================
   點三下提示
========================================================= */

.hint {
  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%,-50%);

  opacity: 0;

  white-space: nowrap;

  pointer-events: none;

  color:
    #fff4d3;

  font-size:
    clamp(
      15px,
      1.6vw,
      25px
    );

  letter-spacing:
    .12em;

  text-shadow:
    0 2px 5px #241006,
    0 4px 15px rgba(20,8,2,.95);

  transition:
    opacity .3s ease;
}


@media
(hover:hover)
and
(pointer:fine) {

  .scene:not(.is-open)
  .gate-button:hover
  .hint {
    opacity: 1;
  }

}


.gate-button.touch-hint
.hint {
  opacity: 1;
}


/* =========================================================
   歡迎區
========================================================= */

.welcome-stage {
  position: absolute;

  z-index: 50;

  left: 22%;
  top: 28%;

  width: 56%;
  height: 30%;

  overflow: visible;

  pointer-events: none;
}


.welcome-track {
  position: absolute;

  left: 0;
  top: 50%;

  width: 100%;

  display: flex;

  align-items: center;
  justify-content: center;

  gap:
    clamp(
      8px,
      1vw,
      16px
    );

  opacity: 0;

  visibility: hidden;

  transform:
    translate(105%,-50%);
}


.welcome-track.running {
  opacity: 1;

  visibility: visible;

  animation:
    snailCrawl
    18s
    linear
    both;
}


@keyframes snailCrawl {

  0% {
    transform:
      translate(105%,-50%);
  }

  30% {
    transform:
      translate(7%,-50%);
  }

  70% {
    transform:
      translate(-4%,-50%);
  }

  100% {
    transform:
      translate(-108%,-50%);
  }

}


.snail {
  width:
    clamp(
      55px,
      5.7vw,
      92px
    );

  height: auto;

  flex: none;

  filter:
    drop-shadow(
      0 3px 6px
      rgba(28,12,4,.5)
    );
}


.message-box {
  display: flex;

  flex-direction: column;

  align-items:
    flex-start;
}


.message {
  margin: 0;

  opacity: 0;

  color:
    #fff0c6;

  white-space:
    nowrap;

  filter:
    blur(15px);

  text-shadow:
    0 2px 4px #2d1608,
    0 4px 15px #1a0b04,
    0 0 20px rgba(217,157,77,.95);
}


.message.zh {
  font-size:
    clamp(
      16px,
      1.75vw,
      28px
    );
}


.message.en {
  margin-top: 4px;

  font-family:
    Baskerville,
    Georgia,
    serif;

  font-style: italic;

  font-size:
    clamp(
      13px,
      1.2vw,
      20px
    );
}


.message.reveal {
  animation:
    mistText
    5.4s
    ease-in-out
    both;
}


@keyframes mistText {

  0% {
    opacity: 0;

    filter:
      blur(15px);
  }

  18% {
    opacity: 1;

    filter:
      blur(0);
  }

  66% {
    opacity: 1;

    filter:
      blur(0);
  }

  100% {
    opacity: 0;

    filter:
      blur(10px);
  }

}


/* =========================================================
   手機
========================================================= */

@media
(max-width:768px) {

  .gate-button {
    left: 20%;
    top: 18%;

    width: 60%;
    height: 62%;
  }


  .welcome-stage {
    left: 12%;

    width: 76%;
  }


  .snail {
    width:
      clamp(
        42px,
        11vw,
        62px
      );
  }

}

</style>
</head>


<body>

<main
  class="scene"
  id="scene"
>


  <!-- 原本關門圖 -->

  <div
    class="background closed-background"
  ></div>


  <!-- 開門後庭院 -->

  <div
    class="background open-background"
  ></div>


  <!-- =====================================================
       真正旋轉的兩扇門
  ====================================================== -->

  <div
    class="door-stage"
    id="doorStage"
  >

    <div
      class="door-panel door-left"
    >

      <div
        class="door-picture"
        id="leftDoorPicture"
      ></div>

    </div>


    <div
      class="door-panel door-right"
    >

      <div
        class="door-picture"
        id="rightDoorPicture"
      ></div>

    </div>

  </div>


  <!-- 花瓣 -->

  <div
    class="petals"
    id="petals"
  ></div>


  <!-- 水盆 -->

  <img
    class="water-basin"
    id="waterBasin"
    src="hsuan-water-basin.webp"
    alt=""
  >


  <!-- 點擊大門 -->

  <button
    class="gate-button"
    id="gateButton"
    type="button"
  >

    <span
      class="hint"
    >
      點三下打開大門
    </span>

  </button>


  <!-- 歡迎 -->

  <div
    class="welcome-stage"
  >

    <div
      class="welcome-track"
      id="welcomeTrack"
    >

      <img
        class="snail"
        src="hsuan-snail.png"
        alt=""
        onerror="this.style.display='none'"
      >

      <div
        class="message-box"
      >

        <p
          class="message zh"
          id="zh"
        >
          歡迎來到 ASD 蝸小宣的家
        </p>

        <p
          class="message en"
          id="en"
        >
          WELCOME TO HSUAN WORLD
        </p>

      </div>

    </div>

  </div>

</main>


<script>

/* =========================================================
   元件
========================================================= */

const scene =
  document.getElementById(
    "scene"
  );

const gateButton =
  document.getElementById(
    "gateButton"
  );

const doorStage =
  document.getElementById(
    "doorStage"
  );

const leftDoorPicture =
  document.getElementById(
    "leftDoorPicture"
  );

const rightDoorPicture =
  document.getElementById(
    "rightDoorPicture"
  );

const waterBasin =
  document.getElementById(
    "waterBasin"
  );

const petals =
  document.getElementById(
    "petals"
  );

const welcomeTrack =
  document.getElementById(
    "welcomeTrack"
  );

const zh =
  document.getElementById(
    "zh"
  );

const en =
  document.getElementById(
    "en"
  );


/* =========================================================
   狀態
========================================================= */

let opened = false;

let knocks = 0;

let resetTimer = null;

let hintTimer = null;

let welcomeTimers = [];


/* =========================================================
   圖片原始尺寸

   目前仍依照網站原本 1536 × 947 座標。
========================================================= */

const SOURCE_W = 1536;
const SOURCE_H = 947;


/* =========================================================
   大門在原圖中的範圍

   如果之後只需要微調，
   就只需要動這四個數字。
========================================================= */

const DOOR = {

  x: 458,

  y: 216,

  width: 618,

  height: 505

};


/* =========================================================
   水盆
========================================================= */

const WATER = {

  x: 1200,

  y: 620,

  width: 336,

  height: 260

};


/* =========================================================
   cover 計算
========================================================= */

function getCoverInfo() {

  const w =
    scene.clientWidth;

  const h =
    scene.clientHeight;


  const scale =
    Math.max(
      w / SOURCE_W,
      h / SOURCE_H
    );


  const imageW =
    SOURCE_W * scale;

  const imageH =
    SOURCE_H * scale;


  return {

    scale,

    offsetX:
      (w - imageW) / 2,

    offsetY:
      (h - imageH) / 2,

    imageW,

    imageH

  };

}


/* =========================================================
   對齊 3D 門
========================================================= */

function positionDoors() {

  const cover =
    getCoverInfo();


  const x =
    cover.offsetX +
    DOOR.x *
    cover.scale;


  const y =
    cover.offsetY +
    DOOR.y *
    cover.scale;


  const w =
    DOOR.width *
    cover.scale;


  const h =
    DOOR.height *
    cover.scale;


  doorStage.style.left =
    x + "px";


  doorStage.style.top =
    y + "px";


  doorStage.style.width =
    w + "px";


  doorStage.style.height =
    h + "px";


  /*
    每一扇門裡面的背景，
    都仍然是完整原圖。

    所以不會出現另一種木紋。
  */

  const pics = [
    leftDoorPicture,
    rightDoorPicture
  ];


  pics.forEach(
    picture => {

      picture.style.width =
        cover.imageW + "px";

      picture.style.height =
        cover.imageH + "px";

      picture.style.backgroundSize =
        cover.imageW +
        "px " +
        cover.imageH +
        "px";

      picture.style.backgroundPosition =
        "0 0";

    }
  );


  /*
    左門：
    將完整原圖移動到正確位置。
  */

  leftDoorPicture.style.left =
    -(
      x -
      cover.offsetX
    )
    + "px";


  leftDoorPicture.style.top =
    -(
      y -
      cover.offsetY
    )
    + "px";


  /*
    右門容器從一半開始，
    因此多扣掉半扇門寬。
  */

  rightDoorPicture.style.left =
    -(
      x -
      cover.offsetX +
      w / 2
    )
    + "px";


  rightDoorPicture.style.top =
    -(
      y -
      cover.offsetY
    )
    + "px";

}


/* =========================================================
   水盆位置
========================================================= */

function positionWater() {

  const cover =
    getCoverInfo();


  waterBasin.style.left =
    (
      cover.offsetX +
      WATER.x *
      cover.scale
    )
    + "px";


  waterBasin.style.top =
    (
      cover.offsetY +
      WATER.y *
      cover.scale
    )
    + "px";


  waterBasin.style.width =
    (
      WATER.width *
      cover.scale
    )
    + "px";


  waterBasin.style.height =
    (
      WATER.height *
      cover.scale
    )
    + "px";

}


/* =========================================================
   花瓣
========================================================= */

function createPetals() {

  if (
    petals.dataset.ready
  ) {
    return;
  }


  petals.dataset.ready =
    "yes";


  for (
    let i = 0;
    i < 13;
    i++
  ) {

    const p =
      document.createElement(
        "span"
      );


    p.className =
      "petal";


    const side =
      Math.random() < .68;


    p.style.left =
      (
        side
          ? Math.random() * 32
          : 65 +
            Math.random() * 32
      )
      + "%";


    p.style.setProperty(
      "--size",
      (
        5 +
        Math.random() * 6
      )
      + "px"
    );


    p.style.setProperty(
      "--opacity",
      (
        .45 +
        Math.random() * .35
      )
    );


    p.style.setProperty(
      "--duration",
      (
        13 +
        Math.random() * 10
      )
      + "s"
    );


    p.style.setProperty(
      "--delay",
      (
        -Math.random() * 22
      )
      + "s"
    );


    p.style.setProperty(
      "--d1",
      (
        -20 +
        Math.random() * 50
      )
      + "px"
    );


    p.style.setProperty(
      "--d2",
      (
        -45 +
        Math.random() * 100
      )
      + "px"
    );


    p.style.setProperty(
      "--d3",
      (
        -80 +
        Math.random() * 160
      )
      + "px"
    );


    petals.appendChild(
      p
    );

  }

}


/* =========================================================
   歡迎動畫
========================================================= */

function clearWelcome() {

  welcomeTimers.forEach(
    clearTimeout
  );


  welcomeTimers = [];


  welcomeTrack.classList.remove(
    "running"
  );


  zh.classList.remove(
    "reveal"
  );


  en.classList.remove(
    "reveal"
  );


  void welcomeTrack.offsetWidth;

}


function welcomeLater(
  fn,
  time
) {

  welcomeTimers.push(

    setTimeout(
      fn,
      time
    )

  );

}


/* =========================================================
   開門
========================================================= */

function openGate() {

  opened = true;

  knocks = 0;


  clearTimeout(
    resetTimer
  );


  /*
    先讓原圖門片疊上去。
  */

  scene.classList.add(
    "prepare-door"
  );


  /*
    0.4 秒停頓，
    像真的敲完門後有人來開門。
  */

  setTimeout(
    () => {

      scene.classList.add(
        "opening"
      );

  }, 400);


  /*
    門開始旋轉約 0.1 秒後，
    才讓院子慢慢出現。
  */

  setTimeout(
    () => {

      scene.classList.add(
        "is-open"
      );

  }, 520);


  /*
    旋轉完畢，
    把額外門片隱藏掉。

    此時真正看到的是
    hsuan-gate-open.png。
  */

  setTimeout(
    () => {

      scene.classList.remove(
        "opening"
      );

      scene.classList.remove(
        "prepare-door"
      );

  }, 2350);


  clearWelcome();


  welcomeLater(
    () => {

      welcomeTrack.classList.add(
        "running"
      );

    },
    1800
  );


  welcomeLater(
    () => {

      zh.classList.add(
        "reveal"
      );

    },
    4200
  );


  welcomeLater(
    () => {

      en.classList.add(
        "reveal"
      );

    },
    9600
  );

}


/* =========================================================
   關門
========================================================= */

function closeGate() {

  opened = false;

  clearWelcome();


  /*
    關門時先重新放回門片，
    但門片一開始維持開啟角度。
  */

  scene.classList.add(
    "prepare-door"
  );

  scene.classList.add(
    "opening"
  );


  /*
    下一幀才取消 opening，
    門就會從 76 度關回 0 度。
  */

  requestAnimationFrame(
    () => {

      requestAnimationFrame(
        () => {

          scene.classList.remove(
            "opening"
          );

        }
      );

    }
  );


  /*
    關門背景逐漸回來。
  */

  setTimeout(
    () => {

      scene.classList.remove(
        "is-open"
      );

  }, 250);


  /*
    門關完，
    收掉額外門片。
  */

  setTimeout(
    () => {

      scene.classList.remove(
        "prepare-door"
      );

  }, 2050);

}


/* =========================================================
   點門
========================================================= */

function activateGate() {

  if (
    opened
  ) {

    closeGate();

    return;
  }


  const touch =
    window.matchMedia(
      "(hover:none)"
    ).matches;


  if (
    touch
  ) {

    gateButton.classList.add(
      "touch-hint"
    );


    clearTimeout(
      hintTimer
    );


    hintTimer =
      setTimeout(
        () => {

          gateButton.classList.remove(
            "touch-hint"
          );

        },
        1500
      );

  }


  knocks++;


  clearTimeout(
    resetTimer
  );


  resetTimer =
    setTimeout(
      () => {

        knocks = 0;

      },
      3000
    );


  if (
    knocks >= 3
  ) {

    openGate();

  }

}


/* =========================================================
   啟動
========================================================= */

gateButton.addEventListener(
  "click",
  activateGate
);


function updatePositions() {

  positionDoors();

  positionWater();

}


window.addEventListener(
  "load",
  () => {

    createPetals();

    updatePositions();

  }
);


window.addEventListener(
  "resize",
  updatePositions
);


window.addEventListener(
  "orientationchange",
  () => {

    setTimeout(
      updatePositions,
      180
    );

  }
);

</script>

</body>
