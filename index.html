<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24170e">

<title>ASD 蝸小宣的家｜HSUAN WORLD</title>

<style>

:root {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: #24170e;
  font-family:
    "Noto Serif TC",
    "Songti TC",
    "PMingLiU",
    serif;
}


/* ==================================================
   主場景
================================================== */

.scene {
  position: relative;

  width: 100%;
  height: 100vh;
  height: 100dvh;

  overflow: hidden;

  isolation: isolate;
}


/* ==================================================
   關門 / 開門背景
================================================== */

.picture {
  position: absolute;
  inset: 0;

  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;

  z-index: 0;
}


.closed {
  background-image:
    url("hsuan-gate.png");

  opacity: 1;

  transition:
    opacity 1.3s ease;
}


.opened {
  background-image:
    url("hsuan-gate-open.png");

  opacity: 0;

  transform:
    scale(1.018);

  transition:
    opacity 1.5s ease,
    transform 2.6s ease;
}


.scene.is-open .closed {
  opacity: 0;
}


.scene.is-open .opened {
  opacity: 1;

  transform:
    scale(1);
}


/* ==================================================
   底部陰影
================================================== */

.shade {
  position: absolute;
  inset: 0;

  z-index: 1;

  pointer-events: none;

  background:
    linear-gradient(
      to bottom,
      transparent 74%,
      rgba(12,7,4,.13)
    );
}


/* ==================================================
   櫻花枝輕晃
================================================== */

.branch {
  position: absolute;
  inset: 0;

  z-index: 2;

  pointer-events: none;

  opacity: .52;

  background:
    url("hsuan-gate.png")
    center / cover
    no-repeat;

  will-change:
    transform;
}


.scene.is-open .branch {
  background-image:
    url("hsuan-gate-open.png");
}


.branch-left {
  transform-origin:
    8% 4%;

  -webkit-mask-image:
    radial-gradient(
      ellipse 40% 28%
      at 8% 3%,
      #000 0%,
      transparent 95%
    );

  mask-image:
    radial-gradient(
      ellipse 40% 28%
      at 8% 3%,
      #000 0%,
      transparent 95%
    );

  animation:
    branchLeft
    8s
    ease-in-out
    infinite alternate;
}


.branch-right {
  transform-origin:
    92% 4%;

  -webkit-mask-image:
    radial-gradient(
      ellipse 38% 26%
      at 92% 3%,
      #000 0%,
      transparent 95%
    );

  mask-image:
    radial-gradient(
      ellipse 38% 26%
      at 92% 3%,
      #000 0%,
      transparent 95%
    );

  animation:
    branchRight
    9s
    ease-in-out
    infinite alternate;
}


@keyframes branchLeft {

  from {
    transform:
      rotate(-.35deg)
      translateX(-2px);
  }

  to {
    transform:
      rotate(.55deg)
      translateX(3px);
  }
}


@keyframes branchRight {

  from {
    transform:
      rotate(.35deg)
      translateX(2px);
  }

  to {
    transform:
      rotate(-.5deg)
      translateX(-3px);
  }
}


/* ==================================================
   花瓣
================================================== */

.petals {
  position: absolute;
  inset: 0;

  z-index: 3;

  overflow: hidden;

  pointer-events: none;
}


.petal {
  position: absolute;

  top: -12vh;

  width: var(--size);

  height:
    calc(var(--size) * 1.35);

  border-radius:
    80% 15% 75% 20%;

  background:
    radial-gradient(
      circle at 30% 25%,
      #fffaf7 0%,
      #ffdce7 50%,
      #e99aaf 100%
    );

  opacity: .78;

  box-shadow:
    0 0 4px
    rgba(255,222,231,.45);

  animation:
    petalFall
    var(--duration)
    linear
    var(--delay)
    infinite;
}


@keyframes petalFall {

  0% {
    transform:
      translate(0,-8vh)
      rotate(0deg);

    opacity: 0;
  }

  8% {
    opacity: .8;
  }

  50% {
    transform:
      translate(
        var(--half-drift),
        50vh
      )
      rotate(130deg);
  }

  100% {
    transform:
      translate(
        var(--drift),
        115vh
      )
      rotate(285deg);

    opacity: 0;
  }
}


/* ==================================================
   永久活水層
   門開 / 門關都一直運作
================================================== */

.water-fx {
  position: absolute;

  left: 0;
  top: 0;

  width: 1px;
  height: 1px;

  z-index: 40;

  pointer-events: none;

  overflow: visible;

  opacity: 1;

  visibility: visible;
}


/* ==================================================
   竹管水柱

   方向：
   右上 → 左下
================================================== */

.water-stream {
  position: absolute;

  /*
    竹管口偏右上
  */

  left: 78%;
  top: 2%;

  width: 2.4%;
  height: 56%;

  /*
    正角度往左下斜
  */

  transform:
    rotate(27deg);

  transform-origin:
    top center;

  border-radius:
    999px;

  background:
    linear-gradient(
      to right,

      rgba(255,255,255,0),

      rgba(225,247,255,.45) 16%,

      rgba(255,255,255,.98) 48%,

      rgba(196,234,249,.50) 73%,

      rgba(255,255,255,0)
    );

  box-shadow:
    0 0 3px rgba(240,252,255,.85),
    0 0 7px rgba(210,240,255,.30);

  opacity: .90;

  mix-blend-mode:
    screen;

  will-change:
    transform,
    opacity;

  animation:
    streamPulse
    .62s
    ease-in-out
    infinite alternate;
}


/* ==================================================
   水柱內的流動亮點
================================================== */

.water-stream::before,
.water-stream::after {

  content: "";

  position: absolute;

  left: 50%;

  width: 200%;
  height: 19%;

  transform:
    translateX(-50%);

  border-radius:
    999px;

  background:
    linear-gradient(
      to bottom,

      transparent,

      rgba(255,255,255,.98),

      transparent
    );

  animation:
    waterDropRun
    .82s
    linear
    infinite;
}


.water-stream::before {
  top: 4%;
}


.water-stream::after {
  top: 38%;

  animation-delay:
    -.41s;
}


@keyframes streamPulse {

  from {

    opacity: .63;

    transform:
      rotate(27deg)
      scaleX(.78);
  }

  to {

    opacity: .98;

    transform:
      rotate(27deg)
      scaleX(1.08);
  }
}


@keyframes waterDropRun {

  0% {

    transform:
      translate(-50%,-8px)
      scaleY(.55);

    opacity: 0;
  }

  18% {

    opacity: .95;
  }

  100% {

    transform:
      translate(-50%,72px)
      scaleY(1.45);

    opacity: 0;
  }
}


/* ==================================================
   水缽水面
================================================== */

.water-surface {
  position: absolute;

  left: 5%;
  top: 30%;

  width: 88%;
  height: 57%;

  border-radius:
    50%;

  overflow:
    hidden;

  transform:
    rotate(-4deg);

  opacity: .82;

  mix-blend-mode:
    screen;

  pointer-events:
    none;
}


/* 水面反光 */
.water-surface::before {

  content: "";

  position: absolute;
  inset: 0;

  border-radius:
    inherit;

  background:
    linear-gradient(
      108deg,

      transparent 4%,

      rgba(255,248,230,.10) 19%,

      rgba(255,241,204,.26) 30%,

      transparent 43%,

      rgba(208,239,249,.19) 58%,

      transparent 72%,

      rgba(255,246,219,.18) 87%,

      transparent
    );

  background-size:
    240% 100%;

  animation:
    waterSurfaceMove
    4.4s
    linear
    infinite;
}


/* 水面細波紋 */
.water-surface::after {

  content: "";

  position: absolute;
  inset: 0;

  border-radius:
    inherit;

  background:
    repeating-radial-gradient(
      ellipse at 54% 52%,

      rgba(240,250,255,.17)
      0 1px,

      transparent
      2px 8px
    );

  opacity: .35;

  animation:
    tinyWaterMove
    3s
    ease-in-out
    infinite alternate;
}


@keyframes waterSurfaceMove {

  from {
    background-position:
      120% 0;
  }

  to {
    background-position:
      -120% 0;
  }
}


@keyframes tinyWaterMove {

  from {

    transform:
      translateX(-3%)
      scaleX(1.01);

    opacity: .22;
  }

  to {

    transform:
      translateX(4%)
      scaleX(1.08);

    opacity: .48;
  }
}


/* ==================================================
   落水點

   配合斜水柱往左下移
================================================== */

.water-impact {
  position: absolute;

  left: 54%;
  top: 60%;

  width: 8%;

  aspect-ratio: 1;

  transform:
    translate(-50%,-50%);

  border-radius:
    50%;

  background:
    radial-gradient(
      circle,

      rgba(255,255,255,.95) 0%,

      rgba(221,244,251,.38) 29%,

      transparent 70%
    );

  mix-blend-mode:
    screen;

  animation:
    impactPulse
    1s
    ease-in-out
    infinite;
}


@keyframes impactPulse {

  0%,
  100% {

    opacity: .35;

    transform:
      translate(-50%,-50%)
      scale(.7);
  }

  50% {

    opacity: .95;

    transform:
      translate(-50%,-50%)
      scale(1.18);
  }
}


/* ==================================================
   三層漣漪
================================================== */

.ripple {
  position: absolute;

  left: 54%;
  top: 62%;

  width: 7%;
  height: 3.2%;

  transform:
    translate(-50%,-50%)
    scale(.2);

  border:
    1px solid
    rgba(238,249,255,.65);

  border-radius:
    50%;

  opacity: 0;

  mix-blend-mode:
    screen;

  animation:
    rippleSpread
    2.5s
    ease-out
    infinite;
}


.ripple.r2 {
  animation-delay:
    -.84s;
}


.ripple.r3 {
  animation-delay:
    -1.68s;
}


@keyframes rippleSpread {

  0% {

    transform:
      translate(-50%,-50%)
      scale(.18);

    opacity: 0;
  }

  12% {

    opacity: .66;
  }

  65% {

    opacity: .22;
  }

  100% {

    transform:
      translate(-50%,-50%)
      scale(5);

    opacity: 0;
  }
}


/* ==================================================
   金色水面流光
================================================== */

.water-glint {
  position: absolute;

  left: 8%;
  top: 46%;

  width: 84%;
  height: 20%;

  border-radius:
    50%;

  transform:
    rotate(-4deg);

  background:
    linear-gradient(
      105deg,

      transparent 0%,

      transparent 24%,

      rgba(255,236,193,.18) 37%,

      rgba(255,255,255,.42) 48%,

      rgba(208,239,248,.17) 57%,

      transparent 69%
    );

  background-size:
    240% 100%;

  opacity: .62;

  mix-blend-mode:
    screen;

  animation:
    glintMove
    4.4s
    linear
    infinite;
}


@keyframes glintMove {

  from {
    background-position:
      120% 0;
  }

  to {
    background-position:
      -120% 0;
  }
}


/* ==================================================
   大門操作區
================================================== */

.gate-button {
  position: absolute;

  z-index: 60;

  left: 32%;
  top: 18%;

  width: 36%;
  height: 65%;

  border: 0;
  padding: 0;

  background:
    transparent;

  color:
    #fff8e7;

  cursor:
    pointer;

  touch-action:
    manipulation;

  -webkit-tap-highlight-color:
    transparent;
}


.scene.is-open
.gate-button {

  left: 0;
  top: 0;

  width: 100%;
  height: 100%;
}


/* ==================================================
   點三下提示
================================================== */

.hint {
  position: absolute;

  left: 50%;
  top: 48%;

  transform:
    translate(-50%,-42%);

  opacity: 0;

  pointer-events:
    none;

  white-space:
    nowrap;

  font-size:
    clamp(
      16px,
      1.7vw,
      26px
    );

  letter-spacing:
    .12em;

  text-shadow:
    0 2px 9px
    rgba(19,11,6,.95),

    0 3px 22px
    rgba(19,11,6,.9);

  transition:
    opacity .35s ease,
    transform .35s ease;
}


@media
(hover:hover)
and
(pointer:fine) {

  .scene:not(.is-open)
  .gate-button:hover
  .hint {

    opacity: 1;

    transform:
      translate(-50%,-50%);
  }
}


.scene:not(.is-open)
.gate-button.touch-hint
.hint {

  opacity: 1;

  transform:
    translate(-50%,-50%);
}


/* ==================================================
   蝸小宣歡迎區
================================================== */

.welcome-stage {
  position: absolute;

  z-index: 50;

  left: 27%;
  top: 27%;

  width: 46%;
  height: 30%;

  overflow: hidden;

  pointer-events: none;
}


.welcome-track {
  position: absolute;

  left: 0;
  top: 50%;

  width: 100%;

  display: flex;

  align-items: center;
  justify-content: center;

  gap:
    clamp(
      8px,
      1vw,
      15px
    );

  opacity: 0;

  visibility: hidden;

  transform:
    translate(100%,-50%);
}


.welcome-track.running {

  opacity: 1;

  visibility: visible;

  animation:
    crawl
    16s
    linear
    both;
}


@keyframes crawl {

  0% {

    transform:
      translate(100%,-50%);
  }

  30% {

    transform:
      translate(5%,-50%);
  }

  72% {

    transform:
      translate(-4%,-50%);
  }

  100% {

    transform:
      translate(-100%,-50%);
  }
}


.snail {
  width:
    clamp(
      55px,
      5.5vw,
      90px
    );

  height:
    auto;

  flex:
    none;

  filter:
    drop-shadow(
      0 3px 6px
      rgba(31,14,4,.45)
    );
}


.message-box {
  display: flex;

  flex-direction:
    column;

  align-items:
    flex-start;

  justify-content:
    center;
}


.message {
  margin: 0;

  opacity: 0;

  filter:
    blur(14px);

  color:
    #fff0c4;

  white-space:
    nowrap;

  text-shadow:
    0 2px 4px #2d1608,
    0 4px 15px #1a0b04,
    0 0 20px rgba(217,157,77,.95);
}


.message.zh {

  font-size:
    clamp(
      16px,
      1.7vw,
      28px
    );
}


.message.en {

  margin-top:
    3px;

  font-family:
    Baskerville,
    Georgia,
    serif;

  font-style:
    italic;

  font-size:
    clamp(
      13px,
      1.2vw,
      20px
    );
}


.message.reveal {

  animation:
    mistText
    5.3s
    ease-in-out
    both;
}


@keyframes mistText {

  0% {

    opacity: 0;

    filter:
      blur(14px);
  }

  18% {

    opacity: 1;

    filter:
      blur(0);
  }

  66% {

    opacity: 1;

    filter:
      blur(0);
  }

  100% {

    opacity: 0;

    filter:
      blur(9px);
  }
}


/* ==================================================
   手機
================================================== */

@media
(max-width:768px) {

  .gate-button {

    left: 18%;
    top: 15%;

    width: 64%;
    height: 70%;
  }


  .welcome-stage {

    left: 15%;
    top: 27%;

    width: 70%;
    height: 32%;
  }


  .snail {

    width:
      clamp(
        42px,
        11vw,
        62px
      );
  }


  .message.zh {

    font-size:
      clamp(
        12px,
        3vw,
        19px
      );

    white-space:
      normal;
  }


  .message.en {

    font-size:
      clamp(
        10px,
        2.4vw,
        15px
      );

    white-space:
      normal;
  }
}

</style>
</head>


<body>

<main
  class="scene"
  id="scene"
>


  <div
    class="picture closed"
  ></div>


  <div
    class="picture opened"
  ></div>


  <div
    class="shade"
  ></div>


  <div
    class="branch branch-left"
  ></div>


  <div
    class="branch branch-right"
  ></div>


  <div
    class="petals"
    id="petals"
  ></div>


  <!-- ==================================================
       永久活水
  ================================================== -->

  <div
    class="water-fx"
    id="waterFx"
  >

    <span
      class="water-stream"
    ></span>

    <span
      class="water-surface"
    ></span>

    <span
      class="water-glint"
    ></span>

    <span
      class="water-impact"
    ></span>

    <span
      class="ripple r1"
    ></span>

    <span
      class="ripple r2"
    ></span>

    <span
      class="ripple r3"
    ></span>

  </div>


  <!-- ==================================================
       大門
  ================================================== -->

  <button
    class="gate-button"
    id="gateButton"
    type="button"
  >

    <span
      class="hint"
    >
      點三下打開大門
    </span>

  </button>


  <!-- ==================================================
       歡迎區
  ================================================== -->

  <div
    class="welcome-stage"
  >

    <div
      class="welcome-track"
      id="welcomeTrack"
    >

      <img
        class="snail"
        src="hsuan-snail.png"
        alt=""
        onerror="this.style.display='none'"
      >


      <div
        class="message-box"
      >

        <p
          class="message zh"
          id="zh"
        >
          歡迎來到 ASD 蝸小宣的家
        </p>


        <p
          class="message en"
          id="en"
        >
          WELCOME TO HSUAN WORLD
        </p>

      </div>

    </div>

  </div>

</main>


<script>


const scene =
  document.getElementById(
    "scene"
  );


const gateButton =
  document.getElementById(
    "gateButton"
  );


const welcomeTrack =
  document.getElementById(
    "welcomeTrack"
  );


const zh =
  document.getElementById(
    "zh"
  );


const en =
  document.getElementById(
    "en"
  );


const petalsLayer =
  document.getElementById(
    "petals"
  );


const waterFx =
  document.getElementById(
    "waterFx"
  );


let opened =
  false;


let knocks =
  0;


let resetTimer =
  null;


let hintTimer =
  null;


let timers =
  [];


/* ==================================================
   原始圖片尺寸
================================================== */

const SOURCE_W =
  1536;


const SOURCE_H =
  947;


/*
  精準框住：

  竹管出口
  ↓
  水柱
  ↓
  水缽

*/

const WATER_BOX = {

  x: 1235,

  y: 655,

  width: 301,

  height: 205

};


/* ==================================================
   水動畫對齊背景 cover
================================================== */

function positionWater() {


  const width =
    scene.clientWidth;


  const height =
    scene.clientHeight;


  const scale =
    Math.max(

      width / SOURCE_W,

      height / SOURCE_H

    );


  const renderedW =
    SOURCE_W
    *
    scale;


  const renderedH =
    SOURCE_H
    *
    scale;


  const offsetX =
    (
      width
      -
      renderedW
    )
    /
    2;


  const offsetY =
    (
      height
      -
      renderedH
    )
    /
    2;


  waterFx.style.left =
    (
      offsetX
      +
      WATER_BOX.x
      *
      scale
    )
    +
    "px";


  waterFx.style.top =
    (
      offsetY
      +
      WATER_BOX.y
      *
      scale
    )
    +
    "px";


  waterFx.style.width =
    (
      WATER_BOX.width
      *
      scale
    )
    +
    "px";


  waterFx.style.height =
    (
      WATER_BOX.height
      *
      scale
    )
    +
    "px";

}


/* ==================================================
   花瓣
================================================== */

function makePetals() {


  if (
    petalsLayer.dataset.ready
  ) {

    return;

  }


  petalsLayer.dataset.ready =
    "yes";


  for (
    let i = 0;
    i < 20;
    i++
  ) {


    const petal =
      document.createElement(
        "span"
      );


    const drift =
      Math.round(

        (
          Math.random()
          -
          .5
        )
        *
        170

      );


    petal.className =
      "petal";


    petal.style.left =
      (
        i % 2

        ? 3 + Math.random() * 25

        : 74 + Math.random() * 23
      )
      +
      "%";


    petal.style.setProperty(
      "--size",

      (
        5
        +
        Math.random()
        *
        6
      )
      .toFixed(1)
      +
      "px"
    );


    petal.style.setProperty(
      "--duration",

      (
        10
        +
        Math.random()
        *
        9
      )
      .toFixed(1)
      +
      "s"
    );


    petal.style.setProperty(
      "--delay",

      (
        -Math.random()
        *
        18
      )
      .toFixed(1)
      +
      "s"
    );


    petal.style.setProperty(
      "--half-drift",

      drift / 2
      +
      "px"
    );


    petal.style.setProperty(
      "--drift",

      drift
      +
      "px"
    );


    petalsLayer.appendChild(
      petal
    );

  }

}


/* ==================================================
   歡迎詞
================================================== */

function later(
  fn,
  delay
) {

  timers.push(

    window.setTimeout(
      fn,
      delay
    )

  );

}


function clearWelcome() {


  timers.forEach(
    window.clearTimeout
  );


  timers =
    [];


  welcomeTrack.classList.remove(
    "running"
  );


  zh.classList.remove(
    "reveal"
  );


  en.classList.remove(
    "reveal"
  );


  void welcomeTrack.offsetWidth;

}


/* ==================================================
   開門
================================================== */

function openGate() {


  opened =
    true;


  knocks =
    0;


  clearTimeout(
    resetTimer
  );


  clearTimeout(
    hintTimer
  );


  gateButton.classList.remove(
    "touch-hint"
  );


  scene.classList.add(
    "is-open"
  );


  clearWelcome();


  later(
    () => {

      welcomeTrack.classList.add(
        "running"
      );

    },
    1500
  );


  /*
    中文
  */

  later(
    () => {

      zh.classList.add(
        "reveal"
      );

    },
    3900
  );


  /*
    英文後出
  */

  later(
    () => {

      en.classList.add(
        "reveal"
      );

    },
    7500
  );

}


/* ==================================================
   關門
================================================== */

function closeGate() {


  opened =
    false;


  knocks =
    0;


  clearWelcome();


  scene.classList.remove(
    "is-open"
  );

}


/* ==================================================
   點門
================================================== */

function activateGate() {


  if (
    opened
  ) {

    closeGate();

    return;

  }


  if (
    window.matchMedia(
      "(hover:none)"
    )
    .matches
  ) {


    gateButton.classList.add(
      "touch-hint"
    );


    clearTimeout(
      hintTimer
    );


    hintTimer =
      setTimeout(
        () => {

          gateButton.classList.remove(
            "touch-hint"
          );

        },
        1800
      );

  }


  knocks++;


  clearTimeout(
    resetTimer
  );


  resetTimer =
    setTimeout(
      () => {

        knocks =
          0;

      },
      3000
    );


  if (
    knocks >= 3
  ) {

    openGate();

  }

}


gateButton.addEventListener(
  "click",
  activateGate
);


/* ==================================================
   網頁啟動
================================================== */

window.addEventListener(
  "load",
  () => {


    makePetals();


    positionWater();


    [
      "hsuan-gate-open.png",
      "hsuan-snail.png"
    ]
    .forEach(
      src => {


        const image =
          new Image();


        image.src =
          src;

      }
    );

  }
);


/* ==================================================
   視窗尺寸改變
================================================== */

window.addEventListener(
  "resize",
  positionWater
);


window.addEventListener(
  "orientationchange",
  () => {

    setTimeout(
      positionWater,
      180
    );

  }
);


if (
  "ResizeObserver"
  in
  window
) {


  const observer =
    new ResizeObserver(
      positionWater
    );


  observer.observe(
    scene
  );

}

</script>

</body>
</html>
