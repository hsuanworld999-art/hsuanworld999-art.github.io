<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>宣的世界｜走進庭院</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Noto Sans TC", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #241626;
    }

    button { font: inherit; }

    #stage {
      position: absolute;
      width: 1672px;
      height: 941px;
      left: 50%;
      top: 50%;
      transform-origin: center;
      overflow: hidden;
    }

    .scene, .cherry {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .scene { z-index: 0; }
    .cherry { z-index: 6; }

    .address {
      position: absolute;
      left: 116px;
      top: 402px;
      width: 136px;
      height: 87px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      color: #f6cf97;
      background: linear-gradient(135deg, #302017, #1b120f 60%, #392318);
      font-family: "Songti TC", "Noto Serif TC", "PMingLiU", serif;
      font-size: 19px;
      font-weight: 700;
      line-height: 1.32;
      letter-spacing: .02em;
      text-align: center;
      text-shadow: 0 1px 3px #000;
      pointer-events: none;
    }

    .address span { white-space: nowrap; }

    .doorway {
      position: absolute;
      left: 398px;
      top: 203px;
      width: 736px;
      height: 578px;
      perspective: 1150px;
      z-index: 3;
      pointer-events: none;
    }

    .leaf {
      position: absolute;
      top: 12px;
      height: 554px;
      width: 368px;
      background-image: url('gate-closed.png');
      background-size: 1672px 941px;
      background-repeat: no-repeat;
      backface-visibility: hidden;
      transform-style: preserve-3d;
      transition:
        transform 1.65s cubic-bezier(.23,.67,.19,1),
        filter 1.65s ease;
    }

    .leaf::after {
      content: "";
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 18px #200d07a6;
      pointer-events: none;
    }

    .leaf.left {
      left: 0;
      transform-origin: 0 50%;
      background-position: -398px -215px;
    }

    .leaf.right {
      right: 0;
      transform-origin: 100% 50%;
      background-position: -766px -215px;
    }

    #stage.open .leaf.left {
      transform: rotateY(-83deg);
      filter: brightness(.72);
    }

    #stage.open .leaf.right {
      transform: rotateY(83deg);
      filter: brightness(.72);
    }

    .gate-hit {
      position: absolute;
      left: 398px;
      top: 203px;
      width: 736px;
      height: 578px;
      z-index: 7;
      border: 0;
      background: transparent;
      cursor: pointer;
      color: transparent;
    }

    .gate-hit:focus-visible,
    .about:focus-visible {
      outline: 4px solid #fff;
      outline-offset: -5px;
    }

    .water-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    .snail[hidden] { display: none; }

    .petal {
      position: absolute;
      width: 13px;
      height: 9px;
      z-index: 8;
      background: #ffb7d0;
      border-radius: 85% 10% 85% 15%;
      box-shadow: 0 1px 5px #77284a80;
      pointer-events: none;
      opacity: 0;
      animation: fall 7s linear infinite;
    }

    .petal:nth-of-type(1) {
      left: 240px;
      top: 175px;
      animation-delay: 0s;
    }

    .petal:nth-of-type(2) {
      left: 526px;
      top: 110px;
      animation-delay: 2.5s;
    }

    .petal:nth-of-type(3) {
      left: 681px;
      top: 80px;
      animation-delay: 4.6s;
    }

    @keyframes fall {
      0% {
        opacity: 0;
        transform: translate(0,0) rotate(0);
      }
      12% { opacity: .95; }
      87% { opacity: .8; }
      100% {
        opacity: 0;
        transform: translate(170px,580px) rotate(660deg);
      }
    }

    .welcome {
      position: absolute;
      left: 488px;
      top: 337px;
      width: 657px;
      z-index: 2;
      text-align: center;
      color: #fff4df;
      opacity: 0;
      transform: translateY(15px);
      transition: opacity .7s .55s, transform .7s .55s;
      pointer-events: none;
      text-shadow: 0 3px 12px #25100d, 0 2px 3px #25100d;
    }

    #stage.open .welcome {
      opacity: 1;
      transform: translateY(0);
    }

    .welcome strong {
      display: block;
      font-family: "Songti TC", "Noto Serif TC", "PMingLiU", serif;
      font-weight: 700;
      font-size: 51px;
      letter-spacing: .16em;
    }

    .welcome .en {
      display: block;
      margin-top: 5px;
      font-size: 29px;
      letter-spacing: .08em;
      opacity: 0;
    }

    #stage.open .welcome .zh {
      animation: zhWelcome 7s 1.3s both;
    }

    #stage.open .welcome .en {
      animation: enWelcome 5s 8.3s both;
    }

    @keyframes zhWelcome {
      0% { opacity: 0; filter: blur(9px); }
      16%, 77% { opacity: 1; filter: blur(0); }
      100% { opacity: 0; filter: blur(8px); }
    }

    @keyframes enWelcome {
      0% { opacity: 0; filter: blur(9px); }
      20%, 82% { opacity: 1; filter: blur(0); }
      100% { opacity: 0; filter: blur(8px); }
    }

    .snail {
      position: absolute;
      left: 957px;
      top: 668px;
      width: 166px;
      height: 166px;
      object-fit: contain;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
    }

    #stage.open .snail {
      animation: crawl 9s 1.1s both linear;
    }

    @keyframes crawl {
      0% { opacity: 0; transform: translateX(0); }
      7%, 91% { opacity: 1; }
      100% { opacity: 0; transform: translateX(-415px); }
    }

    .about {
      position: absolute;
      left: 1257px;
      top: 361px;
      width: 278px;
      height: 133px;
      z-index: 9;
      border: 0;
      background: transparent;
      cursor: pointer;
      color: #fff;
    }

    .about span {
      display: inline-block;
      padding: 9px 18px;
      border-radius: 18px;
      background: #33201ddc;
      opacity: 0;
      transform: translateY(7px);
      transition: .2s;
      font-size: 23px;
    }

    .about:hover span,
    .about:focus-visible span {
      opacity: 1;
      transform: translateY(0);
    }

    .hint {
      position: absolute;
      bottom: 27px;
      left: 50%;
      z-index: 9;
      transform: translateX(-50%);
      opacity: 0;
      color: #fff8ec;
      background: #211818bd;
      border-radius: 999px;
      padding: 9px 20px;
      font-size: 18px;
      letter-spacing: .08em;
      white-space: nowrap;
      pointer-events: none;
      transition: opacity .4s;
    }

    #stage.show-hint:not(.open) .hint { opacity: 1; }
    #stage.open .hint { opacity: 0; }

    .enter {
      position: absolute;
      left: 50%;
      top: auto;
      bottom: 24px;
      width: 260px;
      z-index: 10;
      border: 1px solid #ffedc3;
      border-radius: 999px;
      padding: 13px 22px;
      background: #2b1918db;
      color: #fff5dc;
      font-size: 24px;
      letter-spacing: .12em;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, 12px);
      transition: opacity .5s, transform .5s, visibility 0s .5s;
    }

    #stage.open:not(.inside) .enter {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
      transition-delay: 13.5s, 13.5s, 13.5s;
    }

    .enter:hover,
    .enter:focus-visible {
      background: #5a3026f0;
      outline: 3px solid #fff2cf;
    }

    .house-view {
      position: absolute;
      inset: 0;
      z-index: 12;
      background: #241916;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.35s ease, visibility 0s 1.35s;
    }

    #stage.inside .house-view {
      opacity: 1;
      visibility: visible;
      transition: opacity 1.35s ease, visibility 0s;
    }

    .house-art {
      position: absolute;
      left: 50%;
      top: 50%;
      height: 100%;
      aspect-ratio: 1597 / 985;
      transform: translate(-50%, -50%) scale(1.045);
      transition: transform 2.1s ease-out;
    }

    #stage.inside .house-art {
      transform: translate(-50%, -50%) scale(1);
    }

    .house-art img,
    .house-water {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .house-water {
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .back {
      position: absolute;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 22px;
      border: 1px solid #ffe9bc;
      border-radius: 999px;
      color: #fff7e9;
      background: #281918dc;
      font-size: 22px;
      white-space: nowrap;
      cursor: pointer;
    }

    .back:hover,
    .back:focus-visible {
      background: #593123;
      outline: 3px solid #fff2cf;
    }

    dialog {
      border: 1px solid #f5d6ac;
      border-radius: 16px;
      background: #281b1c;
      color: #fff6e9;
      padding: 30px;
      max-width: min(90vw,480px);
      box-shadow: 0 20px 90px #0008;
    }

    dialog::backdrop { background: #130d12a8; }

    dialog button {
      padding: 8px 18px;
      border: 1px solid #d5b08b;
      border-radius: 9px;
      background: #503431;
      color: white;
      cursor: pointer;
    }

    @media (prefers-reduced-motion: reduce) {
      .leaf, .welcome, .house-view, .house-art {
        transition-duration: .01ms;
      }
      .petal { animation: none; }
      #stage.open .snail { animation: none; opacity: 1; }
      #stage.open .welcome .zh {
        animation: none;
        opacity: 1;
        filter: none;
      }
      #stage.open .welcome .en { animation: none; }
    }
  </style>
</head>

<body>
  <main id="stage">
    <img class="scene" src="gate-open-waterless.png"
         alt="黃昏中的日式庭院與固定的木造門框">

    <div class="address" aria-label="軟體動物市腹足區蝸牛路1號">
      <span>軟體動物市</span>
      <span>腹足區</span>
      <span>蝸牛路1號</span>
    </div>

    <div class="welcome" aria-live="polite">
      <strong class="zh">歡迎來到宣的世界</strong>
      <span class="en">Welcome to Hsuan World</span>
    </div>

    <div class="doorway" aria-hidden="true">
      <div class="leaf left"></div>
      <div class="leaf right"></div>
    </div>

    <canvas class="water-canvas" id="water-canvas"
            width="1672" height="941" aria-hidden="true"></canvas>

    <img class="snail" src="hsuan-snail.png" alt="" hidden>
    <img class="cherry" src="cherry-foreground.png" alt="" aria-hidden="true">

    <i class="petal"></i>
    <i class="petal"></i>
    <i class="petal"></i>

    <button class="gate-hit" type="button"
            aria-label="敲門三下，開啟大門"
            aria-expanded="false"></button>

    <button class="about" type="button" aria-label="關於宣的世界">
      <span>關於我</span>
    </button>

    <div class="hint" aria-hidden="true">敲門三下，進來看看</div>
    <button class="enter" type="button">走進庭院</button>

    <section class="house-view" aria-label="宣的世界庭院與房屋">
      <div class="house-art">
        <img src="house-correct-sign.png"
             alt="石板路通往木造房屋，右側蓮花池裡有小青蛙，入口內亮著螺紋蝸牛殼燈">
        <canvas class="house-water" width="1597" height="985"
                aria-hidden="true"></canvas>
      </div>
      <button class="back" type="button">← 返回大門</button>
    </section>
  </main>

  <dialog id="about-dialog">
    <h2>宣的世界</h2>
    <p>這裡可以放入原網站的「關於我」內容或連結。</p>
    <form method="dialog">
      <button>關閉</button>
    </form>
  </dialog>

  <script>
    const stage = document.querySelector('#stage');
    const gate = document.querySelector('.gate-hit');
    const about = document.querySelector('.about');
    const dialog = document.querySelector('#about-dialog');
    const enter = document.querySelector('.enter');
    const back = document.querySelector('.back');

    let knocks = 0;
    let lastKnock = 0;

    function fit() {
      const scale = Math.max(innerWidth / 1672, innerHeight / 941);
      stage.style.transform =
        `translate(-50%, -50%) scale(${scale})`;
    }

    addEventListener('resize', fit);
    fit();

    gate.addEventListener('pointerenter', () => {
      stage.classList.add('show-hint');
    });

    gate.addEventListener('pointerleave', () => {
      stage.classList.remove('show-hint');
    });

    gate.addEventListener('focus', () => {
      stage.classList.add('show-hint');
    });

    gate.addEventListener('blur', () => {
      stage.classList.remove('show-hint');
    });

    addEventListener('blur', () => {
      stage.classList.remove('show-hint');
    });

    gate.addEventListener('click', () => {
      if (stage.classList.contains('open')) {
        stage.classList.remove('open');
        gate.setAttribute('aria-expanded', 'false');
        gate.setAttribute('aria-label', '敲門三下，開啟大門');
        knocks = 0;
        return;
      }

      const now = performance.now();
      knocks = now - lastKnock > 2300 ? 1 : knocks + 1;
      lastKnock = now;

      if (knocks >= 3) {
        stage.classList.add('open');
        stage.classList.remove('show-hint');
        gate.setAttribute('aria-expanded', 'true');
        gate.setAttribute('aria-label', '關上大門');
        knocks = 0;
      }
    });

    about.addEventListener('click', () => dialog.showModal());

    enter.addEventListener('click', () => {
      stage.classList.add('inside');
      startPond();
      back.focus();
    });

    back.addEventListener('click', () => {
      stage.classList.remove('inside');
      enter.focus();
    });

    const snail = document.querySelector('.snail');

    snail.addEventListener('load', () => {
      snail.hidden = false;
    }, { once: true });

    if (snail.complete && snail.naturalWidth) {
      snail.hidden = false;
    }

    const scene = document.querySelector('.scene');
    const canvas = document.querySelector('#water-canvas');
    const ctx = canvas.getContext('2d');
    const reducedMotion =
      matchMedia('(prefers-reduced-motion: reduce)');

    const pond = document.querySelector('.house-water');
    const pondCtx = pond.getContext('2d');

    let pondActive = false;
    let previousPondFrame = 0;

    function drawPond(time) {
      if (!stage.classList.contains('inside') || reducedMotion.matches) {
        pondCtx.clearRect(0, 0, pond.width, pond.height);
        pondActive = false;
        return;
      }

      requestAnimationFrame(drawPond);
      if (time - previousPondFrame < 33) return;
      previousPondFrame = time;

      pondCtx.clearRect(0, 0, pond.width, pond.height);
      const seconds = time / 1000;

      const spots = [
        [1107, 824, 0],
        [1186, 911, .42],
        [1450, 811, .72]
      ];

      for (const [x, y, offset] of spots) {
        for (let i = 0; i < 3; i++) {
          const phase = (seconds * .34 + offset + i / 3) % 1;
          const radius = 5 + phase * 47;

          pondCtx.strokeStyle =
            `rgba(255,230,185,${.49 * (1 - phase)})`;
          pondCtx.lineWidth = 1.5 - phase * .55;

          pondCtx.beginPath();
          pondCtx.ellipse(
            x, y,
            radius, radius * .27,
            -.08, .12, Math.PI * 1.9
          );
          pondCtx.stroke();
        }
      }

      for (let i = 0; i < 14; i++) {
        const x =
          1030 + (i * 41) % 530 + Math.sin(seconds * .9 + i) * 9;
        const y = 844 + (i * 37) % 102;
        const shimmer =
          Math.max(0, Math.sin(seconds * 2.3 + i * 1.8));

        pondCtx.fillStyle =
          `rgba(255,221,163,${.24 * shimmer})`;

        pondCtx.beginPath();
        pondCtx.ellipse(
          x, y,
          3 + shimmer * 4, .8,
          -.1, 0, Math.PI * 2
        );
        pondCtx.fill();
      }
    }

    function startPond() {
      if (!pondCtx || pondActive || reducedMotion.matches) return;
      pondActive = true;
      requestAnimationFrame(drawPond);
    }

    let waterStarted = false;
    let previousFrame = 0;

    function drawWater(time) {
      if (reducedMotion.matches) {
        ctx.clearRect(0, 0, 1672, 941);
        waterStarted = false;
        return;
      }

      requestAnimationFrame(drawWater);
      if (time - previousFrame < 33) return;
      previousFrame = time;

      const seconds = time / 1000;
      ctx.clearRect(1420, 672, 230, 145);

      ctx.save();
      ctx.beginPath();
      ctx.ellipse(1534, 772, 77, 14, -.035, 0, Math.PI * 2);
      ctx.clip();
      ctx.globalAlpha = .97;

      for (let y = 755; y < 790; y += 2) {
        const horizontal =
          Math.sin(y * .29 + seconds * 3.1) * 4.4 +
          Math.sin(y * .13 - seconds * 1.7) * 2.2;
        const vertical =
          Math.sin(y * .37 + seconds * 2.2) * 1.4;

        ctx.drawImage(
          scene,
          1448 + horizontal, y + vertical, 174, 2.4,
          1448, y, 174, 2.4
        );
      }

      ctx.globalAlpha = 1;

      for (let i = 0; i < 7; i++) {
        const x =
          1460 + i * 23 + Math.sin(seconds * 2.4 + i * 2) * 11;
        const y =
          769 + Math.sin(seconds * 3.2 + i * 2.3) * 5;

        const glow =
          ctx.createLinearGradient(x - 15, y, x + 18, y);

        glow.addColorStop(0, 'rgba(255,229,171,0)');
        glow.addColorStop(
          .5,
          `rgba(255,237,204,${.28 + .20 * Math.sin(seconds * 3 + i) ** 2})`
        );
        glow.addColorStop(1, 'rgba(255,229,171,0)');

        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.ellipse(x, y, 20, 1.7, -.08, 0, Math.PI * 2);
        ctx.fill();
      }

      for (let i = 0; i < 3; i++) {
        const phase = (seconds * 1.3 + i / 3) % 1;
        ctx.strokeStyle =
          `rgba(255,239,212,${.44 * (1 - phase)})`;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.ellipse(
          1543, 775,
          6 + phase * 37, 2 + phase * 9,
          -.05, -.2, 2.5
        );
        ctx.stroke();
      }

      ctx.restore();

      const waterX = p =>
        1563 -
        22 * Math.sin(p * Math.PI / 2) +
        Math.sin(seconds * 9 + p * 12) * 1.1 * p;

      const waterY = p => 676 + 101 * p;

      const stream =
        ctx.createLinearGradient(1538, 685, 1567, 685);

      stream.addColorStop(0, 'rgba(137,203,218,.45)');
      stream.addColorStop(.43, 'rgba(235,248,245,.85)');
      stream.addColorStop(1, 'rgba(255,230,183,.54)');

      ctx.lineCap = 'round';
      ctx.strokeStyle = stream;
      ctx.lineWidth = 7;
      ctx.beginPath();

      for (let j = 0; j <= 24; j++) {
        const p = j / 24;
        if (j === 0) {
          ctx.moveTo(waterX(p), waterY(p));
        } else {
          ctx.lineTo(waterX(p), waterY(p));
        }
      }

      ctx.stroke();

      for (let i = 0; i < 18; i++) {
        const progress = (i / 18 + seconds * .8) % 1;
        const x =
          waterX(progress) + Math.sin(i * 13.2) * 2;
        const y = waterY(progress);

        ctx.fillStyle =
          `rgba(255,255,245,${.35 + .48 * Math.sin(Math.PI * progress)})`;

        ctx.beginPath();
        ctx.ellipse(x, y, 1.6, 3.7, -.17, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function startWater() {
      if (!ctx || waterStarted || !scene.naturalWidth ||
          reducedMotion.matches) return;

      waterStarted = true;
      requestAnimationFrame(drawWater);
    }

    scene.addEventListener('load', startWater);
    if (scene.complete) startWater();
    reducedMotion.addEventListener('change', startWater);
  </script>
</body>
</html>
