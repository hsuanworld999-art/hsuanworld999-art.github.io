<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f130d" />
  <title>ASD 蝸小宣的家｜HSUAN WORLD</title>

  <style>
    :root{
      --bg:#1f130d;

      /* ===== 1536 x 864 關門圖對位 ===== */
      --door-top:23.35%;
      --door-left:32.18%;
      --door-width:17.95%;
      --door-height:51.95%;

      --hole-left:32.08%;
      --hole-top:23.20%;
      --hole-width:35.88%;
      --hole-height:52.20%;

      /* 開門庭院圖裁切定位（hsuan-gate-open.png） */
      --open-left:-89.60%;
      --open-top:-49.90%;
      --open-width:278.80%;
      --open-height:211.20%;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--bg);
      font-family:
        "Noto Serif TC",
        "PingFang TC",
        "Microsoft JhengHei",
        serif;
    }

    body{
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .page{
      position:relative;
      width:100vw;
      height:100vh;
      height:100dvh;
      overflow:hidden;
      background:
        radial-gradient(circle at 50% 20%, rgba(255,190,120,.08), transparent 42%),
        linear-gradient(to bottom, #2b1a12, #17100b);
    }

    /* 讓底圖永遠完整顯示，不用 cover，這樣門位才不會跑掉 */
    .stage{
      position:absolute;
      inset:0;
      margin:auto;
      width:min(100vw, calc(100dvh * 1536 / 864));
      height:min(100dvh, calc(100vw * 864 / 1536));
      aspect-ratio:1536 / 864;
      overflow:hidden;
      isolation:isolate;
      user-select:none;
      touch-action:manipulation;
      perspective:2200px;
    }

    .master-bg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:fill;
      display:block;
      z-index:1;
      pointer-events:none;
    }

    /* ===== 門洞內的庭院，只露在門框內 ===== */
    .open-crop{
      position:absolute;
      left:var(--hole-left);
      top:var(--hole-top);
      width:var(--hole-width);
      height:var(--hole-height);
      overflow:hidden;
      z-index:2;
      opacity:0;
      transform:scale(1.01);
      transition:
        opacity .45s ease,
        transform 1.2s ease;
      pointer-events:none;
      clip-path:polygon(1.2% 0%, 98.8% 0%, 100% 100%, 0% 100%);
      box-shadow:
        inset 0 0 20px rgba(0,0,0,.18),
        inset 0 0 70px rgba(0,0,0,.10);
    }

    .stage.is-open .open-crop{
      opacity:1;
      transform:scale(1);
    }

    .open-full{
      position:absolute;
      left:var(--open-left);
      top:var(--open-top);
      width:var(--open-width);
      height:var(--open-height);
      object-fit:fill;
      display:block;
      filter:saturate(1.04) brightness(1.03);
      transform:scale(1.01);
      transition:transform 1.6s ease;
      pointer-events:none;
    }

    .stage.is-open .open-full{
      transform:scale(1);
    }

    /* ===== 櫻花枝搖曳（只動角落，不動整張圖） ===== */
    .branch{
      position:absolute;
      inset:0;
      z-index:4;
      pointer-events:none;
      background-image:url("hsuan-gate.png");
      background-size:100% 100%;
      background-repeat:no-repeat;
      opacity:.96;
      will-change:transform;
      mix-blend-mode:normal;
    }

    .branch-left{
      clip-path:polygon(0 0, 46% 0, 28% 34%, 0 48%);
      transform-origin:10% 8%;
      animation:branchLeftSway 9.5s ease-in-out infinite;
    }

    .branch-right{
      clip-path:polygon(55% 0, 100% 0, 100% 44%, 73% 34%);
      transform-origin:92% 10%;
      animation:branchRightSway 11s ease-in-out infinite;
    }

    @keyframes branchLeftSway{
      0%,100%{ transform:rotate(-0.15deg) translateX(0) translateY(0); }
      20%{ transform:rotate(0.50deg) translateX(2px) translateY(0); }
      50%{ transform:rotate(-0.35deg) translateX(-1px) translateY(1px); }
      75%{ transform:rotate(0.72deg) translateX(3px) translateY(1px); }
    }

    @keyframes branchRightSway{
      0%,100%{ transform:rotate(0.12deg) translateX(0) translateY(0); }
      25%{ transform:rotate(-0.55deg) translateX(-2px) translateY(0); }
      55%{ transform:rotate(0.32deg) translateX(1px) translateY(1px); }
      80%{ transform:rotate(-0.75deg) translateX(-3px) translateY(1px); }
    }

    /* ===== 飄落花瓣 ===== */
    .petals{
      position:absolute;
      inset:0;
      overflow:hidden;
      z-index:5;
      pointer-events:none;
    }

    .petal{
      position:absolute;
      top:-12%;
      width:var(--size);
      height:calc(var(--size) * 1.28);
      background:
        radial-gradient(circle at 30% 28%, rgba(255,255,255,.95), rgba(255,221,233,.95) 45%, rgba(240,154,179,.95) 100%);
      border-radius:85% 15% 80% 20%;
      opacity:.88;
      box-shadow:0 0 5px rgba(255,220,232,.45);
      animation:petalFall var(--duration) linear var(--delay) infinite;
      transform:rotate(var(--r));
    }

    @keyframes petalFall{
      0%{
        transform:translate3d(0,-8vh,0) rotate(0deg);
        opacity:0;
      }
      10%{
        opacity:.88;
      }
      50%{
        transform:translate3d(var(--drift-mid),50vh,0) rotate(140deg);
      }
      100%{
        transform:translate3d(var(--drift-end),115vh,0) rotate(300deg);
        opacity:0;
      }
    }

    /* ===== 流水水盆 ===== */
    .water-basin{
      position:absolute;
      right:1.2%;
      bottom:2.0%;
      width:17.5%;
      z-index:6;
      pointer-events:none;
      filter:
        drop-shadow(0 6px 12px rgba(0,0,0,.20))
        drop-shadow(0 2px 3px rgba(0,0,0,.18));
    }

    .water-basin img{
      display:block;
      width:100%;
      height:auto;
    }

    /* ===== 左右木門 ===== */
    .doors{
      position:absolute;
      inset:0;
      z-index:7;
      pointer-events:none;
      transform-style:preserve-3d;
    }

    .door{
      position:absolute;
      top:var(--door-top);
      width:var(--door-width);
      height:var(--door-height);
      object-fit:contain;
      display:block;
      will-change:transform;
      transition:
        transform 1.55s cubic-bezier(.2,.78,.15,1),
        filter 1.2s ease,
        opacity .6s ease;
      filter:
        drop-shadow(0 10px 12px rgba(0,0,0,.14))
        drop-shadow(0 2px 3px rgba(0,0,0,.10));
      backface-visibility:hidden;
      transform-style:preserve-3d;
    }

    .door-left{
      left:var(--door-left);
      transform-origin:right center;
      transform:translateX(0) rotateY(0deg);
    }

    .door-right{
      left:calc(var(--door-left) + var(--door-width));
      transform-origin:left center;
      transform:translateX(0) rotateY(0deg);
    }

    .stage.is-open .door-left{
      transform:
        perspective(2200px)
        translateX(-1.8%)
        rotateY(-108deg);
      filter:
        drop-shadow(20px 8px 12px rgba(0,0,0,.18))
        drop-shadow(0 2px 3px rgba(0,0,0,.08));
    }

    .stage.is-open .door-right{
      transform:
        perspective(2200px)
        translateX(1.8%)
        rotateY(108deg);
      filter:
        drop-shadow(-20px 8px 12px rgba(0,0,0,.18))
        drop-shadow(0 2px 3px rgba(0,0,0,.08));
    }

    /* ===== 點擊區 ===== */
    .gate-hitbox{
      position:absolute;
      left:27%;
      top:16%;
      width:46%;
      height:66%;
      z-index:10;
      border:0;
      background:transparent;
      cursor:pointer;
      padding:0;
      color:#fff7e8;
    }

    .stage.is-open .gate-hitbox{
      left:0;
      top:0;
      width:100%;
      height:100%;
    }

    .gate-hitbox:focus-visible{
      outline:2px solid rgba(255,245,210,.95);
      outline-offset:-4px;
    }

    .hint{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%, -50%);
      opacity:0;
      pointer-events:none;
      white-space:nowrap;
      font-size:clamp(18px, 1.65vw, 28px);
      letter-spacing:.12em;
      color:#fff7e8;
      text-shadow:
        0 2px 10px rgba(26,14,7,.86),
        0 0 18px rgba(26,14,7,.42);
      transition:
        opacity .28s ease,
        transform .28s ease;
    }

    @media (hover:hover) and (pointer:fine){
      .stage:not(.is-open) .gate-hitbox:hover .hint{
        opacity:1;
        transform:translate(-50%, -54%);
      }
    }

    .gate-hitbox.show-hint .hint{
      opacity:1;
      transform:translate(-50%, -54%);
    }

    /* ===== 歡迎詞與蝸小宣 ===== */
    .welcome{
      position:absolute;
      left:var(--hole-left);
      top:calc(var(--hole-top) + 2.5%);
      width:var(--hole-width);
      height:calc(var(--hole-height) - 5%);
      z-index:8;
      pointer-events:none;
      overflow:hidden;
      opacity:0;
    }

    .welcome.play{
      opacity:1;
    }

    .welcome-snail{
      position:absolute;
      bottom:3%;
      width:clamp(50px, 6vw, 94px);
      height:auto;
      right:-20%;
      opacity:0;
      filter:drop-shadow(0 4px 10px rgba(30,15,6,.32));
    }

    .welcome.play .welcome-snail{
      animation:snailWalk 10s linear both;
    }

    @keyframes snailWalk{
      0%{
        right:-20%;
        opacity:0;
        transform:translateY(0) scale(.94);
      }
      8%{
        opacity:1;
      }
      38%{
        right:46%;
        opacity:1;
        transform:translateY(-1px) scale(1);
      }
      72%{
        right:38%;
        opacity:1;
        transform:translateY(1px) scale(1);
      }
      100%{
        right:112%;
        opacity:0;
        transform:translateY(0) scale(.98);
      }
    }

    .welcome-text{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      width:82%;
      text-align:center;
      color:#fff3d1;
      opacity:0;
      filter:blur(18px);
      text-shadow:
        0 2px 8px rgba(35,17,7,.8),
        0 0 16px rgba(230,173,89,.45);
      line-height:1.4;
      white-space:nowrap;
    }

    .welcome-text.zh{
      top:18%;
      font-size:clamp(18px, 2vw, 32px);
      letter-spacing:.08em;
      font-weight:600;
    }

    .welcome-text.en{
      top:40%;
      font-size:clamp(14px, 1.45vw, 24px);
      letter-spacing:.11em;
      font-weight:600;
    }

    .welcome.play .welcome-text.zh{
      animation:fogText 3.9s ease 1.15s both;
    }

    .welcome.play .welcome-text.en{
      animation:fogText 3.9s ease 5.25s both;
    }

    @keyframes fogText{
      0%{
        opacity:0;
        filter:blur(18px);
        transform:translateX(calc(-50% + 34px));
      }
      18%{
        opacity:1;
        filter:blur(0);
        transform:translateX(-50%);
      }
      75%{
        opacity:1;
        filter:blur(0);
        transform:translateX(-50%);
      }
      100%{
        opacity:0;
        filter:blur(10px);
        transform:translateX(calc(-50% - 38px));
      }
    }

    /* 微弱夜景層次 */
    .vignette{
      position:absolute;
      inset:0;
      z-index:11;
      pointer-events:none;
      background:
        radial-gradient(circle at 50% 36%, transparent 45%, rgba(0,0,0,.06) 74%, rgba(0,0,0,.18) 100%),
        linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,.08));
    }

    /* 手機微調 */
    @media (max-width: 768px){
      .hint{
        font-size:15px;
        letter-spacing:.06em;
      }

      .water-basin{
        width:21.5%;
        right:1.0%;
        bottom:1.8%;
      }

      .welcome-text.zh{
        font-size:clamp(13px, 3.2vw, 18px);
        white-space:normal;
      }

      .welcome-text.en{
        font-size:clamp(11px, 2.6vw, 15px);
        white-space:normal;
      }

      .welcome-snail{
        width:clamp(38px, 10vw, 62px);
      }
    }

    @media (prefers-reduced-motion: reduce){
      .branch,
      .petal,
      .welcome-snail,
      .welcome-text{
        animation:none !important;
      }

      .open-crop,
      .open-full,
      .door{
        transition:none !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="stage" id="stage" aria-label="HSUAN WORLD 大門入口">
      <img class="master-bg" src="hsuan-gate.png" alt="ASD 蝸小宣的家大門" />

      <!-- 只顯示在門洞裡的開門庭院 -->
      <div class="open-crop" aria-hidden="true">
        <img class="open-full" src="hsuan-gate-open.png" alt="" />
      </div>

      <!-- 角落櫻花枝微微搖動 -->
      <div class="branch branch-left" aria-hidden="true"></div>
      <div class="branch branch-right" aria-hidden="true"></div>

      <!-- 飄落花瓣 -->
      <div class="petals" id="petals" aria-hidden="true"></div>

      <!-- 流水水盆 -->
      <div class="water-basin" aria-hidden="true">
        <img src="hsuan-water-basin.webp" alt="" />
      </div>

      <!-- 左右門片 -->
      <div class="doors" aria-hidden="true">
        <img class="door door-left" src="hsuan-gate-left.png" alt="" />
        <img class="door door-right" src="hsuan-gate-right.png" alt="" />
      </div>

      <!-- 操作區 -->
      <button
        class="gate-hitbox"
        id="gateHitbox"
        type="button"
        aria-label="點三下打開大門"
      >
        <span class="hint">點三下打開大門</span>
      </button>

      <!-- 歡迎詞 -->
      <div class="welcome" id="welcome" aria-hidden="true">
        <img class="welcome-snail" src="hsuan-snail.png" alt="" />
        <div class="welcome-text zh">歡迎來到 ASD 蝸小宣的家</div>
        <div class="welcome-text en">WELCOME TO HSUAN WORLD</div>
      </div>

      <div class="vignette" aria-hidden="true"></div>
    </section>
  </main>

  <script>
    const stage = document.getElementById("stage");
    const gateHitbox = document.getElementById("gateHitbox");
    const welcome = document.getElementById("welcome");
    const petals = document.getElementById("petals");

    let isOpen = false;
    let clickCount = 0;
    let clickResetTimer = null;
    let hintTimer = null;
    let openSoundTimer = null;
    let welcomeTimer = null;

    // ===== 預載入 =====
    window.addEventListener("load", () => {
      [
        "hsuan-gate.png",
        "hsuan-gate-open.png",
        "hsuan-gate-left.png",
        "hsuan-gate-right.png",
        "hsuan-snail.png",
        "hsuan-water-basin.webp"
      ].forEach(src => {
        const img = new Image();
        img.src = src;
      });
    });

    // ===== 花瓣 =====
    function createPetals() {
      petals.innerHTML = "";
      const total = 24;

      for (let i = 0; i < total; i++) {
        const petal = document.createElement("span");
        petal.className = "petal";

        const fromLeftSide = i % 2 === 0;
        const startX = fromLeftSide
          ? 2 + Math.random() * 28
          : 69 + Math.random() * 27;

        const drift1 = ((Math.random() - 0.5) * 60).toFixed(0) + "px";
        const drift2 = ((Math.random() - 0.5) * 150).toFixed(0) + "px";

        petal.style.left = startX + "%";
        petal.style.setProperty("--size", (5 + Math.random() * 7).toFixed(1) + "px");
        petal.style.setProperty("--duration", (9 + Math.random() * 9).toFixed(1) + "s");
        petal.style.setProperty("--delay", (-Math.random() * 16).toFixed(1) + "s");
        petal.style.setProperty("--drift-mid", drift1);
        petal.style.setProperty("--drift-end", drift2);
        petal.style.setProperty("--r", Math.round(Math.random() * 40 - 20) + "deg");

        petals.appendChild(petal);
      }
    }
    createPetals();

    // ===== 聲音 =====
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function ensureAudio() {
      if (!AudioCtx) return null;
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    function beep(freq, duration, type = "triangle", volume = 0.03, delay = 0) {
      const ctx = ensureAudio();
      if (!ctx) return;

      const now = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

    function playKnock() {
      beep(180, 0.06, "square", 0.018, 0);
      beep(110, 0.09, "triangle", 0.028, 0.012);
    }

    function playDoorOpen() {
      beep(130, 0.16, "sine", 0.022, 0);
      beep(86, 0.22, "triangle", 0.028, 0.08);
    }

    function playDoorClose() {
      beep(118, 0.15, "sine", 0.02, 0);
      beep(72, 0.24, "triangle", 0.03, 0.08);
    }

    // ===== 提示 =====
    function showHintBriefly() {
      gateHitbox.classList.add("show-hint");
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => {
        gateHitbox.classList.remove("show-hint");
      }, 1400);
    }

    // ===== 開關門 =====
    function clearTimers() {
      clearTimeout(clickResetTimer);
      clearTimeout(openSoundTimer);
      clearTimeout(welcomeTimer);
    }

    function openGate() {
      clearTimers();
      isOpen = true;
      clickCount = 0;

      stage.classList.add("is-open");
      gateHitbox.setAttribute("aria-label", "點一下關上大門");

      openSoundTimer = setTimeout(() => {
        playDoorOpen();
      }, 120);

      welcome.classList.remove("play");
      void welcome.offsetWidth;

      welcomeTimer = setTimeout(() => {
        welcome.classList.add("play");
      }, 850);
    }

    function closeGate() {
      clearTimers();
      isOpen = false;
      clickCount = 0;

      playDoorClose();
      stage.classList.remove("is-open");
      gateHitbox.setAttribute("aria-label", "點三下打開大門");

      welcome.classList.remove("play");
    }

    function onGateClick() {
      if (isOpen) {
        closeGate();
        return;
      }

      showHintBriefly();
      playKnock();

      clickCount += 1;

      clearTimeout(clickResetTimer);
      clickResetTimer = setTimeout(() => {
        clickCount = 0;
      }, 2200);

      if (clickCount >= 3) {
        openGate();
      }
    }

    gateHitbox.addEventListener("click", onGateClick);

    gateHitbox.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        onGateClick();
      }
    });
  </script>
</body>
</html>
